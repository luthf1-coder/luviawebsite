<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROGRAM TV - LUVIA STUDIO</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="Asset Foto/Thumbnimail .png">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <nav>
        <div class="container nav-container">
            <!-- Tambahan tombol Hamburger -->
            <button class="hamburger-menu" onclick="toggleSidebar()" title="Menu">☰</button>
            
            <div class="nav-history-controls">
                <button onclick="history.back()" class="btn-nav-history" title="Kembali">←</button>
            </div>
            <div class="nav-links">
                <a href="index.html">Beranda</a>
                <a href="index.html#projects">Program TV</a>
            </div>
        </div>
    </nav>

<!-- KODE SIDEBAR -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="index.html" title="Kembali ke Beranda" style="display: flex; align-items: center;">
                <img src="Asset Foto/Thumbnimail .png" alt="Logo" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid white;">
            </a>
            <h2>MENU</h2>
            <button class="close-btn" onclick="toggleSidebar()">×</button>
        </div>
        <div class="sidebar-links">
            <a href="index.html" onclick="toggleSidebar()">Beranda</a>
            <a href="videos.html" onclick="toggleSidebar()">Video</a>
            <a href="index.html#projects" onclick="toggleSidebar()">Program TV</a>
            <a href="index.html#livestreaming" onclick="toggleSidebar()">Live Streaming</a>
            <a href="support.html">Pusat Bantuan</a>
            <a href="index.html#about" onclick="toggleSidebar()">Tentang</a>
            <a href="index.html#contact" onclick="toggleSidebar()">Social Media</a>
        </div>
        <div class="sidebar-footer">
            <p>&copy; 2026 LUVIA STUDIO TV. All Right Reserved</p>
        </div>
    </div>
    
    <main class="container page-stream-container">
        <!-- DETAIL PROGRAM TV OTOMATIS BERUBAH -->
        <section class="program-detail-card">
            <h1 class="stream-title" id="tampil-judul">Memuat Program...</h1>
            <div class="thumb-box program-banner">
                <img id="tampil-banner" src="Asset Foto/Thumbnimail  Banner YT.png" alt="Banner Program">
            </div>
            <div class="program-description">
                <h2>Tentang Acara Ini</h2>
                <p id="tampil-desc">...</p>
                <p><strong>Jadwal Tayang:</strong> <span id="tampil-jadwal">...</span></p>
            </div>
        </section>

        <!-- DAFTAR VIDEO DALAM PROGRAM INI -->
        <section style="margin-top: 40px;">
            <h2>Video dalam Program Ini</h2>
            <div class="video-grid" id="playlist-container">
                <p style="color: #bbb;">Memuat daftar tayangan...</p>
            </div>
        </section>
    </main>

    <footer><div class="container"><p>&copy 2026 LUVIA STUDIO TV</p></div></footer>

    <script src="videos-data.js"></script>
    <script>

// FUNGSI UNTUK MEMBUKA & MENUTUP SIDEBAR
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }
        
        function muatHalamanProgram() {
            // Ambil ID Program dari Link (misal: program.html?id=livemusic)
            const params = new URLSearchParams(window.location.search);
            const progId = params.get('id');

            if (!progId) {
                document.getElementById('tampil-judul').innerText = "Program Tidak Ditemukan";
                return;
            }

            // 1. Ambil Detail Judul & Banner dari Firebase
            firebase.database().ref('programs_info/' + progId).once('value', snap => {
                if (snap.exists()) {
                    const prog = snap.val();
                    document.getElementById('tampil-judul').innerText = "PROGRAM: " + prog.title.toUpperCase();
                    if(prog.banner) document.getElementById('tampil-banner').src = prog.banner;
                    document.getElementById('tampil-desc').innerText = prog.desc;
                    document.getElementById('tampil-jadwal').innerText = prog.schedule;
                    document.title = "PROGRAM: " + prog.title + " - LUVIA STUDIO";
                } else {
                    document.getElementById('tampil-judul').innerText = "Program Belum Tersedia";
                }
            });

// 2. Ambil Daftar Videonya dari Program Playlist
            firebase.database().ref('program_playlists/' + progId).on('value', snap => {
                const container = document.getElementById('playlist-container');
                if (snap.exists()) {
                    const videoIds = Object.keys(snap.val()); // Dapatkan ID videonya apa saja
                    let html = '';
                    
                    // Cocokkan ID video dari Firebase dengan database videoList di videos-data.js
                    videoIds.reverse().forEach(id => {
                        const vid = videoList.find(v => v.id === id);
                        if(vid) {
                            const uploadTime = vid.uploadDate ? timeAgoFormated(vid.uploadDate) : ''; // Fitur kalkulasi waktu
                            html += `
                            <a href="watch.html?id=${vid.id}" class="video-card">
                                <div class="thumb-box"><img src="${vid.thumb}"></div>
                                <div class="video-details">
                                    <h3>${vid.title}</h3>
                                    <p>
                                        <span class="card-genre-btn" onclick="event.preventDefault(); window.location.href='videos.html?genre=${encodeURIComponent(vid.genre || 'Umum')}'">${vid.genre || 'Umum'}</span><br>
                                        <span id="view-count-prog-${vid.id}">👁️ Memuat...</span>${uploadTime ? ' • ' + uploadTime : ''}
                                    </p>
                                </div>
                            </a>`;
                        }
                    });
                    container.innerHTML = html || '<p>Belum ada video di program ini.</p>';
                    
                    // Aktifkan penghitung views real-time setelah elemen dirender
                    videoIds.forEach(id => {
                        const vid = videoList.find(v => v.id === id);
                        if(vid) {
                            listenVideoViews(vid.id, vid.defaultViews || 0, (totalViews) => {
                                const el = document.getElementById(`view-count-prog-${vid.id}`);
                                if (el) el.innerText = `👁️ ${formatViews(totalViews)}`;
                            });
                        }
                    });
                    
                } else {
                    container.innerHTML = '<p style="color:#bbb;">Belum ada video di program ini.</p>';
                }
            });
        }

        // Tunggu sampai videoList di videos-data.js selesai dimuat
        if (typeof videoList !== 'undefined' && videoList.length > 0) {
            muatHalamanProgram();
        } else {
            window.addEventListener('videoDataReady', muatHalamanProgram);
        }
    </script>
</body>
</html>
