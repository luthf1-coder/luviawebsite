<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIHAT POSTINGAN - LUVIA STUDIO</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" data-img="logoBulat">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <nav id="navbar-container"></nav>
    <div id="sidebar-container"></div>

    <div class="pp-backdrop" id="pp-backdrop"></div>

    <main class="pp-page">
        <article class="pp-card" id="pp-card">

            <!-- HEADER AKUN -->
            <header class="pp-head">
                <div class="pp-ring"><img data-avatar="admin" alt="Luvia Studio TV"></div>
                <div class="pp-head-info">
                    <div class="pp-user">LUVIA STUDIO TV <span data-ikon="centang" class="pp-verified"></span></div>
                    <div class="pp-sub" id="post-time-display">Memuat...</div>
                </div>
                <button type="button" class="pp-icon-btn" id="btn-more" aria-label="Salin link"><span data-ikon="lainnya"></span></button>
            </header>

            <!-- MEDIA -->
            <div class="pp-media" id="post-media-container">
                <p class="pp-loading">Memuat media...</p>
            </div>

            <!-- CAPTION -->
            <div class="pp-caption" id="pp-caption">
                <div class="pp-cap-text"><span id="post-caption-display">Memuat deskripsi...</span><button type="button" id="cap-toggle" class="pp-more-link" style="display:none;">selengkapnya</button></div>
            </div>

            <!-- DAFTAR KOMENTAR + INPUT (di HP menjadi bottom sheet) -->
            <div class="pp-sheet" id="pp-sheet">
                <div class="pp-sheet-head">
                    <span>Komentar</span>
                    <button type="button" class="pp-icon-btn" id="pp-sheet-close" aria-label="Tutup"><span data-ikon="tutup"></span></button>
                </div>

                <div class="pp-list" id="post-comments-list">
                    <p class="pp-empty">Memuat komentar...</p>
                </div>

                <form class="pp-input" id="post-comment-form" autocomplete="off">
                    <div id="pc-reply-bar" class="pp-replybar" style="display:none;">
                        <span id="pc-reply-text"></span>
                        <button type="button" id="pc-reply-batal" aria-label="Batal"><span data-ikon="tutup"></span></button>
                    </div>
                    <div id="pc-nama"></div>
                    <div class="pp-input-row">
                        <input type="text" id="post-comment-text" placeholder="Tambahkan komentar..." maxlength="500">
                        <button type="submit" class="pp-post-btn" id="pc-kirim">Kirim</button>
                    </div>
                </form>
            </div>

            <!-- TOMBOL AKSI -->
            <div class="pp-actions">
                <div class="pp-actions-left">
                    <button type="button" class="pp-act" id="btn-like-post" aria-label="Suka"><span id="ico-like" data-ikon="suka"></span></button>
                    <button type="button" class="pp-act" id="btn-open-comments" aria-label="Komentar"><span data-ikon="komentar"></span></button>
                    <button type="button" class="pp-act" id="btn-share-post" aria-label="Bagikan"><span data-ikon="bagikan"></span></button>
                </div>
                <button type="button" class="pp-act" id="btn-save" aria-label="Simpan"><span id="ico-save" data-ikon="simpan"></span></button>
            </div>

            <!-- INFO SUKA / WAKTU -->
            <div class="pp-meta">
                <div class="pp-likes"><span id="post-like-count">0</span> suka &nbsp;·&nbsp; <span class="pp-views"><span data-ikon="dilihat"></span> <span id="post-view-count">0</span></span></div>
                <button type="button" class="pp-viewall" id="pp-viewall">Lihat semua komentar</button>
                <div class="pp-time" id="post-time-ago"></div>
            </div>
        </article>

        <!-- POSTINGAN LAINNYA -->
        <section class="pp-section">
            <h2 class="pp-section-title"><span>Postingan Lainnya</span><a href="posts.html" class="pp-pill">Feed <span data-ikon="maju"></span></a></h2>
            <div class="pp-grid" id="other-posts-grid"><p class="pp-empty">Memuat postingan lainnya...</p></div>
        </section>

        <!-- VIDEO PILIHAN -->
        <section class="pp-section">
            <h2 class="pp-section-title"><span>Video Pilihan</span><a href="videos.html" class="pp-pill pp-pill-o">Semua Video <span data-ikon="maju"></span></a></h2>
            <div class="video-grid" id="random-video-grid"><p class="pp-empty">Memuat video...</p></div>
        </section>
    </main>

    <footer>
        <div class="container footer-container">
            <div class="footer-socials" id="footer-social-container"></div>
            <p id="teks-footer-copyright">Loading...</p>
        </div>
    </footer>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="videos-data.js"></script>
    <script src="analytics-tracker.js"></script>

    <script>
    const el = (id) => document.getElementById(id);
    let postId = null;
    let player = null;
    let balasKe = null;        // { id: komentarInduk, nama }
    let editTarget = null;     // { id, parent, isReply }
    const balasanTerbuka = new Set();

    function waktuLalu(ts) {
        if (!ts) return 'Baru saja';
        const m = Math.floor((Date.now() - ts) / 60000);
        if (m < 1) return 'Baru saja';
        if (m < 60) return m + ' menit lalu';
        const j = Math.floor(m / 60);
        if (j < 24) return j + ' jam lalu';
        const h = Math.floor(j / 24);
        if (h < 7) return h + ' hari lalu';
        return Math.floor(h / 7) + ' minggu lalu';
    }
    function ringkasAngka(n) {
        n = Number(n) || 0;
        if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M';
        if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'K';
        return String(n);
    }
    function setIkon(spanId, nama) { const s = el(spanId); if (s) { s.dataset.ok = ''; s.dataset.ikon = nama; s.innerHTML = icon(IKON[nama]); } }

    document.addEventListener('DOMContentLoaded', () => {
        terapkanIkon();
        postId = new URLSearchParams(window.location.search).get('id');
        if (!postId) { el('post-media-container').innerHTML = '<p class="pp-loading">Postingan tidak ditemukan.</p>'; return; }

        firebase.database().ref('posts/' + postId).once('value').then(snap => {
            if (!snap.exists()) { el('post-media-container').innerHTML = '<p class="pp-loading">Postingan ini telah dihapus.</p>'; return; }
            renderPostUtama(snap.val());
            firebase.database().ref('post_views/' + postId).transaction(n => (n || 0) + 1);
            mulaiKomentar();
        });

        firebase.database().ref('post_views/' + postId).on('value', s => { el('post-view-count').innerText = ringkasAngka(s.val() || 0); });

        firebase.database().ref('posts').once('value').then(snap => {
            if (!snap.exists()) { el('other-posts-grid').innerHTML = '<p class="pp-empty">Belum ada postingan lain.</p>'; return; }
            firebase.database().ref('post_views').once('value')
                .then(v => renderPostLain(snap.val(), v.val() || {}))
                .catch(() => renderPostLain(snap.val(), {}));
        });

        // Video pilihan: tunggu data video siap
        const isiVideo = () => { if (typeof renderGridRecommendations === 'function') renderGridRecommendations('random-video-grid', videoList); };
        window.addEventListener('videoDataReady', isiVideo);
        if (typeof videoList !== 'undefined' && videoList.length) isiVideo();
    });

    // =====================================================================
    //  POSTINGAN UTAMA
    // =====================================================================
    function renderPostUtama(data) {
        const fileUrl = data.videoUrl || data.imageUrl || '';
        const isVideo = /\.(mp4|webm|mov)(\?|$)/i.test(fileUrl);
        const wadah = el('post-media-container');

        // Caption (bisa dilipat)
        const cap = data.caption || 'Tidak ada keterangan.';
        el('post-caption-display').innerText = cap;
        if (cap.length > 140) {
            const box = el('pp-caption'); box.classList.add('lipat');
            const tg = el('cap-toggle'); tg.style.display = 'inline';
            tg.onclick = () => { const l = box.classList.toggle('lipat'); tg.innerText = l ? 'selengkapnya' : 'sembunyikan'; };
        }

        // Waktu
        if (data.timestamp) {
            const d = new Date(data.timestamp);
            el('post-time-display').innerText = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            el('post-time-ago').innerText = waktuLalu(data.timestamp).toUpperCase();
        } else { el('post-time-display').innerText = 'Luvia Insight Verse'; }

        if (isVideo) {
            wadah.innerHTML = '<div class="pp-video-wrap"><video id="plyr-post-player" playsinline loop muted poster="' + escHtmlGlobal(data.thumbnailUrl || '') + '"><source src="' + escHtmlGlobal(fileUrl) + '" type="video/mp4"></video></div>';
            player = new Plyr('#plyr-post-player', {
                controls: ['play-large', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
                clickToPlay: true, autoplay: true, muted: true, loop: { active: true }
            });
            // ketuk 2x = maju/mundur 10 detik
            let lastTap = 0;
            const wrap = wadah.querySelector('.pp-video-wrap');
            wrap.addEventListener('touchend', (e) => {
                const now = Date.now(), sel = now - lastTap;
                if (sel < 300 && sel > 0) {
                    const k = wrap.getBoundingClientRect();
                    if (e.changedTouches[0].clientX > k.left + k.width / 2) player.forward(10); else player.rewind(10);
                    e.preventDefault();
                }
                lastTap = now;
            });
            wrap.addEventListener('dblclick', (e) => {
                const k = wrap.getBoundingClientRect();
                if (e.clientX > k.left + k.width / 2) player.forward(10); else player.rewind(10);
            });
        } else {
            wadah.innerHTML = '<img src="' + escHtmlGlobal(fileUrl) + '" alt="Foto Postingan" class="pp-img"><div class="pp-heart-pop" id="pp-heart-pop">' + icon(IKON.sukaIsi) + '</div>';
            wadah.addEventListener('dblclick', () => { if (!sudahSuka()) alihkanSuka(true); animasiHati(); });
            let lastTap = 0;
            wadah.addEventListener('touchend', () => {
                const now = Date.now();
                if (now - lastTap < 300 && now - lastTap > 0) { if (!sudahSuka()) alihkanSuka(true); animasiHati(); }
                lastTap = now;
            });
        }

        mulaiSuka();
        mulaiSimpan();
        terapkanIkon();
    }

    function animasiHati() {
        const h = el('pp-heart-pop'); if (!h) return;
        h.classList.remove('jalan'); void h.offsetWidth; h.classList.add('jalan');
    }

    // ---------- SUKA ----------
    const sudahSuka = () => !!localStorage.getItem('liked_post_' + postId);
    function segarkanIkonSuka() {
        const s = sudahSuka();
        setIkon('ico-like', s ? 'sukaIsi' : 'suka');
        el('btn-like-post').classList.toggle('aktif', s);
    }
    function alihkanSuka(paksaSuka) {
        const tombol = el('btn-like-post');
        if (tombol.dataset.sibuk) return;
        tombol.dataset.sibuk = '1'; setTimeout(() => delete tombol.dataset.sibuk, 450);

        const ref = firebase.database().ref('post_likes/' + postId);
        const sudah = sudahSuka();
        if (paksaSuka === true && sudah) return;
        if (sudah) localStorage.removeItem('liked_post_' + postId); else localStorage.setItem('liked_post_' + postId, 'true');

        const sekarang = parseInt(el('post-like-count').dataset.n || '0', 10) || 0;
        const baru = sudah ? Math.max(0, sekarang - 1) : sekarang + 1;
        el('post-like-count').dataset.n = baru; el('post-like-count').innerText = ringkasAngka(baru);
        segarkanIkonSuka();
        ref.transaction(n => sudah ? Math.max(0, (n || 0) - 1) : (n || 0) + 1);
    }
    function mulaiSuka() {
        firebase.database().ref('post_likes/' + postId).on('value', s => {
            const n = s.val() || 0;
            el('post-like-count').dataset.n = n; el('post-like-count').innerText = ringkasAngka(n);
        });
        segarkanIkonSuka();
        el('btn-like-post').onclick = () => { alihkanSuka(); if (sudahSuka()) animasiHati(); };
    }

    // ---------- SIMPAN & BAGIKAN ----------
    function mulaiSimpan() {
        const tampil = () => { const s = !!localStorage.getItem('saved_post_' + postId); setIkon('ico-save', s ? 'simpanIsi' : 'simpan'); el('btn-save').classList.toggle('aktif', s); };
        tampil();
        el('btn-save').onclick = () => {
            if (localStorage.getItem('saved_post_' + postId)) { localStorage.removeItem('saved_post_' + postId); tampilToast('Dihapus dari tersimpan'); }
            else { localStorage.setItem('saved_post_' + postId, '1'); tampilToast('Postingan disimpan di perangkat ini'); }
            tampil();
        };
        const bagikan = async () => {
            try {
                if (navigator.share) await navigator.share({ title: 'Postingan LUVIA STUDIO TV', url: location.href });
                else { await navigator.clipboard.writeText(location.href); tampilToast('Link postingan disalin'); }
            } catch (e) {}
        };
        el('btn-share-post').onclick = bagikan;
        el('btn-more').onclick = async () => { try { await navigator.clipboard.writeText(location.href); tampilToast('Link postingan disalin'); } catch (e) {} };
    }

    // =====================================================================
    //  POSTINGAN LAINNYA (grid ala Instagram)
    // =====================================================================
    function renderPostLain(postsData, viewsData) {
        const keys = Object.keys(postsData).reverse().filter(k => k !== postId).slice(0, 9);
        const wadah = el('other-posts-grid');
        if (!keys.length) { wadah.innerHTML = '<p class="pp-empty">Tidak ada postingan lain.</p>'; return; }
        wadah.innerHTML = keys.map(key => {
            const p = postsData[key];
            const url = p.videoUrl || p.imageUrl || '';
            const vid = /\.(mp4|webm|mov)(\?|$)/i.test(url);
            const media = vid
                ? '<video src="' + escHtmlGlobal(url) + '" poster="' + escHtmlGlobal(p.thumbnailUrl || '') + '" preload="none" playsinline muted loop onmouseenter="this.play()" onmouseleave="this.pause(); this.load();"></video><span class="pp-g-tipe">' + icon(IKON.video) + '</span>'
                : '<img src="' + escHtmlGlobal(url) + '" alt="Postingan" loading="lazy">';
            return '<a href="post.html?id=' + key + '" class="pp-g-item">' + media +
                   '<span class="pp-g-views">' + icon(IKON.dilihat) + ' ' + ringkasAngka(viewsData[key] || 0) + '</span></a>';
        }).join('');
    }

    // =====================================================================
    //  KOMENTAR (gaya Instagram)
    // =====================================================================
    function bukaSheet(buka) {
        el('pp-sheet').classList.toggle('buka', buka);
        el('pp-backdrop').classList.toggle('buka', buka && window.innerWidth <= 900);
        if (buka) setTimeout(() => el('post-comment-text').focus(), 280);
    }

    function mulaiKomentar() {
        const commentsRef = firebase.database().ref('post_comments/' + postId);
        const list = el('post-comments-list');
        const refKomentar = (id, parent, isReply) => isReply
            ? commentsRef.child(parent).child('replies').child(id)
            : commentsRef.child(id);

        // Pembuka / penutup panel komentar (HP)
        el('btn-open-comments').onclick = () => { if (window.innerWidth <= 900) bukaSheet(true); else el('post-comment-text').focus(); };
        el('pp-viewall').onclick = () => bukaSheet(true);
        el('pp-sheet-close').onclick = () => bukaSheet(false);
        el('pp-backdrop').onclick = () => bukaSheet(false);

        // Kolom nama bersama (otomatis terisi dari halaman lain)
        const kolom = pasangKolomNama('pc-nama', 'post-comment-name', 'Komentar sebagai');

        function setBalasan(target) {
            balasKe = target;
            el('pc-reply-bar').style.display = (target || editTarget) ? 'flex' : 'none';
            if (target) { el('pc-reply-text').innerText = 'Membalas @' + target.nama; if (!el('post-comment-text').value) el('post-comment-text').value = '@' + target.nama + ' '; el('post-comment-text').focus(); }
        }
        function batalAksi() {
            balasKe = null; editTarget = null;
            el('pc-reply-bar').style.display = 'none';
            el('post-comment-text').value = ''; el('pc-kirim').innerText = 'Kirim';
        }
        el('pc-reply-batal').onclick = batalAksi;

        function bangunItem(id, c, isReply, parentId) {
            const sukaKu = localStorage.getItem('liked_post_comment_' + id);
            const milikku = localStorage.getItem('my_post_comment_' + id) === 'true';
            const boleh = milikku || IS_ADMIN_BROWSER;
            const da = 'data-id="' + id + '" data-parent="' + (parentId || '') + '" data-reply="' + (isReply ? 1 : 0) + '" data-nama="' + escHtmlGlobal(c.name) + '"';
            return '<div class="pc-item' + (isReply ? ' pc-reply' : '') + '" id="pc-' + id + '">' +
                buatAvatar(c.name, { kelas: 'pc-ava', admin: !!c.isAdmin, ukuran: isReply ? 24 : 32 }) +
                '<div class="pc-body">' +
                    '<div class="pc-top"><b class="pc-name">' + escHtmlGlobal(c.name) + '</b>' + (c.isAdmin ? lencanaAdmin() : '') + '</div>' +
                    '<div class="pc-text">' + escHtmlGlobal(c.text) + '</div>' +
                    '<div class="pc-sub">' +
                        '<span>' + waktuLalu(c.timestamp) + '</span>' +
                        ((c.likes || 0) > 0 ? '<span>' + c.likes + ' suka</span>' : '') +
                        '<button type="button" data-act="reply" ' + da + '>Balas</button>' +
                        (milikku ? '<button type="button" data-act="edit" ' + da + '>Edit</button>' : '') +
                        (boleh ? '<button type="button" class="pc-hapus" data-act="del" ' + da + '>Hapus</button>' : '') +
                    '</div>' +
                '</div>' +
                '<button type="button" class="pc-like' + (sukaKu ? ' aktif' : '') + '" data-act="like" ' + da + ' aria-label="Suka">' + icon(sukaKu ? IKON.sukaIsi : IKON.suka) + '</button>' +
            '</div>';
        }

        commentsRef.on('value', (snap) => {
            const data = snap.val();
            if (!data) {
                list.innerHTML = '<p class="pp-empty">Belum ada komentar.<br><small>Mulai percakapan.</small></p>';
                el('pp-viewall').innerText = 'Tambahkan komentar...';
                return;
            }
            const keys = Object.keys(data);
            let total = 0, html = '';
            keys.forEach(k => {
                const c = data[k]; total++;
                html += '<div class="pc-group">' + bangunItem(k, c, false, '');
                if (c.replies) {
                    const rk = Object.keys(c.replies); total += rk.length;
                    const buka = balasanTerbuka.has(k);
                    html += '<button type="button" class="pc-toggle" data-act="toggle" data-id="' + k + '"><span class="pc-garis"></span>' + (buka ? 'Sembunyikan balasan' : 'Lihat ' + rk.length + ' balasan') + '</button>';
                    html += '<div class="pc-replies" style="' + (buka ? '' : 'display:none;') + '">' + rk.map(r => bangunItem(r, c.replies[r], true, k)).join('') + '</div>';
                }
                html += '</div>';
            });
            list.innerHTML = html;
            el('pp-viewall').innerText = 'Lihat semua ' + total + ' komentar';
        });

        list.addEventListener('click', (e) => {
            const b = e.target.closest('[data-act]'); if (!b) return;
            const act = b.dataset.act, id = b.dataset.id, parent = b.dataset.parent, isReply = b.dataset.reply === '1';
            if (act === 'toggle') { if (balasanTerbuka.has(id)) balasanTerbuka.delete(id); else balasanTerbuka.add(id); const g = b.closest('.pc-group'); const r = g.querySelector('.pc-replies'); const buka = balasanTerbuka.has(id); r.style.display = buka ? '' : 'none'; b.lastChild.textContent = buka ? 'Sembunyikan balasan' : 'Lihat ' + r.children.length + ' balasan'; }
            else if (act === 'like') {
                const sudah = localStorage.getItem('liked_post_comment_' + id);
                refKomentar(id, parent, isReply).child('likes').transaction(n => {
                    if (sudah) { localStorage.removeItem('liked_post_comment_' + id); return Math.max(0, (n || 1) - 1); }
                    localStorage.setItem('liked_post_comment_' + id, 'true'); return (n || 0) + 1;
                });
            } else if (act === 'reply') {
                editTarget = null; el('pc-kirim').innerText = 'Kirim'; el('post-comment-text').value = '';
                setBalasan({ id: isReply ? parent : id, nama: b.dataset.nama });
            } else if (act === 'edit') {
                balasKe = null; editTarget = { id, parent, isReply };
                el('post-comment-text').value = b.closest('.pc-body').querySelector('.pc-text').textContent;
                el('pc-reply-bar').style.display = 'flex'; el('pc-reply-text').innerText = 'Mengedit komentar';
                el('pc-kirim').innerText = 'Simpan'; el('post-comment-text').focus();
            } else if (act === 'del') {
                tampilKonfirmasi('Hapus komentar ini?', { judul: 'Hapus komentar', ya: 'Hapus', bahaya: true }).then(ok => {
                    if (ok) { refKomentar(id, parent, isReply).remove(); localStorage.removeItem('my_post_comment_' + id); }
                });
            }
        });

        // Kirim / simpan edit
        el('post-comment-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const teks = el('post-comment-text').value.trim();
            if (!teks) return;

            if (editTarget) {
                refKomentar(editTarget.id, editTarget.parent, editTarget.isReply).update({ text: teks });
                batalAksi(); return;
            }
            const info = siapkanPengirim(kolom.ambil());
            if (!info.ok) { alert(info.pesan); return; }
            if (!info.isAdmin) { simpanNama(info.nama); kolom.segarkan(); }

            const data = { name: info.nama, text: teks, timestamp: firebase.database.ServerValue.TIMESTAMP, likes: 0 };
            if (info.isAdmin) data.isAdmin = true;

            let baru;
            if (balasKe) { baru = commentsRef.child(balasKe.id).child('replies').push(data); balasanTerbuka.add(balasKe.id); }
            else baru = commentsRef.push(data);
            localStorage.setItem('my_post_comment_' + baru.key, 'true');
            batalAksi();
            setTimeout(() => { list.scrollTop = list.scrollHeight; }, 300);
        });
    }

    // Tutup panel komentar dengan tombol Esc
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') bukaSheet(false); });
    </script>
</body>
</html>
