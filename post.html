<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIHAT POSTINGAN - LUVIA STUDIO</title>
    <!-- CSS Bawaan -->
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="Asset Foto/Thumbnimail .png">
    
    <!-- CSS PLYR -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        /* =========================================
           TAMPILAN POSTINGAN ALA INSTAGRAM
           ========================================= */
        .post-container {
            display: flex;
            max-width: 1000px;
            margin: 100px auto 40px auto;
            /* Latar Belakang Transparan Kaca */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-height: 500px;
        }

        .post-media-section {
            flex: 1.5;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .post-media-section img {
            width: 100%;
            height: auto;
            max-height: 700px;
            object-fit: contain;
        }

        .post-sidebar-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            /* Latar Kaca Khusus Sidebar */
            background: rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
        }

        .post-header, .post-caption, .post-actions {
            /* Mengubah warna garis pembatas jadi lebih terang */
            border-bottom: 1px solid rgba(255, 255, 255, 0.3) !important; 
        }

        /* Desain Scrollbar Komentar */
        #post-comments-list::-webkit-scrollbar { width: 5px; }
        #post-comments-list::-webkit-scrollbar-thumb { background: rgba(255, 145, 77, 0.6); border-radius: 10px; }
        .post-header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 12px;
        }

        .post-header-info h4 {
            color: #fff;
            margin: 0;
            font-size: 1rem;
        }
        .post-header-info p {
            color: #888;
            margin: 2px 0 0 0;
            font-size: 0.8rem;
        }

        .post-caption {
            padding: 15px;
            color: #eee;
            font-size: 0.95rem;
            line-height: 1.5;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }

        .post-actions {
            padding: 15px;
            display: flex;
            gap: 15px;
            border-bottom: 1px solid #333;
        }

        .post-action-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .post-action-btn:hover { color: #ff914d; }

        /* =========================================
           KUSTOMISASI PLYR SESUAI INSTRUKSI
           ========================================= */
        .plyr-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Memaksa Plyr mengisi ruang media secara estetik */
        .plyr {
            width: 100%;
            height: 100%;
            max-height: 700px;
        }

        /* =========================================
           WADAH GRID BAWAH (POSTINGAN & VIDEO)
           ========================================= */
        .bottom-sections {
            max-width: 1200px;
            margin: 0 auto 60px auto;
            padding: 0 20px;
        }
        
        .section-title {
            color: white;
            font-size: 1.4rem;
            margin-bottom: 15px;
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 1. Grid Postingan Lainnya (Sama seperti posts.html) */
        .instagram-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        
        @media screen and (max-width: 768px) {
            .instagram-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 3px;
            }
            .post-container {
                flex-direction: column;
                margin-top: 80px;
            }
            .post-sidebar-section { border-left: none; border-top: 1px solid #333; }
        }

        .grid-item {
            position: relative;
            width: 100%;
            aspect-ratio: 1080 / 1035; 
            background: #111;
            overflow: hidden;
            display: block;
            text-decoration: none;
            cursor: pointer;
        }

        @media screen and (min-width: 769px) {
            .grid-item { border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
            .grid-item:hover img, .grid-item:hover video { transform: scale(1.05); }
        }

        .grid-item img, .grid-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .viewer-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 5;
        }
        
        .video-indicator {
            position: absolute;
            top: 8px;
            right: 8px;
            color: white;
            font-size: 14px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            z-index: 5;
        }

        /* 2. Grid Video Acak - Mengandalkan .video-grid dari style.css bawaan watch.html */
    </style>
</head>
<body>

  <!-- WADAH NAVBAR OTOMATIS DARI PUSAT KOMANDO -->
    <nav id="navbar-container"></nav>
    
    <div id="sidebar-container"></div>


    <!-- AREA POSTINGAN UTAMA -->
    <div class="post-container">
        <div class="post-media-section" id="post-media-container">
            <p style="color: #bbb; padding: 50px;">Memuat media...</p>
        </div>
        
        <div class="post-sidebar-section" style="position: relative; overflow: hidden;">
            
            <!-- LAYER 1: INFO & CAPTION (Muncul Pertama) -->
            <div class="post-layer-info" id="post-layer-info">
                <div class="post-header" style="border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 15px; display: flex; align-items: center; gap: 10px;">
                    <img src="Asset Foto/Thumbnimail .png" style="width: 40px; height: 40px; border-radius: 50%;" alt="Luvia Studio TV">
                    <div>
                        <h4 style="margin: 0; font-size: 1rem;">LUVIA STUDIO TV</h4>
                        <p id="post-time-display" style="margin: 2px 0 0; font-size: 0.8rem; color: #bbb;">Beberapa waktu lalu</p>
                    </div>
                </div>
                
                <div class="post-caption" id="post-caption-display" style="padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.3); flex: 1; overflow-y: auto;">
                    Memuat deskripsi postingan...
                </div>
                
                <div class="post-actions" style="padding: 15px 0 0 0; border-bottom: none; gap: 20px; display: flex;">
                    <button class="post-action-btn" id="btn-like-post">❤️ <span id="post-like-count">0</span> Suka</button>
                    <!-- Klik tombol ini akan memicu animasi geser komentar dari bawah -->
                    <button class="post-action-btn" onclick="toggleKomentar(true)">💬 Komentar</button>
                </div>
            </div>

            <!-- LAYER 2: KOMENTAR (Tersembunyi di Bawah, Akan naik saat tombol diklik) -->
            <div class="post-layer-comments" id="post-layer-comments" style="background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);">
                <div class="comments-header-top" style="border-bottom: 1px solid rgba(255,255,255,0.3);">
                    <span style="flex: 1;">Komentar</span>
                    <button class="btn-tutup-komentar" onclick="toggleKomentar(false)">✖</button>
                </div>

                <!-- Daftar Komentar -->
                <div id="post-comments-list" style="flex: 1; overflow-y: auto; padding: 15px;">
                    <p style="color: #ddd; text-align: center; font-size: 0.9rem; margin-top: 20px;">Memuat komentar...</p>
                </div>

                <!-- Form Input Komentar (Tertahan di dasar layer komentar) -->
                <div class="comment-input-area" style="padding: 15px; border-top: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.2);">
                    <form id="post-comment-form" style="display: flex; flex-direction: column; gap: 8px;">
                        <input type="text" id="post-comment-name" placeholder="Nama Anda..." required style="background: transparent; border: none; border-bottom: 1px solid rgba(255, 255, 255, 0.4); color: white; padding: 6px; outline: none; font-size: 0.9rem;">
                        <textarea id="post-comment-text" placeholder="Tambahkan komentar..." required style="background: transparent; border: none; border-bottom: 1px solid rgba(255, 255, 255, 0.4); color: white; padding: 6px; outline: none; resize: none; min-height: 35px; font-family: inherit; font-size: 0.9rem;"></textarea>
                        
                        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 5px;">
                            <button type="button" onclick="document.getElementById('post-comment-text').value=''" style="background: transparent; border: none; color: #fff; cursor: pointer; padding: 5px 12px; border-radius: 15px; font-size: 0.85rem;">Batal</button>
                            <button type="submit" style="background: linear-gradient(45deg, #8c52ff, #ff914d); color: white; border: none; cursor: pointer; padding: 5px 15px; border-radius: 15px; font-weight: bold; font-size: 0.85rem;">Kirim</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <!-- WADAH GRID BAWAH -->
    <div class="bottom-sections">
        <!-- POSTINGAN LAINNYA (Grid Instagram) -->
        <h2 class="section-title">
            Postingan Lainnya 
            <a href="posts.html" style="font-size: 0.8rem; background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 15px; color: white; text-decoration: none;">Feed ❯</a>
        </h2>
        <div class="instagram-grid" id="other-posts-grid">
            <p style="color: #888;">Memuat postingan lainnya...</p>
        </div>

        <!-- VIDEO PILIHAN ACAK (Grid Video Watch.html) -->
        <h2 class="section-title">
            Video Pilihan Acak
            <a href="videos.html" style="font-size: 0.8rem; background: #8c52ff; padding: 5px 12px; border-radius: 15px; color: white; text-decoration: none;">More Videos ❯</a>
        </h2>
        <div class="video-grid" id="random-video-grid">
            <p style="color: #888;">Memuat video acak...</p>
        </div>
    </div>

    <footer>
        <div class="container footer-container">
            <div class="footer-socials" id="footer-social-container"></div>
            <p id="teks-footer-copyright">Loading...</p>
        </div>
    </footer>

    <!-- SCRIPT UTAMA -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="videos-data.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');

            if (!postId) {
                document.getElementById('post-media-container').innerHTML = '<p style="color:red;">Postingan tidak ditemukan.</p>';
                return;
            }

            if (typeof firebase !== 'undefined') {
                // 1. AMBIL DATA POSTINGAN INI
                firebase.database().ref('posts/' + postId).once('value').then(snap => {
                    if (snap.exists()) {
                        const p = snap.val();
                        renderMainPost(p, postId);
                        incrementPostViews(postId);
                        
                        // PANGGIL FUNGSI KOMENTAR
                        initPostComments(postId);
                    } else {
                        document.getElementById('post-media-container').innerHTML = '<p style="color:red;">Postingan ini telah dihapus.</p>';
                    }
                });

                // 2. AMBIL POSTINGAN LAINNYA UNTUK GRID (KECUALI POST INI)
                firebase.database().ref('posts').once('value').then(snap => {
                    if(snap.exists()) {
                        firebase.database().ref('post_views').once('value').then(viewsSnap => {
                            const viewsData = viewsSnap.exists() ? viewsSnap.val() : {};
                            renderOtherPosts(snap.val(), viewsData, postId);
                        }).catch(() => renderOtherPosts(snap.val(), {}, postId));
                    }
                });
            }

            // 3. RENDER VIDEO ACAK (Menarik fungsi dari videos-data.js)
            // Memastikan data videoList sudah siap sebelum merender grid
            setTimeout(() => {
                if (typeof renderGridRecommendations === 'function') {
                    renderGridRecommendations('random-video-grid', videoList);
                }
            }, 500);
        });

        // ==========================================
        // FUNGSI RENDER POSTINGAN UTAMA
        // ==========================================
        function renderMainPost(data, id) {
            const isVideo = data.videoUrl && data.videoUrl.includes('.mp4');
            const mediaContainer = document.getElementById('post-media-container');
            
            document.getElementById('post-caption-display').innerText = data.caption || "Tidak ada keterangan.";
            
            // Logika Waktu
            if (data.timestamp) {
                const date = new Date(data.timestamp);
                document.getElementById('post-time-display').innerText = date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            }

            if (isVideo) {
                // Gunakan Thumbnail jika ada di database (data.thumbnailUrl), jika tidak, kosong.
                const thumbUrl = data.thumbnailUrl || 'Asset Foto/Thumbnimail .png'; 
                
                mediaContainer.innerHTML = `
                    <div class="plyr-wrapper">
                        <video id="plyr-post-player" playsinline poster="${thumbUrl}">
                            <source src="${data.videoUrl}" type="video/mp4" />
                        </video>
                    </div>
                `;

                // INISIALISASI PLYR DENGAN KONTROL KHUSUS
                const player = new Plyr('#plyr-post-player', {
                    // Tombol Play, Rewind, Fast-Forward DIBUANG dari kontrol bawah
                    controls: ['progress', 'current-time', 'duration', 'mute', 'volume', 'fullscreen'],
                    clickToPlay: true, // Klik tengah video untuk Play/Pause
                    autoplay: true,    // Langsung mulai otomatis
                    muted: false,      // Suara tidak di-mute
                });

                // FUNGSI KETUK 2X (Double Tap / Double Click) untuk Skip 10 detik
                let lastTap = 0;
                const plyrContainer = mediaContainer.querySelector('.plyr-wrapper');
                
                // Untuk HP (Touch)
                plyrContainer.addEventListener('touchend', (e) => {
                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastTap;
                    if (tapLength < 300 && tapLength > 0) {
                        const clickX = e.changedTouches[0].clientX;
                        if (clickX > window.innerWidth / 2) player.forward(10);
                        else player.rewind(10);
                        e.preventDefault(); // Cegah zoom layar
                    }
                    lastTap = currentTime;
                });

                // Untuk PC (Mouse Double Click)
                plyrContainer.addEventListener('dblclick', (e) => {
                    const clickX = e.clientX;
                    const containerRect = plyrContainer.getBoundingClientRect();
                    // Cek posisi klik relatif terhadap lebar wadah video
                    if (clickX > containerRect.left + (containerRect.width / 2)) {
                        player.forward(10);
                    } else {
                        player.rewind(10);
                    }
                });

            } else {
                mediaContainer.innerHTML = `<img src="${data.videoUrl}" alt="Foto Postingan">`;
            }

            // Sistem Like Sederhana
            const likeBtn = document.getElementById('btn-like-post');
            const likeCountEl = document.getElementById('post-like-count');
            let hasLiked = localStorage.getItem('liked_post_' + id);
            
            // Ambil jumlah like dari firebase (jika kita punya path post_likes)
            firebase.database().ref('post_likes/' + id).on('value', snap => {
                const totalLikes = snap.val() || 0;
                likeCountEl.innerText = totalLikes;
                likeBtn.style.color = hasLiked ? '#ff914d' : '#fff';
            });

            likeBtn.addEventListener('click', () => {
                const likesRef = firebase.database().ref('post_likes/' + id);
                likesRef.transaction(currentLikes => {
                    if (hasLiked) {
                        localStorage.removeItem('liked_post_' + id);
                        hasLiked = false;
                        return (currentLikes || 1) - 1;
                    } else {
                        localStorage.setItem('liked_post_' + id, 'true');
                        hasLiked = true;
                        return (currentLikes || 0) + 1;
                    }
                });
            });
        }

        // ==========================================
        // FUNGSI RENDER POSTINGAN LAINNYA
        // ==========================================
        function renderOtherPosts(postsData, viewsData, currentPostId) {
            const container = document.getElementById('other-posts-grid');
            let html = '';
            
            const keys = Object.keys(postsData).reverse().filter(k => k !== currentPostId).slice(0, 6); // Ambil maks 6 post
            
            if (keys.length === 0) {
                container.innerHTML = '<p style="color:#888;">Tidak ada postingan lain.</p>';
                return;
            }

            const eyeSVG = `<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>`;

            keys.forEach(key => {
                const p = postsData[key];
                const isVideo = p.videoUrl.includes('.mp4');
                let totalViews = viewsData[key] || 0;
                let formattedViews = totalViews >= 1000 ? (totalViews / 1000).toFixed(1).replace('.0', '') + 'K' : totalViews;

                const thumb = p.thumbnailUrl || ''; // Memanggil link thumbnail jika ada
                const mediaTag = isVideo 
                    ? `<video src="${p.videoUrl}" poster="${thumb}" muted loop onmouseenter="this.play()" onmouseleave="this.pause()"></video><div class="video-indicator">▶</div>`
                    : `<img src="${p.videoUrl}" alt="Postingan" loading="lazy">`;

                html += `
                <a href="post.html?id=${key}" class="grid-item">
                    ${mediaTag}
                    <div class="viewer-badge">${eyeSVG} ${formattedViews}</div>
                </a>`;
            });
            
            container.innerHTML = html;
        }

        function incrementPostViews(id) {
            firebase.database().ref('post_views/' + id).transaction(current => (current || 0) + 1);
        }

// ==========================================
        // FUNGSI KOMENTAR POSTINGAN (DATABASE FIREBASE)
        // ==========================================
        
        function timeAgo(ts) {
            if(!ts) return "Baru saja";
            const diff = Date.now() - ts;
            const minutes = Math.floor(diff / 60000);
            if(minutes < 1) return "Baru saja";
            if(minutes < 60) return `${minutes} menit yang lalu`;
            const hours = Math.floor(minutes / 60);
            if(hours < 24) return `${hours} jam yang lalu`;
            return `${Math.floor(hours / 24)} hari yang lalu`;
        }

        function initPostComments(postId) {
            const commentsRef = firebase.database().ref('post_comments/' + postId);
            const commentsList = document.getElementById('post-comments-list');

            // 1. Ambil Data Komentar Realtime
            commentsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const keys = Object.keys(data);
                    let html = '';
                    keys.forEach(key => {
                        const c = data[key];
                        html += `
                        <div style="margin-bottom: 18px; display: flex; gap: 12px;">
                            <img src="Asset Foto/Thumbnimail .png" style="width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.2); flex-shrink: 0;" alt="Avatar">
                            <div>
                                <div style="font-size: 0.85rem; font-weight: bold; color: #fff;">
                                    @${c.name} <span style="font-size: 0.75rem; color: #bbb; font-weight: normal; margin-left: 6px;">${timeAgo(c.timestamp)}</span>
                                </div>
                                <div style="font-size: 0.9rem; color: #f1f1f1; margin-top: 4px; line-height: 1.4; word-wrap: break-word;">${c.text}</div>
                            </div>
                        </div>
                        `;
                    });
                    commentsList.innerHTML = html;
                    // Otomatis scroll ke pesan paling bawah setiap ada komentar baru
                    commentsList.scrollTop = commentsList.scrollHeight;
                } else {
                    commentsList.innerHTML = '<p style="color: #ddd; text-align: center; font-size: 0.9rem; margin-top: 20px;">Belum ada komentar. Jadilah yang pertama!</p>';
                }
            });

            // 2. Kirim Komentar Baru
            const form = document.getElementById('post-comment-form');
            if(form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const nameInput = document.getElementById('post-comment-name');
                    const textInput = document.getElementById('post-comment-text');

                    if (nameInput.value && textInput.value) {
                        commentsRef.push({
                            name: nameInput.value,
                            text: textInput.value,
                            timestamp: firebase.database.ServerValue.TIMESTAMP
                        });

                        // Kirim notif ke Admin (Opsional agar Minmin tau ada yg komen)
                        firebase.database().ref('admin_notifications').push({
                            tipe: "Komentar Feed",
                            pesan: `${nameInput.value} berkomentar di Postingan: "${textInput.value}"`,
                            timestamp: Date.now(),
                            read: false
                        });

                        textInput.value = ''; // Bersihkan kotak input
                    }
                });
            }
        }

        // Fungsi untuk menaikkan/menurunkan layar komentar
        function toggleKomentar(show) {
            const layer = document.getElementById('post-layer-comments');
            if (show) {
                layer.classList.add('active'); // Layer naik
                // Fokus otomatis ke kotak ngetik
                setTimeout(() => document.getElementById('post-comment-text').focus(), 300);
            } else {
                layer.classList.remove('active'); // Layer turun/sembunyi
            }
        }
        
    </script>
</body>
</html>
