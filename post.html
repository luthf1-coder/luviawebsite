<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="Asset Foto/Thumbnimail .png">
    
    <!-- CSS PLYR -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <!-- FIREBASE SDK -->

    <style>
        /* =========================================
           TAMPILAN POSTINGAN ALA INSTAGRAM
           ========================================= */
        .post-container {
            display: flex;
            max-width: 1000px;
            margin: 100px auto 40px auto;
            /* Latar Belakang Transparan Kaca */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-height: 500px;
        }

        .post-media-section {
            flex: 1.5;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .post-media-section img {
            width: 100%;
            height: auto;
            max-height: 700px;
            object-fit: contain;
        }

        /* WADAH KANAN (SIDEBAR) */
        .post-sidebar-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            position: relative; 
            overflow: hidden; /* Desktop default: agar komentar mentok di dalam kotak */
        }

        .post-header, .post-caption, .post-actions {
            border-bottom: 1px solid rgba(255, 255, 255, 0.3) !important; 
        }

        #post-comments-list::-webkit-scrollbar { width: 5px; }
        #post-comments-list::-webkit-scrollbar-thumb { background: rgba(255, 145, 77, 0.6); border-radius: 10px; }
        
        .post-header img { width: 40px; height: 40px; border-radius: 50%; margin-right: 12px; }
        .post-header-info h4 { color: #fff; margin: 0; font-size: 1rem; }
        .post-header-info p { color: #888; margin: 2px 0 0 0; font-size: 0.8rem; }

        .post-caption { padding: 15px; color: #eee; font-size: 0.95rem; line-height: 1.5; flex-shrink: 0; }
        .post-actions { padding: 15px; display: flex; gap: 15px; align-items: center; }
        .post-action-btn { background: none; border: none; color: #fff; font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .post-action-btn:hover { color: #ff914d; }

        /* =========================================
           LAYER KOMENTAR (MENTOK SAMPING & BAWAH RAPI)
           ========================================= */
        .post-layer-comments {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%; /* Mentok Kanan-Kiri Desktop */
            height: 100%; /* Penuhi Tinggi Sidebar Desktop */
            display: flex;
            flex-direction: column;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .post-layer-comments.active { transform: translateY(0); }

        /* LAPISAN GELAP KHUSUS HP SAAT KOMENTAR DIBUKA */
        .mobile-comment-backdrop {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6);
            z-index: 9998;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .mobile-comment-backdrop.active { display: block; opacity: 1; }

        /* PENGATURAN RESPONSIVE HP (BOTTOM SHEET) */
        @media screen and (max-width: 768px) {
            .post-sidebar-section {
                overflow: visible !important; /* Wajib visible agar layer komentar bisa keluar ke bawah */
            }
            .post-layer-comments {
                position: fixed; /* Berubah jadi Fixed agar mentok di paling bawah HP */
                top: auto;
                bottom: 0;
                left: 0;
                width: 100vw;
                height: 65vh; /* Mengambil 65% tinggi layar HP */
                border-top-left-radius: 20px;
                border-top-right-radius: 20px;
                border-top: 1px solid rgba(255, 255, 255, 0.3);
                box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
                z-index: 9999;
            }
        }
        /* =========================================
           KUSTOMISASI PLYR SESUAI INSTRUKSI
           ========================================= */
        .plyr-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Memaksa Plyr mengisi ruang media secara estetik */
        .plyr {
            width: 100%;
            height: 100%;
            max-height: 700px;
        }

        /* =========================================
           WADAH GRID BAWAH (POSTINGAN & VIDEO)
           ========================================= */
        .bottom-sections {
            max-width: 1200px;
            margin: 0 auto 60px auto;
            padding: 0 20px;
        }
        
        .section-title {
            color: white;
            font-size: 1.4rem;
            margin-bottom: 15px;
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 1. Grid Postingan Lainnya (Sama seperti posts.html) */
        .instagram-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        
        @media screen and (max-width: 768px) {
            .instagram-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 3px;
            }
            .post-container {
                flex-direction: column;
                margin-top: 80px;
            }
            .post-sidebar-section { border-left: none; border-top: 1px solid #333; }
        }

        .grid-item {
            position: relative;
            width: 100%;
            aspect-ratio: 1080 / 1035; 
            background: #111;
            overflow: hidden;
            display: block;
            text-decoration: none;
            cursor: pointer;
        }

        @media screen and (min-width: 769px) {
            .grid-item { border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
            .grid-item:hover img, .grid-item:hover video { transform: scale(1.05); }
        }

        .grid-item img, .grid-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        /* BADGE VIEWERS DI POJOK KANAN BAWAH DIBUAT TRANSPARAN KACA */
        .viewer-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.15); /* Latar transparan */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2); /* Garis kaca tipis */
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 5;
        }
        
        .video-indicator {
            position: absolute;
            top: 8px;
            right: 8px;
            color: white;
            font-size: 14px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            z-index: 5;
        }

        /* 2. Grid Video Acak - Mengandalkan .video-grid dari style.css bawaan watch.html */
    </style>
</head>
<body>

  <!-- WADAH NAVBAR OTOMATIS DARI PUSAT KOMANDO -->
    <nav id="navbar-container"></nav>
    
    <div id="sidebar-container"></div>

    <!-- BACKGROUND GELAP HP SAAT BUKA KOMENTAR -->

    <!-- AREA POSTINGAN UTAMA -->

        <div class="post-sidebar-section" style="position: relative; overflow: hidden;">
            
            <!-- LAYER 1: INFO & CAPTION (Muncul Pertama) -->
            <div class="post-layer-info" id="post-layer-info">
                <div class="post-header" style="border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 15px; display: flex; align-items: center; gap: 10px;">
                    <img src="Asset Foto/Thumbnimail .png" style="width: 40px; height: 40px; border-radius: 50%;" alt="Luvia Studio TV">
                    <div>
                        <h4 style="margin: 0; font-size: 1rem;">LUVIA STUDIO TV</h4>

                    <span>Komentar (<span id="comment-count-header">0</span>)</span>

    <!-- WADAH GRID BAWAH -->
    <div class="bottom-sections">
        <!-- POSTINGAN LAINNYA (Grid Instagram) -->
        <h2 class="section-title">
            Postingan Lainnya

    <!-- SCRIPT UTAMA -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="videos-data.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');

            if (!postId) {
                document.getElementById('post-media-container').innerHTML = '<p style="color:red;">Postingan tidak ditemukan.</p>';
                return;
            }

            if (typeof firebase !== 'undefined') {
                // 1. AMBIL DATA POSTINGAN INI
                firebase.database().ref('posts/' + postId).once('value').then(snap => {
                    if (snap.exists()) {
                        const p = snap.val();
                        renderMainPost(p, postId);
                        incrementPostViews(postId);
                        
                        // PANGGIL FUNGSI KOMENTAR
                        initPostComments(postId);
                    } else {
                        document.getElementById('post-media-container').innerHTML = '<p style="color:red;">Postingan ini telah dihapus.</p>';
                    }
                });

                // 2. AMBIL POSTINGAN LAINNYA UNTUK GRID (KECUALI POST INI)
                firebase.database().ref('posts').once('value').then(snap => {
                    if(snap.exists()) {
                        firebase.database().ref('post_views').once('value').then(viewsSnap => {
                            const viewsData = viewsSnap.exists() ? viewsSnap.val() : {};
                            renderOtherPosts(snap.val(), viewsData, postId);
                        }).catch(() => renderOtherPosts(snap.val(), {}, postId));
                    }
                });
            }

            // 3. RENDER VIDEO ACAK (Menarik fungsi dari videos-data.js)
            // Memastikan data videoList sudah siap sebelum merender grid
            setTimeout(() => {
                if (typeof renderGridRecommendations === 'function') {
                    renderGridRecommendations('random-video-grid', videoList);
                }
            }, 500);
        });

        // ==========================================
        // FUNGSI RENDER POSTINGAN UTAMA
        // ==========================================
        function renderMainPost(data, id) {
            // PERBAIKAN: Deteksi otomatis apakah ini foto atau video dari database
            const fileUrl = data.videoUrl || data.imageUrl || '';
            const isVideo = fileUrl.includes('.mp4');
            const mediaContainer = document.getElementById('post-media-container');
            
            document.getElementById('post-caption-display').innerText = data.caption || "Tidak ada keterangan.";
            
            // Logika Waktu
            if (data.timestamp) {
                const date = new Date(data.timestamp);
                document.getElementById('post-time-display').innerText = date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            }

            if (isVideo) {
                const thumbUrl = data.thumbnailUrl || 'Asset Foto/Thumbnimail .png'; 
                mediaContainer.innerHTML = `
                    <div class="plyr-wrapper">
                        <video id="plyr-post-player" playsinline poster="${thumbUrl}">
                            <source src="${fileUrl}" type="video/mp4" />
                        </video>
                    </div>
                `;

                const player = new Plyr('#plyr-post-player', {
                    controls: ['progress', 'current-time', 'duration', 'mute', 'volume', 'fullscreen'],
                    clickToPlay: true, 
                    autoplay: true,    
                    muted: false,      
                });

                // (Biarkan logika double tap Plyr di bawahnya tetap sama...)
            const mediaContainer = document.getElementById('post-media-container');
            
            document.getElementById('post-caption-display').innerText = data.caption || "Tidak ada keterangan.";
            
            // Logika Waktu
            if (data.timestamp) {
                const date = new Date(data.timestamp);
                document.getElementById('post-time-display').innerText = date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            }

            if (isVideo) {
                // Gunakan Thumbnail jika ada di database (data.thumbnailUrl), jika tidak, kosong.
                const thumbUrl = data.thumbnailUrl || 'Asset Foto/Thumbnimail .png'; 
                
                mediaContainer.innerHTML = `
                    <div class="plyr-wrapper">
                        <video id="plyr-post-player" playsinline poster="${thumbUrl}">
                            <source src="${data.videoUrl}" type="video/mp4" />
                        </video>
                    </div>
                `;

                // INISIALISASI PLYR DENGAN KONTROL KHUSUS
                const player = new Plyr('#plyr-post-player', {
                    // Tombol Play, Rewind, Fast-Forward DIBUANG dari kontrol bawah
                    controls: ['progress', 'current-time', 'duration', 'mute', 'volume', 'fullscreen'],
                    clickToPlay: true, // Klik tengah video untuk Play/Pause
                    autoplay: true,    // Langsung mulai otomatis
                    muted: false,      // Suara tidak di-mute
                });

                // FUNGSI KETUK 2X (Double Tap / Double Click) untuk Skip 10 detik
                let lastTap = 0;
                const plyrContainer = mediaContainer.querySelector('.plyr-wrapper');
                
                // Untuk HP (Touch)
                plyrContainer.addEventListener('touchend', (e) => {
                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastTap;
                    if (tapLength < 300 && tapLength > 0) {
                        const clickX = e.changedTouches[0].clientX;
                        if (clickX > window.innerWidth / 2) player.forward(10);
                        else player.rewind(10);
                        e.preventDefault(); // Cegah zoom layar
                    }
                    lastTap = currentTime;
                });

                // Untuk PC (Mouse Double Click)
                plyrContainer.addEventListener('dblclick', (e) => {
                    const clickX = e.clientX;
                    const containerRect = plyrContainer.getBoundingClientRect();
                    // Cek posisi klik relatif terhadap lebar wadah video
                    if (clickX > containerRect.left + (containerRect.width / 2)) {
                        player.forward(10);
                    } else {
                        player.rewind(10);
                    }
                });

            } else {
                mediaContainer.innerHTML = `<img src="${data.videoUrl}" alt="Foto Postingan">`;
            }

           // Sistem Like Postingan Utama
            const likeBtn = document.getElementById('btn-like-post');
            const likeCountEl = document.getElementById('post-like-count');
            
            // Ambil jumlah like dari firebase secara realtime
            firebase.database().ref('post_likes/' + id).on('value', snap => {
                const totalLikes = snap.val() || 0;
                likeCountEl.innerText = totalLikes;
                // Selalu cek ulang status dari localStorage setiap ada perubahan
                likeBtn.style.color = localStorage.getItem('liked_post_' + id) ? '#ff914d' : '#fff';
            });

            // Pastikan pakai onclick agar langsung responsif
            likeBtn.onclick = () => {
                let currentHasLiked = localStorage.getItem('liked_post_' + id);
                const likesRef = firebase.database().ref('post_likes/' + id);
                
                // 1. Ubah UI seketika biar responsif
                if (currentHasLiked) {
                    localStorage.removeItem('liked_post_' + id);
                    likeBtn.style.color = '#fff';
                } else {
                    localStorage.setItem('liked_post_' + id, 'true');
                    likeBtn.style.color = '#ff914d';
                }

                // 2. Kirim transaksi secara aman ke database
                likesRef.transaction(currentLikes => {
                    let newLikes = currentLikes || 0;
                    if (currentHasLiked) {
                        return Math.max(0, newLikes - 1); // Cegah angka jadi minus
                    } else {
                        return newLikes + 1;
                    }
                });
            };
        }

        // ==========================================
        // FUNGSI RENDER POSTINGAN LAINNYA
        // ==========================================
        function renderOtherPosts(postsData, viewsData, currentPostId) {
            const container = document.getElementById('other-posts-grid');
            let html = '';
            
            const keys = Object.keys(postsData).reverse().filter(k => k !== currentPostId).slice(0, 6); // Ambil maks 6 post
            
            if (keys.length === 0) {
                container.innerHTML = '<p style="color:#888;">Tidak ada postingan lain.</p>';
                return;
            }

            const eyeSVG = `<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>`;

            keys.forEach(key => {
                const p = postsData[key];
                // PERBAIKAN: Cegah Crash kalau postingan berupa Gambar/Foto
                const fileUrl = p.videoUrl || p.imageUrl || '';
                const isVideo = fileUrl.includes('.mp4');
                
                let totalViews = viewsData[key] || 0;
                let formattedViews = totalViews >= 1000 ? (totalViews / 1000).toFixed(1).replace('.0', '') + 'K' : totalViews;

                const thumb = p.thumbnailUrl || ''; 
                const mediaTag = isVideo 
                    ? `<video src="${fileUrl}" poster="${thumb}" preload="none" playsinline muted loop onmouseenter="this.play()" onmouseleave="this.pause(); this.load();"></video><div class="video-indicator">▶</div>`
                    : `<img src="${fileUrl}" alt="Postingan" loading="lazy">`;
                let formattedViews = totalViews >= 1000 ? (totalViews / 1000).toFixed(1).replace('.0', '') + 'K' : totalViews;

               const thumb = p.thumbnailUrl || ''; // Memanggil link thumbnail jika ada
                // Disamakan dengan posts.html: Tambah preload="none" dan playsinline agar thumbnail fix
                const mediaTag = isVideo 
                    ? `<video src="${p.videoUrl}" poster="${thumb}" preload="none" playsinline muted loop onmouseenter="this.play()" onmouseleave="this.pause(); this.load();"></video><div class="video-indicator">▶</div>`
                    : `<img src="${p.videoUrl}" alt="Postingan" loading="lazy">`;
                
                html += `
                <a href="post.html?id=${key}" class="grid-item">
                    ${mediaTag}
                    <div class="viewer-badge">${eyeSVG} ${formattedViews}</div>
                </a>`;
            });
            
            container.innerHTML = html;
        }

        function incrementPostViews(id) {
            firebase.database().ref('post_views/' + id).transaction(current => (current || 0) + 1);
        }

// ==========================================
        // FUNGSI KOMENTAR POSTINGAN (EDIT, HAPUS, SUKA)
        // ==========================================
        const iconThumbOutline = `<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>`;
        const iconThumbSolid = `<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="white" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>`;
        const iconTrash = `<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;
        const iconEdit = `✏️`;

        function timeAgo(ts) {
            if(!ts) return "Baru saja";
            const diff = Date.now() - ts;
            const minutes = Math.floor(diff / 60000);
            if(minutes < 1) return "Baru saja";
            if(minutes < 60) return `${minutes} menit yang lalu`;
            const hours = Math.floor(minutes / 60);
            if(hours < 24) return `${hours} jam yang lalu`;
            return `${Math.floor(hours / 24)} hari yang lalu`;
        }

        function initPostComments(postId) {
            const commentsRef = firebase.database().ref('post_comments/' + postId);
            const commentsList = document.getElementById('post-comments-list');

            // 1. Ambil Data Komentar Realtime
            commentsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                let totalComments = 0;
                
                if (data) {
                    const keys = Object.keys(data);
                    let html = '';
                    keys.forEach(key => {
                        totalComments++;
                        const c = data[key];
                        
                        // Sistem Kepemilikan & Suka Komentar
                        const hasLiked = localStorage.getItem(`liked_post_comment_${key}`);
                        const isMyComment = localStorage.getItem(`my_post_comment_${key}`) === 'true';
                        const likesCount = c.likes || 0;
                        const thumbIcon = hasLiked ? iconThumbSolid : iconThumbOutline;
                        const safeText = (c.text || "").replace(/'/g, "\\'").replace(/"/g, "&quot;");

                        html += `
                        <div style="margin-bottom: 20px; display: flex; gap: 12px;">
                            <img src="Asset Foto/Thumbnimail .png" style="width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.2); flex-shrink: 0;" alt="Avatar">
                            <div style="flex: 1;">
                                <div style="font-size: 0.85rem; font-weight: bold; color: #fff;">
                                    @${c.name} <span style="font-size: 0.75rem; color: #bbb; font-weight: normal; margin-left: 6px;">${timeAgo(c.timestamp)}</span>
                                </div>
                                <div style="font-size: 0.9rem; color: #f1f1f1; margin-top: 4px; line-height: 1.4; word-wrap: break-word;">${c.text}</div>
                                
                                <!-- TOMBOL AKSI KOMENTAR -->
                                <div style="display: flex; gap: 15px; margin-top: 8px; align-items: center;">
                                    <button onclick="toggleCommentLike('${key}', '${postId}')" style="background:none; border:none; color:#bbb; font-size:0.8rem; cursor:pointer; display:flex; align-items:center; gap:4px; padding:0;">
                                        ${thumbIcon} <span id="like-count-${key}">${likesCount > 0 ? likesCount : ''}</span>
                                    </button>
                                    ${isMyComment ? `
                                        <button onclick="editComment('${key}', '${postId}', '${safeText}')" style="background:none; border:none; color:#bbb; font-size:0.8rem; cursor:pointer; display:flex; align-items:center; gap:4px; padding:0;">
                                            ${iconEdit} Edit
                                        </button>
                                        <button onclick="deleteComment('${key}', '${postId}')" style="background:none; border:none; color:#ff4d4d; font-size:0.8rem; cursor:pointer; display:flex; align-items:center; gap:4px; padding:0;">
                                            ${iconTrash} Hapus
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                        `;
                    });
                    commentsList.innerHTML = html;
                    document.getElementById('comment-count-header').innerText = totalComments;
                    // Auto-scroll pelan ke bawah
                    setTimeout(() => commentsList.scrollTop = commentsList.scrollHeight, 100);
                } else {
                    commentsList.innerHTML = '<p style="color: #ddd; text-align: center; font-size: 0.9rem; margin-top: 20px;">Belum ada komentar. Jadilah yang pertama!</p>';
                    document.getElementById('comment-count-header').innerText = 0;
                }
            });

            // 2. Kirim Komentar Baru
            const form = document.getElementById('post-comment-form');
            if(form) {
                // Cegah double event listener
                const newForm = form.cloneNode(true);
                form.parentNode.replaceChild(newForm, form);

                newForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const nameInput = document.getElementById('post-comment-name');
                    const textInput = document.getElementById('post-comment-text');

                    if (nameInput.value && textInput.value) {
                        const newCommentRef = commentsRef.push({
                            name: nameInput.value,
                            text: textInput.value,
                            timestamp: firebase.database.ServerValue.TIMESTAMP,
                            likes: 0
                        });
                        
                        // Simpan kepemilikan komentar ke device
                        localStorage.setItem(`my_post_comment_${newCommentRef.key}`, 'true');

                        firebase.database().ref('admin_notifications').push({
                            tipe: "Komentar Postingan",
                            pesan: `${nameInput.value} berkomentar di Postingan: "${textInput.value}"`,
                            timestamp: Date.now(), read: false
                        });

                        textInput.value = ''; 
                    }
                });
            }
        }

        // FUNGSI AKSI KOMENTAR POSTINGAN (SUKA, EDIT, HAPUS)
        window.toggleCommentLike = function(commentId, postId) {
            const hasLiked = localStorage.getItem(`liked_post_comment_${commentId}`);
            const targetRef = firebase.database().ref(`post_comments/${postId}/${commentId}/likes`);

            targetRef.transaction((currentLikes) => {
                if (hasLiked) {
                    localStorage.removeItem(`liked_post_comment_${commentId}`);
                    return (currentLikes || 1) - 1;
                } else {
                    localStorage.setItem(`liked_post_comment_${commentId}`, 'true');
                    return (currentLikes || 0) + 1;
                }
            });
        };

        window.deleteComment = function(commentId, postId) {
            if (confirm("Yakin ingin menarik pesan ini selamanya?")) {
                firebase.database().ref(`post_comments/${postId}/${commentId}`).remove();
                localStorage.removeItem(`my_post_comment_${commentId}`);
            }
        };

        window.editComment = function(commentId, postId, oldText) {
            const newText = prompt("Edit pesan Anda:", oldText);
            if (newText !== null && newText.trim() !== "" && newText !== oldText) {
                firebase.database().ref(`post_comments/${postId}/${commentId}`).update({ 
                    text: newText.trim() 
                });
            }
        };

        // ==========================================
        // FUNGSI ANIMASI POP-UP KOMENTAR & BACKDROP
        // ==========================================
        function toggleKomentar(show) {
            const layer = document.getElementById('post-layer-comments');
            const backdrop = document.getElementById('mobile-comment-backdrop');
            
            if (show) {
                layer.classList.add('active'); // Pop-Up Naik
                // Background gelap hanya aktif di layar HP (<768px)
                if (window.innerWidth <= 768) {
                    backdrop.classList.add('active');
                }
                setTimeout(() => document.getElementById('post-comment-text').focus(), 300);
            } else {
                layer.classList.remove('active'); // Turun / Sembunyi
                backdrop.classList.remove('active');
            }
        }
        
    </script>
</body>
</html>
