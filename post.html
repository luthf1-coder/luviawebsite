<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSTINGAN - LUVIA STUDIO</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="Asset Foto/Thumbnimail .png">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <nav>
        <div class="container nav-container">
            <button class="hamburger-menu" onclick="toggleSidebar()">☰</button>
            <a href="index.html" title="Halaman Utama" style="display: flex; align-items: center; margin-right: 15px;">
                <img src="Asset Foto/Logo Luvia Insight V﻿erse.png" alt="Logo Luvia" style="height: 34px;">
            </a>
        </div>
    </nav>
    <div id="sidebar-container"></div>
    
    <main class="container page-stream-container">
        
        <!-- LAYOUT BUKA POSTINGAN (VIDEO & KOMENTAR) -->
        <!-- LAYOUT BUKA POSTINGAN (VIDEO & KOMENTAR) -->
<div class="post-view-container">
    
    <!-- AREA KIRI: VIDEO/GAMBAR -->
    <div class="post-media-area" id="post-media-area">
        <p style="color:white;">Memuat Media...</p>
    </div>

    <!-- AREA KANAN / BAWAH (HP): SIDEBAR LAYER -->
    <div class="post-sidebar-container" id="post-sidebar">
        
        <!-- LAYER 1: INFO & CAPTION (Muncul Pertama) -->
        <div class="post-layer-info">
            <div class="post-header-info" style="padding:0; border:none; margin-bottom:15px;">
                <img src="Asset Foto/Thumbnimail .png" alt="LUVIA STUDIO">
                <div>
                    <strong style="display:block; font-size:14px; color:white;">LUVIA STUDIO TV</strong>
                    <div id="post-date-teks" style="font-size:10px; color:#888; margin-top:2px;"></div>
                </div>
            </div>
            
            <div style="flex: 1; overflow-y: auto;">
                <p id="post-caption-teks" style="font-size:13px; color:#e0e0e0; line-height:1.6; white-space: pre-wrap;">Memuat caption...</p>
            </div>
            
            <!-- Tombol Interaksi (Like & Comment) -->
            <div class="post-action-buttons">
                <button title="Suka">❤️ <span>Suka</span></button>
                <!-- TOMBOL INI YANG MEMICU KOMENTAR MUNCUL -->
                <button onclick="toggleKomentarLayer()" title="Komentar">💬 <span>Komentar</span></button>
                <button title="Bagikan">🚀</button>
            </div>
        </div>

        <!-- LAYER 2: KOMENTAR (Tersembunyi, Akan Menimpa Layer 1) -->
        <div class="post-layer-comments" id="layer-comments">
            <!-- Header Layer Komentar (Ada tombol ❮ untuk kembali) -->
            <div class="comments-header-top">
                <button class="btn-tutup-komentar" onclick="toggleKomentarLayer()">❮</button>
                <span>Komentar Postingan</span>
            </div>
            
            <!-- Daftar Komentar -->
            <div class="post-comments-list" id="post-comments-list" style="flex:1; overflow-y:auto; padding:15px;">
                <p style="color:#888; font-size:12px; text-align:center;">Memuat komentar...</p>
            </div>

            <!-- Form Kirim Komentar -->
            <div style="padding:15px; background:#1a1a1a; border-top:1px solid #333;">
                <form id="post-comment-form" style="display:flex; flex-direction:column; gap:10px;">
                    <input type="text" id="post-komen-nama" placeholder="Nama Anda..." style="padding:10px; border-radius:6px; background:#222; border:1px solid #444; color:white; font-size:12px;" required>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="post-komen-isi" placeholder="Ketik komentar..." style="flex:1; padding:10px; border-radius:6px; background:#222; border:1px solid #444; color:white; font-size:12px;" required autocomplete="off">
                        <button type="submit" style="background:linear-gradient(45deg, #8c52ff, #ff914d); color:white; border:none; border-radius:6px; padding:0 15px; font-weight:bold; cursor:pointer;">➤</button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>
        <!-- REKOMENDASI POSTINGAN ACAK -->
        <section style="margin-top:50px;">
            <div class="header-recommendation">
                <h2 style="margin: 0; font-size: 1.5rem;">Postingan Lainnya</h2>
                <a href="posts.html" class="btn-more">Feed ❯</a>
            </div>
            <!-- Menggunakan style video-slider untuk geser horizontal -->
            <div class="video-slider" id="slider-post-acak"></div>
        </section>

        <!-- REKOMENDASI VIDEO ACAK (DARI DATABASE VIDEOS-DATA.JS) -->
        <section style="margin-top:50px; margin-bottom: 50px;">
            <div class="header-recommendation">
                <h2 style="margin: 0; font-size: 1.5rem;">Video Pilihan Acak</h2>
                <a href="videos.html" class="btn-more">More Videos ❯</a>
            </div>
            <div class="video-slider" id="slider-video-acak"></div>
        </section>

    </main>

    <footer>
        <div class="container footer-container">
            <div class="footer-socials" id="footer-social-container"></div>
            <p id="teks-footer-copyright">Loading...</p>
        </div>
    </footer>

    <script src="videos-data.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        // 1. FUNGSI TOGGLE BOTTOM SHEET HP
        // FUNGSI MEMUNCULKAN/MENYEMBUNYIKAN LAYER KOMENTAR
function toggleKomentarLayer() {
    const layerKomentar = document.getElementById('layer-comments');
    layerKomentar.classList.toggle('active');
}

        // 2. MUAT DATA POSTINGAN INI
        if(postId) {
    // Perekam Tayangan (Otomatis nambah +1 ke Firebase setiap kali postingan dibuka)
    firebase.database().ref('post_views/' + postId).transaction((currentValue) => {
        return (currentValue || 0) + 1;
    });

            firebase.database().ref('posts/' + postId).once('value', snap => {
                if(snap.exists()) {
                    const p = snap.val();
                    const isVideo = p.videoUrl.includes('.mp4');
                    const mediaArea = document.getElementById('post-media-area');
                    
                    if(isVideo) {
    mediaArea.innerHTML = `
        <video src="${p.videoUrl}" controls autoplay loop playsinline style="width:100%; height:100%; object-fit:contain;"></video>
    `;
} else {
    mediaArea.innerHTML = `
        <img src="${p.videoUrl}" style="width:100%; height:100%; object-fit:contain;">
    `;
}
                    
                    document.getElementById('post-caption-teks').innerText = p.caption;
                    document.getElementById('post-date-teks').innerText = p.uploadDate ? timeAgoFormated(p.uploadDate) : '';
                    document.title = p.caption.substring(0, 20) + "... - LUVIA POST";
                } else {
                    document.getElementById('post-media-area').innerHTML = "<h3 style='color:white;'>Postingan tidak ditemukan</h3>";
                }
            });

            // 3. LOGIKA KOMENTAR POSTINGAN (Sistem Realtime Firebase)
            const postCommentsRef = firebase.database().ref('post_comments/' + postId);
            postCommentsRef.on('value', snap => {
                const list = document.getElementById('post-comments-list');
                if(snap.exists()) {
                    let html = '';
                    const data = snap.val();
                    Object.keys(data).forEach(k => {
                        const c = data[k];
                        html += `
                        <div style="margin-bottom:12px; display:flex; gap:10px;">
                            <img src="Asset Foto/Thumbnimail .png" style="width:30px; height:30px; border-radius:50%; margin-top:2px;">
                            <div>
                                <span style="font-size:12px; font-weight:bold; color:white;">${c.name}</span> 
                                <span style="font-size:10px; color:#888; margin-left:5px;">${timeAgoFormated(c.timestamp)}</span>
                                <div style="font-size:12px; color:#e0e0e0; margin-top:2px;">${c.text}</div>
                            </div>
                        </div>`;
                    });
                    list.innerHTML = html;
                    list.scrollTop = list.scrollHeight; // Auto scroll bawah
                } else {
                    list.innerHTML = '<p style="color:#888; font-size:12px; text-align:center;">Belum ada komentar.</p>';
                }
            });

            // Form Submit Komentar
            document.getElementById('post-comment-form').addEventListener('submit', e => {
                e.preventDefault();
                const nama = document.getElementById('post-komen-nama').value;
                const isi = document.getElementById('post-komen-isi').value;
                
                postCommentsRef.push({
                    name: nama, text: isi, timestamp: Date.now()
                });
                
                document.getElementById('post-komen-isi').value = '';
            });

        } else {
            document.getElementById('post-media-area').innerHTML = "<h3 style='color:white;'>ID Postingan Tidak Valid</h3>";
        }

        // ===============================================
        // 4. GENERATOR POSTINGAN & VIDEO ACAK DI BAWAH
        // ===============================================

        // Helper Acak Array
        function shuffleArr(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Render Postingan Acak
        firebase.database().ref('posts').once('value', snap => {
            const container = document.getElementById('slider-post-acak');
            if(snap.exists()) {
                const postsObj = snap.val();
                let postsArr = Object.keys(postsObj).map(k => postsObj[k]);
                // Hilangkan postingan yang sedang dibuka dari daftar rekomendasi
                postsArr = postsArr.filter(p => p.id !== postId);
                
                // Acak urutan dan ambil 6 postingan
                const randomPosts = shuffleArr(postsArr).slice(0, 6);
                
                let html = '';
                randomPosts.forEach(p => {
                    const isVideo = p.videoUrl.includes('.mp4');
                    // Pakai desain kartu IG tapi dimodifikasi agar masuk di slider horizontal
                    html += `
                    <a href="post.html?id=${p.id}" class="slider-card" style="flex: 0 0 160px; height: 160px; padding:0; border-radius:10px;">
                        ${isVideo ? `<video src="${p.videoUrl}" style="width:100%; height:100%; object-fit:cover;"></video>` : `<img src="${p.videoUrl}" style="width:100%; height:100%; object-fit:cover;">`}
                    </a>`;
                });
                container.innerHTML = html || '<p style="color:#bbb;">Tidak ada postingan lain.</p>';
            }
        });

        // Render Video Acak dari videoList (videos-data.js)
        window.addEventListener('videoDataReady', renderVideoAcak);
        if(typeof videoList !== 'undefined' && videoList.length > 0) renderVideoAcak();

        function renderVideoAcak() {
            const container = document.getElementById('slider-video-acak');
            const randomVids = shuffleArr(videoList).slice(0, 6);
            
            let html = '';
            randomVids.forEach(vid => {
                html += `
                <a href="watch.html?id=${vid.id}" class="slider-card">
                    <div class="thumb-box"><img src="${vid.thumb}"></div>
                    <div class="slider-details" style="padding:10px;">
                        <h3 style="font-size:12px; margin:0; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${vid.title}</h3>
                        <p style="font-size:10px; margin-top:5px; color:#ff914d;">${vid.genre || 'Umum'}</p>
                    </div>
                </a>`;
            });
            container.innerHTML = html;
        }

    </script>
</body>
</html>
