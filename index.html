<!-- Tambahkan script ini tepat di bawah div di atas -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        if(typeof firebase !== 'undefined') {
            firebase.database().ref('programs_info').on('value', snap => {
                const container = document.getElementById('dynamic-programs-container');
                if(snap.exists()) {
                    const progs = snap.val();
                    let html = '';
                    Object.keys(progs).forEach(id => {
                        const p = progs[id];
                        // Link otomatis akan mengarah ke program.html?id=...
                        html += `
                        <a href="program.html?id=${id}" class="card">
                            <h3>${p.title.toUpperCase()}</h3>
                            <p>${p.desc.substring(0, 70)}...</p>
                        </a>`;
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p style="text-align:center; color:#bbb;">Belum ada Program TV yang dibuat dari Admin.</p>';
                }
            });
        }
    });
</script>

    <script>
        // FUNGSI SLIDER & BADGE
        renderSliderRecommendations('home-recommendations-slider');

        const kickChannel = "luthfi1234321"; 
        async function updateHomeLiveBadge() {
            const badge = document.getElementById('kick-home-badge');
            if (!badge) return;

            try {
                const res = await fetch(`https://kick.com/api/v2/channels/${kickChannel}`);
                const data = await res.json();

                if (data.livestream) {
                    badge.innerText = "🔴 SEDANG LIVE";
                    badge.className = "badge-live";
                } else {
                    badge.innerText = "⚪ OFFLINE";
                    badge.className = "badge-offline";
                }
            } catch (err) {
                badge.innerText = "📺 KICK LIVE";
                badge.className = "badge-live";
            }
        }
        updateHomeLiveBadge();

// --- SISTEM HERO CAROUSEL 8 DETIK BERGESER + SWIPE HP ---
        let currentSlide = 0;
        let slideInterval;
        let totalSlides = 0;
        let touchStartX = 0;
        let touchEndX = 0;

        function renderHeroCarousel() {
            const inner = document.getElementById('carousel-inner');
            const indicators = document.getElementById('carousel-indicators');
            const heroCarousel = document.getElementById('hero-carousel');
            if(!inner || !indicators || !heroCarousel) return;

            // Bikin array acak dari videoList
            let shuffledList = [...videoList];
            for (let i = shuffledList.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledList[i], shuffledList[j]] = [shuffledList[j], shuffledList[i]];
            }

            // Ambil maksimal 8 video secara acak
            const slides = shuffledList.slice(0, 8);
            totalSlides = slides.length;

            if(totalSlides === 0) {
                heroCarousel.style.display = 'none';
                return;
            }
            
            let innerHtml = '';
            let indicatorsHtml = '';

            slides.forEach((vid, index) => {
                const desc = vid.description || 'Saksikan tayangan spesial dari LUVIA STUDIO TV.';
                innerHtml += `
                    <div class="carousel-item">
                        <!-- Gambar Background -->
                        <div class="carousel-bg" style="background-image: url('${vid.thumb}')"></div>
                        
                        <!-- Overlay Teks & Tombol -->
<div class="carousel-overlay">
    <div class="carousel-featured">Featured</div>
    <h2 class="carousel-title">${vid.title}</h2>
    <div class="carousel-meta">
        <a href="videos.html?genre=${encodeURIComponent(vid.genre || 'Umum')}" class="carousel-tag">${vid.genre || 'Umum'}</a>
        <span class="meta-dot">•</span>
        <span id="hero-badge-${vid.id}">${icon('eye')} Memuat...</span>
        <span class="meta-dot">•</span>
        <span>${icon('clock')} ${timeAgoFormated(vid.uploadDate)}</span>
    </div>
    <div class="carousel-actions">
        <a href="watch.html?id=${vid.id}" class="btn-watch-hero">${icon('play')} Tonton</a>
        <a href="watch.html?id=${vid.id}#info-title" class="btn-detail-hero">${icon('info')} Detail</a>
    </div>
</div>
                    </div>
                `;
                indicatorsHtml += `<div class="dot ${index === 0 ? 'active' : ''}" onclick="goToSlide(${index})"></div>`;
            });

            inner.innerHTML = innerHtml;
            indicators.innerHTML = indicatorsHtml;
            
            // Panggil sistem tracking Firebase agar Total Views terisi realtime
            slides.forEach(vid => {
                listenVideoViews(vid.id, vid.defaultViews || 0, (totalViews) => {
                    const badge = document.getElementById(`hero-badge-${vid.id}`);
                    if (badge) badge.innerHTML = `${icon('eye')} ${formatViews(totalViews)}`;
                });
            });

            // Pasang Fitur Swipe di HP
            heroCarousel.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            }, {passive: true});

            heroCarousel.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipeGesture();
            }, {passive: true});

            startCarousel();
        }

        // Logika Deteksi Swipe
        function handleSwipeGesture() {
            const minSwipeDistance = 40; // Sensitivitas geser
            if (touchEndX < touchStartX - minSwipeDistance) {
                nextSlide(); // Geser ke kiri
                resetInterval();
            }
            if (touchEndX > touchStartX + minSwipeDistance) {
                prevSlide(); // Geser ke kanan
                resetInterval();
            }
        }

        function updateCarousel() {
            const inner = document.getElementById('carousel-inner');
            const dots = document.querySelectorAll('.dot');
            if(!inner) return;

            inner.style.transform = `translateX(-${currentSlide * 100}%)`;
            
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentSlide);
            });
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            updateCarousel();
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            updateCarousel();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateCarousel();
            resetInterval();
        }

        function startCarousel() {
            slideInterval = setInterval(nextSlide, 8000); // 8 detik otomatis bergeser
        }

        function resetInterval() {
            clearInterval(slideInterval);
            startCarousel();
        }

        // Panggil render saat halaman di-load
        let heroSudah = false;
window.addEventListener('videoDataReady', () => {
    if (heroSudah) return;
    heroSudah = true;
    renderHeroCarousel();
});


// --- KENDALI SLIDER: garis posisi + panah geser ---
function pasangKendaliSlider(id) {
    const s = document.getElementById(id);
    if (!s || s.parentElement.classList.contains('sl-wrap')) return;
    const wrap = document.createElement('div');
    wrap.className = 'sl-wrap';
    s.parentNode.insertBefore(wrap, s);
    wrap.appendChild(s);
    wrap.insertAdjacentHTML('beforeend',
        '<button type="button" class="sl-arrow sl-prev" aria-label="Geser ke kiri">' + icon('arrow-left') + '</button>' +
        '<button type="button" class="sl-arrow sl-next" aria-label="Geser ke kanan">' + icon('arrow-right') + '</button>' +
        '<div class="sl-track" aria-hidden="true"><div class="sl-thumb"></div></div>');
    const prev = wrap.querySelector('.sl-prev'), next = wrap.querySelector('.sl-next');
    const track = wrap.querySelector('.sl-track'), thumb = wrap.querySelector('.sl-thumb');

    function update() {
        const maks = s.scrollWidth - s.clientWidth;
        const ada = maks > 4;
        wrap.classList.toggle('sl-ada', ada);
        if (!ada) return;
        const lebar = Math.max(12, (s.clientWidth / s.scrollWidth) * 100);
        thumb.style.width = lebar + '%';
        thumb.style.left = (s.scrollLeft / maks) * (100 - lebar) + '%';
        prev.disabled = s.scrollLeft <= 2;
        next.disabled = s.scrollLeft >= maks - 2;
    }
    const geser = arah => s.scrollBy({ left: arah * Math.max(s.clientWidth * 0.85, 200), behavior: 'smooth' });
    prev.onclick = () => geser(-1);
    next.onclick = () => geser(1);
    track.addEventListener('click', e => {
        const r = track.getBoundingClientRect();
        const maks = s.scrollWidth - s.clientWidth;
        s.scrollTo({ left: ((e.clientX - r.left) / r.width) * maks, behavior: 'smooth' });
    });
    s.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    new MutationObserver(update).observe(s, { childList: true });
    if (window.ResizeObserver) new ResizeObserver(update).observe(s);
    update();
}
pasangKendaliSlider('home-recommendations-slider');
pasangKendaliSlider('home-trending-slider');
        
    </script>
