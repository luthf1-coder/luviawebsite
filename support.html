<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0910">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Support & Komplain - LUVIA STUDIO TV</title>
    
    <!-- Ambil desain utama website -->
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" data-img="logoBulat">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>


</head>
<body class="page-support">

 <!-- WADAH NAVBAR OTOMATIS DARI PUSAT KOMANDO -->
    <nav id="navbar-container"></nav>
    
    <div id="sidebar-container"></div>
    
    <!-- KONTEN UTAMA: KOTAK CHAT SUPPORT -->
    <div class="support-wrapper">
        <div class="chat-container wc-user">
    <div class="chat-header" style="display: flex; justify-content: space-between; align-items: center; width: 100%; box-sizing: border-box;">
        <div class="chat-header-left" style="display: flex; align-items: center; gap: 15px;">
            <img data-avatar="admin" alt="Admin Luvia">
            <div>
                <h3 class="chat-title">LUVIA TV HELP<span class="centang-biru" data-ikon="centang"></span></h3>
                <p class="chat-status">Dibalas 24/7</p>
            </div>
        </div>
        <div class="chat-header-right" style="position: relative;">
            <div onclick="bukaNotifKomplain()" title="Papan Jawaban Umum" style="position:relative; font-size:24px; cursor:pointer;">
                🔔 <span id="bell-dot" class="bell-dot"></span>
            </div>
            <div onclick="toggleDropdown()" style="padding: 0 5px; font-size:24px; cursor:pointer;">⋮</div>
            <div id="header-dropdown" class="dropdown-menu">
                <a href="javascript:void(0)" onclick="resetObrolanUser()" style="color:#ff4d4d;">🧹 Reset Obrolan</a>
            </div>
        </div>
    </div>

    <div class="wc-bodywrap">
        <div class="wc-body" id="chat-body">
            <p class="wc-kosong">Memuat percakapan...</p>
        </div>
        <button type="button" class="wc-bawah" id="wc-bawah" aria-label="Ke pesan terbaru"><span data-ikon="panah"></span></button>
    </div>

    <div class="chat-footer wc-footer">
        <div id="quote-preview" class="wc-replybar" style="display:none;">
            <div class="wc-replybar-isi"><b id="quote-title">Membalas</b><span id="quote-text">...</span></div>
            <button type="button" onclick="batalAksi()" aria-label="Batal"><span data-ikon="tutup"></span></button>
            <input type="hidden" id="reply-id" value="">
            <input type="hidden" id="edit-id" value="">
        </div>
        <div id="chat-nama-wadah"></div>
        <div class="wc-inputrow">
            <textarea id="chat-isi" rows="1" maxlength="1000" placeholder="Tulis pesan..."></textarea>
            <button type="button" class="wc-send" id="btn-kirim" onclick="kirimPesan()" aria-label="Kirim"><span data-ikon="kirim"></span></button>
        </div>
    </div>
</div>
    </div>

<!-- Modal Papan Jawaban Umum -->
    <div id="modal-notif" class="modal-notif-overlay" style="display:none;">
        <div class="modal-notif-box">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; padding-bottom:10px; margin-bottom:15px;">
                <h3 style="margin:0; color:#ff914d;">FAQs<span class="centang-biru" data-ikon="centang"></span></h3>
                <button onclick="document.getElementById('modal-notif').style.display='none'" style="background:none; border:none; color:white; font-size:20px; cursor:pointer;">✖</button>
            </div>
            <div id="list-jawaban-umum" style="max-height: 400px; overflow-y: auto;">
                <p style="text-align:center; color:#bbb;">Memuat jawaban...</p>
            </div>
        </div>
    </div>

    <footer>
        <div class="container footer-container">
            <!-- Tempat Ikon Sosial Media (Dikosongkan karena akan diisi otomatis oleh Javascript) -->
            <div class="footer-socials" id="footer-social-container"></div>
            
            <!-- Teks Copyright -->
            <p id="teks-footer-copyright">Loading...</p>
        </div>
    </footer>

    <!-- Muat Konfigurasi Database -->
    <script src="videos-data.js"></script>
    <script src="analytics-tracker.js"></script>

    <!-- LOGIKA CHAT FIREBASE -->
    <script>
        
//=== JS-MULAI ===
let deviceId = localStorage.getItem('luvia_device_id');
if (!deviceId) {
    deviceId = 'dev_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('luvia_device_id', deviceId);
}

let allMessages = {};
let kolomNamaSupport = null;
let pertamaRender = true;

function pesanDariId(id) { return allMessages[id] ? Object.assign({ id: id }, allMessages[id]) : null; }

function daftarPesanSaya() {
    return Object.keys(allMessages)
        .map(k => Object.assign({ id: k }, allMessages[k]))
        .filter(m => m.deviceId === deviceId && !m.deleted_by_user && !m.hidden_by_user)
        .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
}

function sapaanHTML() {
    return '<div class="wc-row in"><div class="wc-bubble"><div class="wc-nama">CS LUVIA STUDIO ' + centangBiru() + '</div>' +
           '<div class="wc-teks">Halo! Ada pertanyaan atau komplain? Kirim di sini, Admin akan segera merespons! 👇</div></div></div>';
}

const cfgSupport = {
    milikku: m => !m.is_admin,
    namaPengirim: m => (m.is_admin ? 'CS LUVIA STUDIO' : 'Anda'),
    labelMasuk: m => '<div class="wc-nama">CS LUVIA STUDIO ' + centangBiru() + '</div>'
};

function gambarObrolan() {
    const body = document.getElementById('chat-body');
    const dekat = waDekatBawah(body);
    const daftar = daftarPesanSaya();
    const terakhirSaya = daftar.length && !daftar[daftar.length - 1].is_admin;
    waRender(body, daftar, Object.assign({ awalan: sapaanHTML() }, cfgSupport));
    terapkanIkon(body);
    if (pertamaRender || dekat || terakhirSaya) { waKeBawah(body); pertamaRender = false; }
    else document.getElementById('wc-bawah').classList.add('tampil');
}

function gambarPapan() {
    const lastRead = parseInt(localStorage.getItem('last_read_complaints') || '0', 10);
    let html = '', adaBaru = false;
    Object.keys(allMessages).reverse().forEach(k => {
        const c = allMessages[k];
        if (c.jawaban_admin && !c.deleted_for_everyone) {
            html += '<div class="jawab-item">' +
                '<div class="jawab-nama">Menjawab pertanyaan dari @' + escHtmlGlobal(namaTampil(c.uid, c.nama)) + ' :</div>' +
                '<div class="jawab-tanya">"' + escHtmlGlobal(c.isi) + '"</div>' +
                '<div class="jawab-admin"><strong>Admin LUVIA</strong> ' + centangBiru() + ': ' + escHtmlGlobal(c.jawaban_admin) + '</div></div>';
            if ((c.answered_at || 0) > lastRead) adaBaru = true;
        }
    });
    document.getElementById('list-jawaban-umum').innerHTML = html || '<p style="text-align:center; color:#bbb;">Belum ada jawaban publik.</p>';
    document.getElementById('bell-dot').style.display = adaBaru ? 'block' : 'none';
}

function menuUntuk(m) {
    const items = [{ teks: 'Balas', ikon: 'balas', aksi: () => siapkanBalas(m.id) }];
    if (!m.is_admin) {
        const umur = Date.now() - (m.timestamp || 0);
        if (umur <= 30 * 60 * 1000) items.push({ teks: 'Edit', ikon: 'edit', aksi: () => siapkanEdit(m.id) });
        items.push({ teks: 'Hapus', ikon: 'hapus', bahaya: true, aksi: () => opsiHapus(m.id, umur <= 24 * 60 * 60 * 1000) });
    }
    return items;
}

function autoTinggi(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

document.addEventListener('DOMContentLoaded', () => {
    const body = document.getElementById('chat-body');
    const isi = document.getElementById('chat-isi');
    kolomNamaSupport = pasangKolomNama('chat-nama-wadah', 'chat-nama', 'Chat sebagai');
    mulaiNamaUid();
    terapkanIkon();

    // menu pesan (panah kecil) & lompat ke pesan yang dikutip
    body.addEventListener('click', (e) => {
        const chev = e.target.closest('[data-act="menu"]');
        if (chev) { const m = pesanDariId(chev.dataset.id); if (m) waMenu(chev, menuUntuk(m)); return; }
        const q = e.target.closest('.wc-quote');
        if (q && q.dataset.quote) waLompat(body, q.dataset.quote);
    });
    body.addEventListener('scroll', () => { if (waDekatBawah(body)) document.getElementById('wc-bawah').classList.remove('tampil'); });
    document.getElementById('wc-bawah').onclick = () => { waKeBawah(body); document.getElementById('wc-bawah').classList.remove('tampil'); };

    // kolom pesan: Enter = kirim (laptop), Shift+Enter / HP = baris baru
    const sentuh = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    isi.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !sentuh) { e.preventDefault(); kirimPesan(); }
    });
    isi.addEventListener('input', () => autoTinggi(isi));

    if (typeof firebase !== 'undefined') {
        firebase.database().ref('complaints').on('value', snap => {
            allMessages = snap.val() || {};
            gambarObrolan();
            gambarPapan();
        });
    }
});

// ---------- MENU TITIK TIGA ----------
function toggleDropdown() {
    const drop = document.getElementById('header-dropdown');
    drop.style.display = drop.style.display === 'block' ? 'none' : 'block';
}

function resetObrolanUser() {
    tampilKonfirmasi("Yakin ingin mereset/menghapus layar obrolan Anda?", { judul: 'Reset obrolan', ya: 'Reset', bahaya: true }).then(ok => {
        if (!ok) return;
        Object.keys(allMessages).forEach(k => {
            if (allMessages[k].deviceId === deviceId) {
                firebase.database().ref('complaints/' + k).update({ hidden_by_user: true });
            }
        });
        toggleDropdown();
    });
}

function bukaNotifKomplain() {
    document.getElementById('modal-notif').style.display = 'flex';
    document.getElementById('bell-dot').style.display = 'none';
    localStorage.setItem('last_read_complaints', Date.now());
}

// ---------- BALAS / EDIT / HAPUS ----------
function tampilBar(judul, teks) {
    document.getElementById('quote-preview').style.display = 'flex';
    document.getElementById('quote-title').innerText = judul;
    document.getElementById('quote-text').innerText = teks;
}

function siapkanBalas(id) {
    const msg = allMessages[id];
    if (!msg) return;
    tampilBar(msg.is_admin ? 'CS LUVIA STUDIO' : 'Anda', msg.isi);
    document.getElementById('reply-id').value = id;
    document.getElementById('edit-id').value = '';
    document.getElementById('chat-isi').focus();
}

function siapkanEdit(id) {
    const msg = allMessages[id];
    if (!msg) return;
    tampilBar('Mengedit pesan', msg.isi);
    document.getElementById('edit-id').value = id;
    document.getElementById('reply-id').value = '';
    const isi = document.getElementById('chat-isi');
    isi.value = msg.isi;
    autoTinggi(isi);
    isi.focus();
}

function batalAksi() {
    document.getElementById('quote-preview').style.display = 'none';
    document.getElementById('reply-id').value = '';
    document.getElementById('edit-id').value = '';
    const isi = document.getElementById('chat-isi');
    isi.value = '';
    autoTinggi(isi);
}

function opsiHapus(id, canDeleteAll) {
    const pesan = canDeleteAll ? "Pilih cara menghapus pesan ini:" : "Waktu tarik pesan sudah habis (lebih dari 24 jam). Pesan hanya bisa dihapus untuk Anda sendiri.";
    const pilihan = [{ teks: 'Batal', nilai: null }, { teks: 'Hapus untuk saya', nilai: '1', utama: !canDeleteAll }];
    if (canDeleteAll) pilihan.push({ teks: 'Hapus untuk semua', nilai: '2', utama: true, bahaya: true });
    tampilPilihan('Hapus pesan', pesan, pilihan).then(respon => {
        if (respon === '1') firebase.database().ref('complaints/' + id).update({ deleted_by_user: true });
        else if (respon === '2' && canDeleteAll) firebase.database().ref('complaints/' + id).update({ deleted_for_everyone: true });
    });
}

// ---------- KIRIM ----------
async function kirimPesan() {
    const isiEl = document.getElementById('chat-isi');
    const isi = isiEl.value.trim();
    const editId = document.getElementById('edit-id').value;
    const replyId = document.getElementById('reply-id').value;
    if (!isi) return;

    if (editId) {
        firebase.database().ref('complaints/' + editId).update({ isi: isi, is_edited: true });
        batalAksi();
        return;
    }

    const info = await siapkanPengirimAsync(document.getElementById('chat-nama').value);
    if (!info.ok) return alert(info.pesan);
    if (kolomNamaSupport) kolomNamaSupport.segarkan();

    const payload = { nama: info.nama, isi: isi, deviceId: deviceId, uid: idPengguna(), timestamp: firebase.database.ServerValue.TIMESTAMP };
    if (replyId && allMessages[replyId]) {
        payload.quote_id = replyId;
        payload.quote_text = String(allMessages[replyId].isi || '').slice(0, 140);
    }

    firebase.database().ref('complaints').push(payload).then(() => {
        firebase.database().ref('admin_notifications').push({
            tipe: "Komplain Masuk 🔔", pesan: info.nama + ': "' + isi + '"', timestamp: Date.now(), read: false
        });
        batalAksi();
        pertamaRender = true;      // setelah kirim, selalu turun ke pesan terbaru
    });
}
//=== JS-SELESAI ===
    
    </script>
</body>
</html>
