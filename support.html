<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Support & Komplain - LUVIA STUDIO TV</title>
    
    <!-- Ambil desain utama website -->
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="Asset Foto/Thumbnimail .png">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        /* ==========================================
           DESAIN KHUSUS HALAMAN CHAT (RESPONSIF HP)
           ========================================== */
        body { background-color: #0f0f0f; display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
        
        .support-wrapper { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 90px 15px 30px 15px; /* Spasi atas untuk navbar */
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            background: #1a1a1a;
            border-radius: 16px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 75vh; /* Tinggi pas untuk HP & PC */
        }

        .chat-header {
            background: linear-gradient(45deg, #8c52ff, #ff914d);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
        }

        .chat-header img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.5);
        }

        .chat-title { margin: 0; font-size: 16px; font-weight: bold; font-family: sans-serif; }
        .chat-status { margin: 2px 0 0 0; font-size: 12px; display: flex; align-items: center; gap: 6px; color: #ffe5d9; }
        .chat-status::before { content: ''; display: block; width: 8px; height: 8px; background: #53fc18; border-radius: 50%; box-shadow: 0 0 5px #53fc18; }

        .chat-body {
            flex: 1;
            background: #0f0f0f;
            padding: 20px 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
        }

        /* Bubble Penonton (Kanan) */
        .bubble-user {
            background: #222;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            border: 1px solid #333;
        }

        /* Bubble Admin (Kiri) */
        .bubble-admin {
            background: linear-gradient(45deg, #8c52ff, #ff914d);
            color: #fff;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            box-shadow: 0 4px 10px rgba(140, 82, 255, 0.2);
        }

        .chat-name { font-size: 11px; font-weight: bold; margin-bottom: 5px; display: block; opacity: 0.8; }
        
        .chat-footer {
            background: #1a1a1a;
            padding: 15px;
            border-top: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-footer input {
            width: 100%;
            padding: 12px 15px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box; /* Anti meluber ke samping */
        }

        .chat-input-row { display: flex; gap: 10px; }
        .chat-input-row input { flex: 1; }
        .btn-send {
            background: linear-gradient(45deg, #8c52ff, #ff914d);
            border: none;
            width: 50px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: transform 0.2s;
        }
        .btn-send:active { transform: scale(0.95); }

        /* Ikon Lonceng Papan Jawaban Umum */
        .chat-header-right { font-size: 24px; cursor: pointer; position: relative; }
        .bell-dot { display: none; position: absolute; top: -5px; right: -5px; width: 10px; height: 10px; background: #ff4d4d; border-radius: 50%; box-shadow: 0 0 5px #ff4d4d; }

        /* Modal Papan Jawaban */
        .modal-notif-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .modal-notif-box { background: #1a1a1a; width: 90%; max-width: 500px; border-radius: 12px; padding: 20px; border: 1px solid #333; }
        .jawab-item { background: #222; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #8c52ff; }
        .jawab-nama { font-weight: bold; color: #ff914d; font-size: 13px; margin-bottom: 5px; }
        .jawab-tanya { color: #bbb; font-size: 13px; font-style: italic; margin-bottom: 8px; }
        .jawab-admin { color: #fff; font-size: 14px; }
    </style>
</head>
<body>

    <!-- NAVBAR STANDAR LUVIA STUDIO TV -->
    <nav>
        <div class="container nav-container">
            <div class="nav-history-controls">
                <button onclick="history.back()" class="btn-nav-history" title="Kembali">←</button>
                <button onclick="history.forward()" class="btn-nav-history" title="Maju">→</button>
            </div>
            <div class="nav-links">
                <a href="index.html">Beranda</a>
                <a href="videos.html">Semua Video</a>
            </div>
            <!-- Fitur Pencarian -->
            <form class="nav-search" action="videos.html" method="GET">
                <input type="text" name="search" placeholder="Cari video..." aria-label="Cari" autocomplete="off">
                <button type="submit">🔍</button>
            </form>
        </div>
    </nav>

    <!-- KONTEN UTAMA: KOTAK CHAT SUPPORT -->
    <div class="support-wrapper">
        <div class="chat-container">
<!-- Header Chat dengan Lonceng -->
            <div class="chat-header">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <img src="Asset Foto/Thumbnimail .png" alt="Admin Luvia">
                    <div>
                        <h3 class="chat-title">CS LUVIA STUDIO</h3>
                        <p class="chat-status">Online - Siap Membantu</p>
                    </div>
                </div>
                <div class="chat-header-right" onclick="bukaNotifKomplain()" title="Papan Jawaban Umum">
                    🔔 <span id="bell-dot" class="bell-dot"></span>
                </div>
            </div>

            <!-- Area Pesan -->
            <div class="chat-body" id="chat-body">
                <p style="text-align:center; color:#888; font-size:12px; margin-top:30px;">
                    Memuat percakapan...
                </p>
            </div>

            <!-- Area Input Form -->
            <div class="chat-footer">
                <input type="text" id="chat-nama" placeholder="Ketik Nama Anda..." autocomplete="off">
                <div class="chat-input-row">
                    <input type="text" id="chat-isi" placeholder="Tulis pesan atau komplain..." onkeypress="if(event.key === 'Enter') kirimPesan()">
                    <button class="btn-send" onclick="kirimPesan()">➤</button>
                </div>
            </div>
        </div>
    </div>

<!-- Modal Papan Jawaban Umum -->
    <div id="modal-notif" class="modal-notif-overlay" style="display:none;">
        <div class="modal-notif-box">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; padding-bottom:10px; margin-bottom:15px;">
                <h3 style="margin:0; color:#ff914d;">Papan Jawaban Admin</h3>
                <button onclick="document.getElementById('modal-notif').style.display='none'" style="background:none; border:none; color:white; font-size:20px; cursor:pointer;">✖</button>
            </div>
            <div id="list-jawaban-umum" style="max-height: 400px; overflow-y: auto;">
                <p style="text-align:center; color:#bbb;">Memuat jawaban...</p>
            </div>
        </div>
    </div>
    
    <!-- FOOTER STANDAR LUVIA STUDIO TV -->
    <footer style="margin-top: auto;">
        <div class="container">
            <div class="footer-socials" style="text-align: center; margin-bottom: 10px;">
                <p style="color: #ff914d; font-weight: bold; margin-bottom: 10px;">Follow Us</p>
                <a href="#" style="color: white; margin: 0 10px; text-decoration: none;">Instagram</a>
                <a href="#" style="color: white; margin: 0 10px; text-decoration: none;">Tiktok</a>
                <a href="#" style="color: white; margin: 0 10px; text-decoration: none;">YouTube</a>
            </div>
            <p style="text-align: center;">&copy; 2026 LUVIA STUDIO TV All Right Reserved</p>
        </div>
    </footer>

    <!-- Muat Konfigurasi Database -->
    <script src="videos-data.js"></script>

    <!-- LOGIKA CHAT FIREBASE -->
    <script>
// 1. BUAT ATAU AMBIL ID UNIK UNTUK HP INI
        let deviceId = localStorage.getItem('luvia_device_id');
        if (!deviceId) {
            deviceId = 'dev_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('luvia_device_id', deviceId);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const chatBody = document.getElementById('chat-body');
            
            if (typeof firebase !== 'undefined') {
                const complaintsRef = firebase.database().ref('complaints');
                
                complaintsRef.on('value', snap => {
                    const data = snap.val();
                    let chatHtml = '';
                    let papanHtml = '';
                    let adaPesanBaru = false;
                    
                    // Pesan Pembuka di Chat Pribadi
                    chatHtml += `
                        <div class="chat-bubble bubble-admin">
                            <span class="chat-name">CS LUVIA STUDIO</span>
                            Halo! Ada komplain, saran, atau pertanyaan tentang video? Kirim di sini, Admin akan segera merespons! 👇
                        </div>
                    `;

                    if(data) {
                        const keys = Object.keys(data);
                        
                        // A. LOOPING UNTUK CHAT PRIBADI (Hanya muncul jika ID HP cocok)
                        keys.forEach(k => {
                            const c = data[k];
                            if (c.deviceId === deviceId) {
                                chatHtml += `
                                    <div class="chat-bubble bubble-user">
                                        <span class="chat-name" style="color: #ff914d; text-align:right;">${c.nama}</span>
                                        ${c.isi}
                                    </div>
                                `;
                                if(c.jawaban_admin) {
                                    chatHtml += `
                                        <div class="chat-bubble bubble-admin">
                                            <span class="chat-name" style="color: #ffe5d9;">CS LUVIA STUDIO (Admin)</span>
                                            ${c.jawaban_admin}
                                        </div>
                                    `;
                                }
                            }
                        });

                        // B. LOOPING UNTUK PAPAN JAWABAN UMUM (Muncul untuk semua orang)
                        keys.reverse().forEach(k => {
                            const c = data[k];
                            if(c.jawaban_admin) {
                                papanHtml += `
                                <div class="jawab-item">
                                    <div class="jawab-nama">Menjawab pertanyaan dari @${c.nama} :</div>
                                    <div class="jawab-tanya">"${c.isi}"</div>
                                    <div class="jawab-admin"><strong>Admin LUVIA:</strong> ${c.jawaban_admin}</div>
                                </div>`;
                                
                                const lastRead = localStorage.getItem('last_read_complaints') || 0;
                                if(c.answered_at > lastRead) adaPesanBaru = true;
                            }
                        });
                    }
                    
                    // Render Hasil
                    chatBody.innerHTML = chatHtml;
                    document.getElementById('list-jawaban-umum').innerHTML = papanHtml || '<p style="text-align:center; color:#bbb;">Belum ada jawaban publik.</p>';
                    document.getElementById('bell-dot').style.display = adaPesanBaru ? 'block' : 'none';
                    
                    setTimeout(() => { chatBody.scrollTop = chatBody.scrollHeight; }, 100);
                });
            }
        });

        function bukaNotifKomplain() {
            document.getElementById('modal-notif').style.display = 'flex';
            document.getElementById('bell-dot').style.display = 'none';
            localStorage.setItem('last_read_complaints', Date.now());
        }

        function kirimPesan() {
            const nama = document.getElementById('chat-nama').value.trim();
            const isi = document.getElementById('chat-isi').value.trim();
            
            if(!nama) return alert("Mohon isi Nama Anda terlebih dahulu!");
            if(!isi) return alert("Pesan tidak boleh kosong!");
            
            localStorage.setItem('luvia_chat_name', nama);

            // Simpan data beserta deviceId
            firebase.database().ref('complaints').push({
                nama: nama,
                isi: isi,
                deviceId: deviceId, // <--- Ini yang bikin pesannya jadi "private"
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                firebase.database().ref('admin_notifications').push({
                    tipe: "Komplain Masuk 🔔",
                    pesan: `${nama} mengirim pesan: "${isi}"`,
                    timestamp: Date.now(), 
                    read: false
                });
                document.getElementById('chat-isi').value = '';
            });
        }

        window.onload = function() {
            const savedName = localStorage.getItem('luvia_chat_name');
            if(savedName) document.getElementById('chat-nama').value = savedName;
        }
    </script>
</body>
</html>
