<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEMUTAR VIDEO - LUVIA STUDIO OFFICIAL TV</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="Asset Foto/Thumbnimail .png">

    <!-- SDK Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <nav>
        <div class="container nav-container">
            <div class="nav-history-controls">
                <button onclick="history.back()" class="btn-nav-history" title="Kembali">←</button>
                <button onclick="history.forward()" class="btn-nav-history" title="Maju">→</button>
            </div>
            <div class="nav-links">
                <a href="index.html">Beranda</a>
                <a href="#contact">Social Media</a>
            </div>
            <!-- FORM PENCARIAN BARU -->
          <form class="nav-search" id="navSearchForm" onsubmit="return false;">
                <input type="text" id="navSearchInput" placeholder="Cari video..." aria-label="Cari" autocomplete="off">
                <button type="submit">🔍</button>
                <div class="search-dropdown-list" id="searchDropdownList"></div>
            </form>
                
                <!-- Boks Dropdown Hasil Pencarian Langsung (Menimpa Konten) -->
                <div class="search-dropdown-list" id="searchDropdownList"></div>
            </form>
        </div>
    </nav>

    <main class="container page-stream-container">
        <section class="main-video-section">
            <h1 id="player-title" class="stream-title">Memuat Video...</h1>
            <div class="plyr-wrapper" id="video-player-wrapper"></div>

            <div class="video-info">
                <h2 id="info-title">...</h2>
                <div id="info-desc">
                    
                    <!-- PERUBAHAN: AREA GENRE, WAKTU UPLOAD & JUMLAH DITONTON DIPINDAH KE SINI -->
                    <div id="genre-container" style="margin-bottom: 12px;">
                        <a href="#" id="genre-link" style="background: linear-gradient(45deg, #8c52ff, #ff914d); color: white; padding: 6px 14px; border-radius: 20px; text-decoration: none; font-size: 0.85rem; font-weight: bold; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">Memuat Genre...</a>
                    </div>
                    <div id="meta-container" style="font-size: 0.95rem; color: #e0e0e0; margin-bottom: 20px; font-weight: 500; display: flex; align-items: center; gap: 8px;">
                         <span id="upload-date-display">...</span> <span style="color:#888;">•</span> <span id="views-display-box" style="color: #ff914d; font-weight: bold;">👁️ Memuat jumlah ditonton...</span>
                    </div>

                    <p id="desc-text" style="line-height: 1.7; margin-bottom: 30px;">Memuat deskripsi...</p>

                    <!-- MULAI: AREA KOMENTAR ALA YOUTUBE -->
                    <div id="comments-section" class="comments-section">
                        <h3><span id="comment-count">0</span> Komentar</h3>

                        <div class="comment-input-area">
                            <img src="Asset Foto/Thumbnimail .png" class="comment-avatar" alt="Avatar">
                            <form id="comment-form" class="comment-form">
                                <input type="text" id="comment-name" placeholder="Nama Anda..." required>
                                <textarea id="comment-text" placeholder="Tambahkan komentar..." required></textarea>
                                <div class="form-actions">
                                    <button type="button" class="btn-cancel" onclick="document.getElementById('comment-text').value=''">Batal</button>
                                    <button type="submit" class="btn-submit-comment">Komentar</button>
                                </div>
                            </form>
                        </div>

                        <div id="comments-list" class="comments-list">
                            <p style="color:#bbb; font-size:0.9rem; text-align:center;">Memuat komentar...</p>
                        </div>
                    </div>
                    <!-- SELESAI: AREA KOMENTAR ALA YOUTUBE -->

                    <div id="download-area"></div>
                    <!-- views-display-box asalnya di sini sudah dipindah ke atas -->
                </div>
            </div>
        </section>

        <section class="other-videos-section">
            <h2>Video Lainnya</h2>
            <div class="video-grid" id="watch-recommendations-grid"></div>
        </section>
    </main>

    <footer><div class="container"><p>&copy 2026 LUVIA STUDIO TV All Right Reserved</p></div></footer>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="videos-data.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentVideoId = urlParams.get('id') || 'video1';
        const currentVid = (typeof videoList !== 'undefined' && videoList.find(v => v.id === currentVideoId)) || {
            id: currentVideoId, title: 'Video Tidak Ditemukan', description: 'Maaf, video ini tidak tersedia.', defaultViews: 0
        };

        document.getElementById('player-title').innerText = currentVid.title;
        document.getElementById('info-title').innerText = currentVid.title;
        document.getElementById('desc-text').innerText = currentVid.description || 'Tidak ada deskripsi.';

        // --- PERUBAHAN: SKRIP INJEKSI GENRE & WAKTU UPLOAD ---
        const genreName = currentVid.genre || 'Umum';
        document.getElementById('genre-link').innerText = genreName;
        document.getElementById('genre-link').href = 'videos.html?genre=' + encodeURIComponent(genreName);
        
        const uploadText = currentVid.uploadDate ? `Diupload ${formatDateIndonesian(currentVid.uploadDate)}` : 'Diupload pada tanggal tidak diketahui';
        document.getElementById('upload-date-display').innerText = uploadText;
        // ----------------------------------------------------

        let downloadAreaHTML = '';
        const safeTitle = (currentVid.title || 'video').replace(/'/g, "\\'");
        if (currentVid.sources && currentVid.sources.length > 0) {
            const optionsHTML = currentVid.sources.map(s => `<option value="${s.src}">${s.size || 'HD'}p</option>`).join('');
            downloadAreaHTML = `
                <div class="download-container">
                    <span class="download-label">📥 Pilih Resolusi:</span>
                    <select id="download-quality-select" class="download-select">${optionsHTML}</select>
                    <button onclick="downloadVideoFile(document.getElementById('download-quality-select').value, '${safeTitle}.mp4')" class="btn-download-action">Download</button>
                </div>`;
        } else if (currentVid.downloadUrl || currentVid.archiveSrc) {
            const url = currentVid.downloadUrl || currentVid.archiveSrc;
            downloadAreaHTML = `<div class="download-container"><button onclick="downloadVideoFile('${url}', '${safeTitle}.mp4')" class="btn-download-action">📥 Download Video</button></div>`;
        }
        document.getElementById('download-area').innerHTML = downloadAreaHTML;

        const playerWrapper = document.getElementById('video-player-wrapper');
        
        if (currentVid.driveEmbed) {
            playerWrapper.innerHTML = `<iframe class="drive-iframe" src="${currentVid.driveEmbed}" allowfullscreen="true" style="border:none;"></iframe>`;
        } else if (currentVid.rumbleEmbed) {
            playerWrapper.innerHTML = `<iframe src="${currentVid.rumbleEmbed}" allowfullscreen="true" style="border:none;"></iframe>`;
        } else if (currentVid.customEmbed) {
            playerWrapper.innerHTML = `<iframe src="${currentVid.customEmbed}" allowfullscreen="true" allow="autoplay; encrypted-media" style="border:none;"></iframe>`;
        } else if (currentVid.youtubeId) {
            playerWrapper.innerHTML = `<iframe src="https://www.youtube.com/embed/${currentVid.youtubeId}?enablejsapi=1" allowfullscreen="true" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" style="border:none;"></iframe>`;
       } else {
            playerWrapper.innerHTML = `<video id="plyr-player" controls playsinline poster="${currentVid.thumb || ''}"><source src="${currentVid.archiveSrc || ''}" type="video/mp4" /></video>`;
            if (document.getElementById('plyr-player') && typeof Plyr !== 'undefined') {
                new Plyr('#plyr-player', { 
                    settings: ['quality', 'speed'],
                    seekTime: 10,
                    controls: [
                        'play-large',   
                        'rewind',       
                        'play',         
                        'fast-forward', 
                        'progress',     
                        'current-time', 
                        'duration',     
                        'mute',         
                        'volume',       
                        'settings',     
                        'fullscreen'    
                    ]
                });
            }
        }

        if (typeof incrementVideoViewsAsync === 'function') {
            incrementVideoViewsAsync(currentVid.id, currentVid.defaultViews || 0).then(totalViews => {
                document.getElementById('views-display-box').innerText = `👁️ ${formatViews(totalViews)}`;
            }).catch(() => {
                document.getElementById('views-display-box').innerText = `👁️ ${currentVid.defaultViews || 0} Ditonton`;
            });
        }
        if (typeof renderGridRecommendations === 'function') renderGridRecommendations('watch-recommendations-grid');

        // ==========================================
        // FITUR KOMENTAR ALA YOUTUBE
        // ==========================================
        const commentsRef = firebase.database().ref('video_comments_v2/' + currentVid.id);
        const commentsList = document.getElementById('comments-list');
        const defaultAvatarURL = "Asset Foto/Thumbnimail .png"; 
        const adminPassword = "adminlstv"; 

        const iconThumbOutline = `<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>`;
        const iconThumbSolid = `<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="white" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>`;
        const iconTrash = `<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;

        function timeAgo(ts) {
            if(!ts) return "Baru saja";
            const diff = Date.now() - ts;
            const minutes = Math.floor(diff / 60000);
            if(minutes < 1) return "Baru saja";
            if(minutes < 60) return `${minutes} menit yang lalu`;
            const hours = Math.floor(minutes / 60);
            if(hours < 24) return `${hours} jam yang lalu`;
            return `${Math.floor(hours / 24)} hari yang lalu`;
        }

        function buildCommentHTML(id, c, isReply = false) {
            const hasLiked = localStorage.getItem(`liked_${id}`);
            const likesCount = c.likes || 0;
            const thumbIcon = hasLiked ? iconThumbSolid : iconThumbOutline;

            let html = `
                <div class="yt-comment-wrapper" id="comment-${id}">
                    <img src="${defaultAvatarURL}" class="comment-avatar ${isReply ? 'avatar-sm' : ''}" alt="Avatar">
                    <div class="comment-content">
                        <div class="comment-header">
                            <span class="comment-name">@${c.name}</span>
                            <span class="comment-time">${timeAgo(c.timestamp)}</span>
                        </div>
                        <div class="comment-text">${c.text}</div>
                        <div class="comment-actions">
                            <button class="action-btn" onclick="toggleLike('${id}', '${isReply ? c.parentId : id}', ${isReply})">
                                ${thumbIcon} <span id="like-count-${id}">${likesCount > 0 ? likesCount : ''}</span>
                            </button>
            `;

            if (!isReply) {
                html += `<button class="action-btn" onclick="toggleReplyForm('${id}')">Balas</button>`;
            }

            html += `
                            <button class="action-btn delete-btn" onclick="deleteComment('${id}', '${isReply ? c.parentId : id}', ${isReply})">${iconTrash}</button>
                        </div>
            `;

            if (!isReply) {
                html += `
                        <div class="reply-form-container" id="reply-form-${id}" style="display: none;">
                            <img src="${defaultAvatarURL}" class="comment-avatar avatar-sm" alt="Avatar">
                            <div style="flex:1;">
                                <input type="text" id="reply-name-${id}" placeholder="Nama..." required class="reply-input-name">
                                <textarea id="reply-text-${id}" placeholder="Balas komentar..." required></textarea>
                                <div class="form-actions" style="margin-top:5px;">
                                    <button class="btn-cancel" onclick="toggleReplyForm('${id}')">Batal</button>
                                    <button class="btn-submit-comment" onclick="submitReply('${id}')">Balas</button>
                                </div>
                            </div>
                        </div>
                        <div id="replies-list-${id}" class="replies-list"></div>
                `;
            }

            html += `</div></div>`;
            return html;
        }

        commentsRef.on('value', (snapshot) => {
            const data = snapshot.val();
            let totalComments = 0;

            if (data) {
                const keys = Object.keys(data).reverse(); 
                let finalHTML = '';

                keys.forEach(key => {
                    const c = data[key];
                    totalComments++;
                    finalHTML += buildCommentHTML(key, c, false);
                });

                commentsList.innerHTML = finalHTML;
                document.getElementById('comment-count').innerText = totalComments;

                keys.forEach(key => {
                    const c = data[key];
                    if (c.replies) {
                        const replyKeys = Object.keys(c.replies); 
                        let repliesHTML = '';
                        replyKeys.forEach(rKey => {
                            const rData = c.replies[rKey];
                            rData.parentId = key; 
                            repliesHTML += buildCommentHTML(rKey, rData, true);
                        });
                        document.getElementById(`replies-list-${key}`).innerHTML = repliesHTML;
                    }
                });

            } else {
                commentsList.innerHTML = '<p style="color:#bbb; font-size:1rem; text-align:center; padding: 20px;">Belum ada komentar. Jadilah yang pertama!</p>';
                document.getElementById('comment-count').innerText = 0;
            }
        });

        document.getElementById('comment-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('comment-name');
            const textInput = document.getElementById('comment-text');
            if (nameInput.value && textInput.value) {
                commentsRef.push({
                    name: nameInput.value,
                    text: textInput.value,
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    likes: 0
                });
                textInput.value = '';
            }
        });

        window.submitReply = function(parentId) {
            const nameVal = document.getElementById(`reply-name-${parentId}`).value;
            const textVal = document.getElementById(`reply-text-${parentId}`).value;
            if(nameVal && textVal) {
                commentsRef.child(parentId).child('replies').push({
                    name: nameVal,
                    text: textVal,
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    likes: 0
                });
                document.getElementById(`reply-text-${parentId}`).value = '';
                toggleReplyForm(parentId);
            }
        };

        window.toggleReplyForm = function(id) {
            const form = document.getElementById(`reply-form-${id}`);
            form.style.display = form.style.display === 'none' ? 'flex' : 'none';
        };

        window.toggleLike = function(commentId, parentId, isReply) {
            const hasLiked = localStorage.getItem(`liked_${commentId}`);
            let targetRef = isReply 
                ? commentsRef.child(parentId).child('replies').child(commentId).child('likes')
                : commentsRef.child(commentId).child('likes');

            targetRef.transaction((currentLikes) => {
                if (hasLiked) {
                    localStorage.removeItem(`liked_${commentId}`);
                    return (currentLikes || 1) - 1;
                } else {
                    localStorage.setItem(`liked_${commentId}`, 'true');
                    return (currentLikes || 0) + 1;
                }
            });
        };

        window.deleteComment = function(commentId, parentId, isReply) {
            const pw = prompt("Masukkan password tersebut jika anda adalah admin!");
            if (pw === adminPassword) {
                let targetRef = isReply 
                    ? commentsRef.child(parentId).child('replies').child(commentId)
                    : commentsRef.child(commentId);

                targetRef.remove().then(() => alert("Komentar berhasil dihapus."));
            } else if (pw !== null) {
                alert("Password Salah! Anda tidak memiliki izin.");
            }
        };
// SISTEM PENCARIAN LIVE (AUTOCOMPLETE) 
document.addEventListener('DOMContentLoaded', () => {
    const searchInput = document.getElementById('navSearchInput');
    const searchDropdown = document.getElementById('searchDropdownList');
    const searchForm = document.getElementById('navSearchForm');

    if (searchInput && searchDropdown) {
        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            if (query.length === 0) { searchDropdown.classList.remove('show'); return; }

            if (typeof videoList !== 'undefined') {
                const results = videoList.filter(vid => 
                    (vid.title && vid.title.toLowerCase().includes(query)) || 
                    (vid.genre && vid.genre.toLowerCase().includes(query)) ||
                    (vid.uploadDate && vid.uploadDate.includes(query)) ||
                    (vid.description && vid.description.toLowerCase().includes(query))
                ).slice(0, 6); 

                if (results.length > 0) {
                    let html = '';
                    results.forEach(vid => {
                        html += `
                            <a href="watch.html?id=${vid.id}" class="search-result-item">
                                <img src="${vid.thumb}" alt="Thumbnail">
                                <div class="search-result-info">
                                    <h4>${vid.title}</h4>
                                    <!-- ID khusus untuk load data firebase realtime -->
                                    <p>${vid.genre || 'Umum'} • <span id="search-view-${vid.id}">Memuat...</span></p>
                                </div>
                            </a>
                        `;
                    });
                    searchDropdown.innerHTML = html;
                    searchDropdown.classList.add('show');

                    // LOAD FIREBASE VIEWS
                    results.forEach(vid => {
                        if (typeof listenVideoViews === 'function') {
                            listenVideoViews(vid.id, vid.defaultViews || 0, (totalViews) => {
                                const viewEl = document.getElementById(`search-view-${vid.id}`);
                                if (viewEl) viewEl.innerText = `${formatViews(totalViews)}`;
                            });
                        }
                    });
                } else {
                    searchDropdown.innerHTML = `<div style="padding: 15px; text-align: center; color: #bbb; font-size: 0.85rem;">Tidak ada hasil untuk "${query}"</div>`;
                    searchDropdown.classList.add('show');
                }
            }
        });

        document.addEventListener('click', function(e) {
            if (!searchForm.contains(e.target)) searchDropdown.classList.remove('show');
        });

        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const q = searchInput.value.trim();
            if (q) {
                const isVideosPage = window.location.pathname.endsWith('videos.html') || window.location.pathname === '/' || window.location.pathname.endsWith('/');
                if (isVideosPage && typeof executeSearchOnHome === 'function') {
                    executeSearchOnHome(q);
                    searchDropdown.classList.remove('show');
                } else {
                    window.location.href = `videos.html?search=${encodeURIComponent(q)}`;
                }
            }
        });
    }
});
    </script>
</body>
</html>
