<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEMUTAR VIDEO - LUVIA STUDIO OFFICIAL TV</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="Asset Foto/Thumbnimail .png">
</head>
<body>

    <nav>
        <div class="container nav-container">
            <div class="nav-history-controls">
                <button onclick="history.back()" class="btn-nav-history" title="Kembali">←</button>
                <button onclick="history.forward()" class="btn-nav-history" title="Maju">→</button>
            </div>
            <div class="nav-links">
                <a href="index.html">Beranda</a>
                <a href="#contact">Social Media</a>
            </div>
            <form class="nav-search" onsubmit="return false;">
                <input type="text" placeholder="Cari video..." aria-label="Cari">
                <button type="submit">🔍</button>
            </form>
        </div>
    </nav>

    <main class="container page-stream-container">
        <section class="main-video-section">
            <h1 id="player-title" class="stream-title">Memuat Video...</h1>
            <div class="plyr-wrapper" id="video-player-wrapper"></div>

            <div class="video-info">
                <h2 id="info-title">...</h2>
                <div id="info-desc">
                    <p id="desc-text">Memuat deskripsi...</p>
                    <div id="download-area"></div>
                    <div id="views-display-box" style="font-weight: bold; color: #ff914d; margin-top: 10px;">
                        👁️ Memuat jumlah ditonton...
                    </div>
                </div>
            </div>
        </section>

        <section class="other-videos-section">
            <h2>Video Lainnya</h2>
            <div class="video-grid" id="watch-recommendations-grid"></div>
        </section>
    </main>

    <footer><div class="container"><p>&copy 2026 LUVIA STUDIO TV All Right Reserved</p></div></footer>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="videos-data.js"></script>

    <script>
        // ==========================================
        // HELPER FUNGSI VIEWER (GLOBAL & CEGAH NaN)
        // ==========================================

        // 1. Format Angka (Cegah NaN)
        function formatViews(views) {
            const num = parseInt(views, 10);
            if (isNaN(num)) return '0 Ditonton';
            return num.toLocaleString('id-ID') + ' Ditonton';
        }

        // 2. Ambil & Tambah Views Server Global (CountAPI)
        async function incrementVideoViewsAsync(videoId, defaultViews = 0) {
            const namespace = "luvia-studio-official-tv"; // ID unik website kamu
            const baseViews = parseInt(defaultViews, 10) || 0;

            try {
                // Request hitungan ke server online (bebas akses dari HP/laptop manapun)
                const response = await fetch(`https://api.countapi.xyz/hit/${namespace}/${videoId}`);
                const data = await response.json();

                if (data && typeof data.value === 'number') {
                    return baseViews + data.value;
                }
                return baseViews;
            } catch (error) {
                console.error("Gagal update viewer online:", error);
                // Fallback jika server terganggu agar tidak tampil NaN
                return baseViews;
            }
        }

        // Fungsi Helper Download jika belum ada di script luar
        if (typeof downloadVideoFile !== 'function') {
            window.downloadVideoFile = function(url, filename) {
                const a = document.createElement('a');
                a.href = url;
                a.download = filename || 'video.mp4';
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };
        }

        // ==========================================
        // LOGIKA UTAMA HALAMAN WATCH
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        const currentVideoId = urlParams.get('id') || 'video1';
        const currentVid = (typeof videoList !== 'undefined' && videoList.find(v => v.id === currentVideoId)) || {
            id: currentVideoId,
            title: 'Video Tidak Ditemukan',
            description: '-',
            defaultViews: 0
        };

        // 1. Render Judul & Deskripsi
        document.getElementById('player-title').innerText = currentVid.title;
        document.getElementById('info-title').innerText = currentVid.title;
        document.getElementById('desc-text').innerText = currentVid.description;

        // 2. Generate Area Download
        let downloadAreaHTML = '';
        const safeTitle = (currentVid.title || 'video').replace(/'/g, "\\'");

        if (currentVid.sources && currentVid.sources.length > 0) {
            const optionsHTML = currentVid.sources.map(s => `<option value="${s.src}">${s.size || 'HD'}p</option>`).join('');
            downloadAreaHTML = `
                <div class="download-container">
                    <span class="download-label">📥 Pilih Resolusi:</span>
                    <select id="download-quality-select" class="download-select">${optionsHTML}</select>
                    <button onclick="downloadVideoFile(document.getElementById('download-quality-select').value, '${safeTitle}.mp4')" class="btn-download-action">Download</button>
                </div>`;
        } else if (currentVid.downloadUrl || currentVid.archiveSrc) {
            const url = currentVid.downloadUrl || currentVid.archiveSrc;
            downloadAreaHTML = `<div class="download-container"><button onclick="downloadVideoFile('${url}', '${safeTitle}.mp4')" class="btn-download-action">📥 Download Video</button></div>`;
        }
        document.getElementById('download-area').innerHTML = downloadAreaHTML;

        // 3. Update Views (Async Global)
        incrementVideoViewsAsync(currentVid.id, currentVid.defaultViews || 0).then(totalViews => {
            document.getElementById('views-display-box').innerText = `👁️ ${formatViews(totalViews)}`;
        });

        // 4. Logika Player
        const playerWrapper = document.getElementById('video-player-wrapper');
        if (currentVid.driveEmbed) {
            playerWrapper.innerHTML = `<iframe src="${currentVid.driveEmbed}" allowfullscreen="true" style="width:100%; aspect-ratio:16/9; border:none;"></iframe>`;
        } else if (currentVid.rumbleEmbed) {
            playerWrapper.innerHTML = `<iframe src="${currentVid.rumbleEmbed}" allowfullscreen="true" style="width:100%; aspect-ratio:16/9; border:none;"></iframe>`;
        } else if (currentVid.customEmbed) {
            playerWrapper.innerHTML = `<iframe src="${currentVid.customEmbed}" allowfullscreen="true" allow="autoplay; encrypted-media" style="width:100%; aspect-ratio:16/9; border:none;"></iframe>`;
        } else if (currentVid.youtubeId) {
            playerWrapper.innerHTML = `<iframe src="https://www.youtube.com/embed/${currentVid.youtubeId}?enablejsapi=1" allowfullscreen="true" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" style="width:100%; aspect-ratio:16/9; border:none;"></iframe>`;
        } else {
            playerWrapper.innerHTML = `<video id="plyr-player" controls playsinline poster="${currentVid.thumb || ''}"><source src="${currentVid.archiveSrc || ''}" type="video/mp4" /></video>`;
            if (document.getElementById('plyr-player')) {
                const player = new Plyr('#plyr-player', {
                    invertTime: false,
                    toggleInvert: false,
                    settings: ['quality', 'speed'],
                    quality: { default: 720, options: [720, 1080] }
                });
            }
        }

        // 5. Render Rekomendasi
        if (typeof renderGridRecommendations === 'function') {
            renderGridRecommendations('watch-recommendations-grid');
        }
    </script>
</body>
</html>
