<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEMUTAR VIDEO - LUVIA STUDIO OFFICIAL TV</title>
    <!-- Library CSS Plyr.io -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="Asset Foto/Thumbnimail .png">
</head>
<body>

    <nav>
        <div class="container nav-container">
            <div class="nav-history-controls">
                <button onclick="history.back()" class="btn-nav-history" title="Kembali">←</button>
                <button onclick="history.forward()" class="btn-nav-history" title="Maju">→</button>
            </div>
            <div class="nav-links">
                <a href="index.html">Beranda</a>
                <a href="#contact">Social Media</a>
            </div>
            <form class="nav-search" onsubmit="return false;">
                <input type="text" placeholder="Cari video..." aria-label="Cari">
                <button type="submit">🔍</button>
            </form>
        </div>
    </nav>

    <main class="container page-stream-container">
        <section class="main-video-section">
            <h1 id="player-title" class="stream-title">Memuat Video...</h1>
            
            <!-- Kontainer Player Multi-Source (Plyr.io / Drive / Rumble / YouTube / Custom) -->
            <div class="plyr-wrapper" id="video-player-wrapper">
                <video id="plyr-player" controls playsinline crossorigin="anonymous" poster="Asset Foto/Thumbnimail  Banner YT.png">
                    <source id="video-source" src="" type="video/mp4" />
                </video>
            </div>

            <div class="video-info">
                <h2 id="info-title">...</h2>
                <div id="info-desc">...</div>
            </div>
        </section>

        <section class="other-videos-section">
            <h2>Video Lainnya</h2>
            <div class="video-grid" id="watch-recommendations-grid">
                <!-- Kartu Utama Live Streaming Kick -->
                <a href="livestream.html" class="video-card featured-live-card">
                    <div class="thumb-box">
                        <span id="kick-watch-badge" class="badge-live">🔴 CHECKING...</span>
                        <img src="Asset Foto/live stream.png" alt="Live Streaming">
                    </div>
                    <div class="video-details">
                        <h3>LIVE STREAMING LUVIA STUDIO TV</h3>
                        <p>LUVIA STUDIO TV • LIVE</p>
                    </div>
                </a>
                <!-- Rekomendasi otomatis dirender via JS -->
            </div>
        </section>
    </main>

    <section id="contact" class="section">
        <div class="container">
            <h2>Follow Us</h2>
            <div class="contact-links">
                <p><a href="https://www.youtube.com/@luthfi-fx" target="_blank" class="btn btn-contact">YOUTUBE</a></p>
                <p><a href="https://www.instagram.com/fauzanlathif_86" target="_blank" class="btn btn-contact">INSTAGRAM</a></p>
                <p><a href="https://www.tiktok.com/@fauzan_lathif" target="_blank" class="btn btn-contact">TIKTOK</a></p>
                <p><a href="https://www.dubbindo.site/@luviastudioofficialtv" target="_blank" class="btn btn-contact">UVIDEO DUBBINDO</a></p>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy 2026 LUVIA STUDIO TV All Right Reserved | Channel Ini Dikelola Oleh TIM MEDIA CENTER LSTV</p>
        </div>
    </footer>

    <!-- SCRIPT UTAMA -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="videos-data.js"></script>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentVideoId = urlParams.get('id') || 'video1';

        const currentVid = videoList.find(v => v.id === currentVideoId) || videoList[0];

        // Tambahkan hitungan ditonton +1 setiap kali halaman ini dimuat
        const updatedViews = incrementVideoViews(currentVid.id);

        // --- GENERATE AREA DOWNLOAD & RESOLUSI ---
        let downloadAreaHTML = '';

        if (currentVid.sources && currentVid.sources.length > 0) {
            // Opsi A: Jika video memiliki daftar resolusi (Archive.org / Direct MP4)
            const optionsHTML = currentVid.sources.map(s => 
                `<option value="${s.src}">${s.size || 'HD'}p</option>`
            ).join('');

            downloadAreaHTML = `
                <div class="download-container">
                    <span class="download-label">📥 Pilih Resolusi Unduh:</span>
                    <select id="download-quality-select" class="download-select">
                        ${optionsHTML}
                    </select>
                    <button onclick="downloadVideoFile(document.getElementById('download-quality-select').value, '${currentVid.title.replace(/'/g, "\\'")}.mp4')" 
                            class="btn-download-action">
                        Download MP4
                    </button>
                </div>
            `;
        } else {
            // Opsi B: Jika video hanya memiliki 1 link download utama (Rumble / Google Drive / YouTube / Single Link)
            const targetDownloadUrl = currentVid.downloadUrl || currentVid.archiveSrc || '';
            if (targetDownloadUrl) {
                downloadAreaHTML = `
                    <div class="download-container">
                        <button onclick="downloadVideoFile('${targetDownloadUrl}', '${currentVid.title.replace(/'/g, "\\'")}.mp4')" 
                                class="btn-download-action">
                            📥 Download Video (Kualitas Tertinggi)
                        </button>
                    </div>
                `;
            }
        }

        // Render susunan: Judul -> Kalimat Deskripsi -> Opsi Download & Resolusi -> Jumlah Ditonton
        document.getElementById('player-title').innerText = currentVid.title;
        document.getElementById('info-title').innerText = currentVid.title;
        document.getElementById('info-desc').innerHTML = `
            <p>${currentVid.description}</p>
            ${downloadAreaHTML}
            <div style="font-weight: bold; color: #ff914d; margin-top: 10px;">
                👁️ ${formatViews(updatedViews)}
            </div>
        `;
        
        // --- LOGIKA MULTI-SOURCE PLAYER (FIXED YOUTUBE, RESOLUSI, & CUSTOM EMBED) ---
        const playerWrapper = document.getElementById('video-player-wrapper');

        if (currentVid.driveEmbed) {
            // Option 1: Google Drive
            playerWrapper.style.position = "relative";
            playerWrapper.style.width = "100%";
            playerWrapper.style.paddingTop = "56.25%"; 
            playerWrapper.style.overflow = "hidden";
            playerWrapper.style.zIndex = "1";

            playerWrapper.innerHTML = `
                <iframe 
                    src="${currentVid.driveEmbed}" 
                    allow="autoplay" 
                    allowfullscreen="true"
                    style="position: absolute; top:0; left:0; width:100%; height:100%; border:none; z-index:2;">
                </iframe>
            `;
        } else if (currentVid.rumbleEmbed) {
            // Option 2: Rumble
            playerWrapper.style.position = "relative";
            playerWrapper.style.width = "100%";
            playerWrapper.style.paddingTop = "56.25%";
            playerWrapper.style.overflow = "hidden";
            playerWrapper.style.zIndex = "1";

            playerWrapper.innerHTML = `
                <iframe 
                    src="${currentVid.rumbleEmbed}" 
                    allowfullscreen="true"
                    style="position: absolute; top:0; left:0; width:100%; height:100%; border:none; z-index:2;">
                </iframe>
            `;
        } else if (currentVid.customEmbed) {
            // Option 3: UVideo Dubbindo / Platform Iframe Lainnya
            playerWrapper.style.position = "relative";
            playerWrapper.style.width = "100%";
            playerWrapper.style.paddingTop = "56.25%";
            playerWrapper.style.overflow = "hidden";
            playerWrapper.style.zIndex = "1";

            playerWrapper.innerHTML = `
                <iframe 
                    src="${currentVid.customEmbed}" 
                    allowfullscreen="true" 
                    allow="autoplay; encrypted-media"
                    style="position: absolute; top:0; left:0; width:100%; height:100%; border:none; z-index:2;">
                </iframe>
            `;
        } else if (currentVid.youtubeId) {
            // Option 4: YouTube (Player Single Clean & Opsi Resolusi Aktif)
            playerWrapper.innerHTML = `
                <div id="youtube-plyr" data-plyr-provider="youtube" data-plyr-embed-id="${currentVid.youtubeId}"></div>
            `;

            const player = new Plyr('#youtube-plyr', {
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
                settings: ['quality', 'speed']
            });
        } else {
            // Option 5: Direct MP4 / Archive.org
            playerWrapper.innerHTML = `
                <video id="plyr-player" controls playsinline crossorigin="anonymous" poster="${currentVid.thumb || 'Asset Foto/Thumbnimail  Banner YT.png'}">
                    <source src="${currentVid.archiveSrc || ''}" type="video/mp4" />
                </video>
            `;

            const videoSources = currentVid.sources || [
                { src: currentVid.archiveSrc || '', type: 'video/mp4', size: 720 }
            ];
            
            const player = new Plyr('#plyr-player', {
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
                settings: ['quality', 'speed'],
                quality: {
                    default: videoSources[0].size || 720,
                    options: videoSources.map(s => s.size)
                }
            });

            player.source = {
                type: 'video',
                title: currentVid.title,
                sources: videoSources,
                poster: currentVid.thumb || 'Asset Foto/Thumbnimail  Banner YT.png'
            };
        }

        // Render otomatis kartu video rekomendasi
        renderGridRecommendations('watch-recommendations-grid');

        // Pengecek Status Stream Kick
        const kickChannel = "luthfi1234321";
        async function updateWatchLiveBadge() {
            const badge = document.getElementById('kick-watch-badge');
            if (!badge) return;

            try {
                const res = await fetch(`https://kick.com/api/v2/channels/${kickChannel}`);
                const data = await res.json();

                if (data.livestream) {
                    badge.innerText = "🔴 SEDANG LIVE";
                    badge.className = "badge-live";
                } else {
                    badge.innerText = "⚪ OFFLINE";
                    badge.className = "badge-offline";
                }
            } catch (err) {
                badge.innerText = "📺 KICK LIVE";
                badge.className = "badge-live";
            }
        }
        updateWatchLiveBadge();
    </script>
</body>
</html>
