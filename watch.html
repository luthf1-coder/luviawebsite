    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="videos-data.js"></script>
    <script src="analytics-tracker.js"></script>

    <script>
    // =====================================================================
    //  PEMUTAR: MP4 / WEBM / HLS (.m3u8) / DASH (.mpd) + PILIHAN KUALITAS
    // =====================================================================
    const CDN = {
        hls:  'https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js',
        dash: 'https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js'
    };

    function muatScript(src) {
        return new Promise((resolve, reject) => {
            const ada = document.querySelector('script[data-lib="' + src + '"]');
            if (ada) { if (ada.dataset.siap === '1') return resolve(); ada.addEventListener('load', () => resolve()); ada.addEventListener('error', () => reject()); return; }
            const s = document.createElement('script');
            s.src = src; s.dataset.lib = src;
            s.onload = () => { s.dataset.siap = '1'; resolve(); };
            s.onerror = () => reject(new Error('Gagal memuat ' + src));
            document.head.appendChild(s);
        });
    }

    function jenisSumber(url) {
        const u = String(url || '').toLowerCase();
        if (/\.m3u8(\?|#|$)/.test(u) || /[?&](format|type)=(m3u8|hls)/.test(u)) return 'hls';
        if (/\.mpd(\?|#|$)/.test(u)) return 'dash';
        return 'native';
    }

    function hancurkanPlayer() {
        try { if (window.player) window.player.destroy(); } catch (e) {}
        window.player = null;
        try { if (window.hlsInst) window.hlsInst.destroy(); } catch (e) {}
        window.hlsInst = null;
        try { if (window.dashInst) window.dashInst.reset(); } catch (e) {}
        window.dashInst = null;
    }

    function buatVideoEl(wrapper, poster) {
        wrapper.innerHTML = '<video id="plyr-player" playsinline controls' + (poster ? ' poster="' + escHtmlGlobal(poster) + '"' : '') + '></video>';
        return document.getElementById('plyr-player');
    }

    function tampilkanErrorPemutar(wrapper, pesan) {
        wrapper.innerHTML = '<div class="wp-player-error">' + icon(IKON.video) +
            '<p>' + pesan + '</p><small>Kemungkinan: link mati, format tidak didukung browser, atau server video memblokir akses (CORS).</small></div>';
    }

    // Opsi Plyr. daftarTinggi = [1080, 720, ...] untuk HLS/DASH; "0" = Auto
    function opsiPlyr(daftarTinggi, gantiKualitas, kualitasBawaan, ukuranDefault) {
        const o = {
            keyboard: { focused: true, global: true },
            seekTime: 10,
            controls: ['play-large', 'rewind', 'play', 'fast-forward', 'progress', 'current-time', 'duration', 'mute', 'volume', 'settings', 'pip', 'fullscreen'],
            settings: ['speed']
        };
        if (daftarTinggi && daftarTinggi.length) {
            o.settings = ['quality', 'speed'];
            o.quality = { default: 0, options: [0].concat(daftarTinggi), forced: true, onChange: (h) => gantiKualitas(Number(h)) };
            o.i18n = { qualityLabel: { 0: 'Auto' } };
        } else if (kualitasBawaan) {
            o.settings = ['quality', 'speed'];
            o.quality = { default: ukuranDefault };
        }
        return o;
    }

    function jadikanPlyr(video, opsi) {
        window.player = new Plyr(video, opsi);
        aturInteraksiPlayer();
    }

    // ---------- HLS (.m3u8) ----------
    async function pasangHls(wrapper, src, poster, setelahNativeGagal) {
        try { await muatScript(CDN.hls); }
        catch (e) { return tampilkanErrorPemutar(wrapper, 'Pustaka pemutar HLS gagal dimuat. Periksa koneksi internet.'); }

        const video = buatVideoEl(wrapper, poster);

        if (window.Hls && Hls.isSupported()) {
            const hls = new Hls({ enableWorker: true });
            window.hlsInst = hls;
            let siap = false;

            const ganti = (h) => {
                if (!h) { hls.currentLevel = -1; return; }          // Auto
                let idx = -1, best = -1;
                hls.levels.forEach((l, i) => { if (l.height === h && (l.bitrate || 0) >= best) { best = l.bitrate || 0; idx = i; } });
                if (idx >= 0) hls.currentLevel = idx;
            };
            const buka = (tinggi) => {
                if (siap) return; siap = true;
                jadikanPlyr(video, opsiPlyr(tinggi, ganti));
            };

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                const tinggi = Array.from(new Set(hls.levels.map(l => l.height).filter(Boolean))).sort((a, b) => b - a);
                buka(tinggi.length > 1 ? tinggi : []);
            });
            hls.on(Hls.Events.ERROR, (ev, d) => {
                if (!d.fatal) return;
                if (d.type === Hls.ErrorTypes.NETWORK_ERROR && siap) { hls.startLoad(); return; }
                if (d.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); return; }
                hancurkanPlayer();
                tampilkanErrorPemutar(wrapper, setelahNativeGagal ? 'Video tidak dapat diputar.' : 'Video HLS tidak dapat dimuat.');
            });
            setTimeout(() => buka([]), 7000);     // jaga-jaga jika manifest lambat
            hls.loadSource(src);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = src;                       // Safari/iOS: HLS bawaan (tanpa menu kualitas manual)
            jadikanPlyr(video, opsiPlyr([]));
        } else {
            tampilkanErrorPemutar(wrapper, 'Browser ini tidak mendukung video HLS.');
        }
    }

    // ---------- DASH (.mpd) ----------
    async function pasangDash(wrapper, src, poster) {
        try { await muatScript(CDN.dash); }
        catch (e) { return tampilkanErrorPemutar(wrapper, 'Pustaka pemutar DASH gagal dimuat. Periksa koneksi internet.'); }

        const video = buatVideoEl(wrapper, poster);
        const dp = dashjs.MediaPlayer().create();
        window.dashInst = dp;
        let siap = false;

        const buka = (tinggi, daftar) => {
            if (siap) return; siap = true;
            const ganti = (h) => {
                if (!h) { dp.updateSettings({ streaming: { abr: { autoSwitchBitrate: { video: true } } } }); return; }
                const it = (daftar || []).filter(x => x.height === h).sort((a, b) => b.bitrate - a.bitrate)[0];
                if (!it) return;
                dp.updateSettings({ streaming: { abr: { autoSwitchBitrate: { video: false } } } });
                dp.setQualityFor('video', it.qualityIndex);
            };
            jadikanPlyr(video, opsiPlyr(tinggi, ganti));
        };

        dp.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, () => {
            let daftar = [];
            try { daftar = dp.getBitrateInfoListFor('video') || []; } catch (e) {}
            const tinggi = Array.from(new Set(daftar.map(x => x.height).filter(Boolean))).sort((a, b) => b - a);
            buka(tinggi.length > 1 ? tinggi : [], daftar);
        });
        dp.on(dashjs.MediaPlayer.events.ERROR, () => { if (!siap) { hancurkanPlayer(); tampilkanErrorPemutar(wrapper, 'Video DASH tidak dapat dimuat.'); } });
        setTimeout(() => buka([], []), 7000);
        dp.initialize(video, src, false);
    }

    // ---------- MP4 / WEBM / lainnya (+ beberapa resolusi dari "sources") ----------
    function pasangNative(wrapper, vid) {
        const video = buatVideoEl(wrapper, vid.thumb);
        const daftar = (vid.sources && vid.sources.length) ? vid.sources : null;
        let ukuranMax = 0;

        if (daftar) {
            daftar.forEach(s => {
                const el = document.createElement('source');
                el.src = s.src; el.type = s.type || 'video/mp4';
                if (s.size) { el.setAttribute('size', s.size); ukuranMax = Math.max(ukuranMax, Number(s.size) || 0); }
                video.appendChild(el);
            });
        } else {
            video.src = vid.archiveSrc;
        }
        jadikanPlyr(video, opsiPlyr(null, null, !!daftar && daftar.length > 1, ukuranMax));

        // Link tanpa ekstensi yang ternyata HLS/DASH: coba HLS sebagai cadangan
        let sudah = false;
        video.addEventListener('error', () => {
            if (sudah) return; sudah = true;
            const src = vid.archiveSrc || (daftar && daftar[0] && daftar[0].src);
            if (!src) return tampilkanErrorPemutar(wrapper, 'Video tidak dapat diputar.');
            hancurkanPlayer();
            pasangHls(wrapper, src, vid.thumb, true);
        }, true);
    }

    // =====================================================================
    //  INTERAKSI PLAYER (ketuk 2x, autoplay berikutnya)
    // =====================================================================
    let countdownInterval = null;
    let videoSekarang = null;

    function aturInteraksiPlayer() {
        const wrap = document.getElementById('video-player-wrapper');
        if (!wrap || !window.player) return;

        // Ketuk 2x untuk maju/mundur 10 detik (HP)
        if (!wrap.dataset.tapPasang) {
            wrap.dataset.tapPasang = '1';
            let lastTap = 0;
            wrap.addEventListener('touchend', (e) => {
                if (!window.player) return;
                const now = Date.now(), selisih = now - lastTap;
                if (selisih < 300 && selisih > 0) {
                    const x = e.changedTouches[0].clientX;
                    const kotak = wrap.getBoundingClientRect();
                    if (x > kotak.left + kotak.width / 2) window.player.forward(10); else window.player.rewind(10);
                }
                lastTap = now;
            });
        }

        // Putar otomatis video berikutnya (hitung mundur 20 detik)
        window.player.on('ended', () => {
            const toggle = document.getElementById('autoplay-toggle');
            if (!toggle || !toggle.checked) return;
            const box = document.getElementById('autoplay-countdown');
            const timer = document.getElementById('countdown-timer');
            box.style.display = 'block';
            let sisa = 20; timer.innerText = sisa;
            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                sisa -= 1; timer.innerText = sisa;
                if (sisa <= 0) {
                    clearInterval(countdownInterval);
                    if (typeof videoList !== 'undefined') {
                        const urut = [...videoList].sort((a, b) => (b.defaultViews || 0) - (a.defaultViews || 0));
                        const next = urut.find(v => !videoSekarang || v.id !== videoSekarang.id);
                        if (next) window.location.href = 'watch.html?id=' + encodeURIComponent(next.id);
                    }
                }
            }, 1000);
        });
        window.player.on('play', () => {
            clearInterval(countdownInterval);
            const box = document.getElementById('autoplay-countdown');
            if (box) box.style.display = 'none';
        });
    }

    // =====================================================================
    //  HALAMAN UTAMA
    // =====================================================================
    let halamanSiap = false;

    function jalankanPemutarVideo() {
        const urlParams = new URLSearchParams(window.location.search);
        const currentVideoId = urlParams.get('id') || 'video1';
        const ditemukan = (typeof videoListSemua !== 'undefined') ? videoListSemua.find(v => v.id === currentVideoId) : null;

        const sembunyikanSemua = (judul, pesan) => {
            document.getElementById('player-title').innerText = judul;
            document.getElementById('desc-text').innerText = pesan;
            ['meta-container', 'aksi-container', 'comments-section'].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
            document.getElementById('desc-box').classList.remove('collapsed');
            document.getElementById('video-player-wrapper').innerHTML = '<div class="wp-player-error">' + icon(IKON.video) + '<p>' + judul + '</p></div>';
        };

        if (!ditemukan) {
            if (typeof videoListSemua !== 'undefined' && videoListSemua.length === 0) return;   // data belum siap
            halamanSiap = true;
            return sembunyikanSemua('Video Tidak Ditemukan', 'Maaf, video ini tidak tersedia.');
        }
        halamanSiap = true;
        const currentVid = ditemukan;
        videoSekarang = currentVid;

        // Video pribadi: hanya admin (atau pratinjau dari halaman admin)
        if (currentVid.visibility === 'pribadi' && !(IS_ADMIN_BROWSER || IZIN_PRATINJAU)) {
            return sembunyikanSemua('Video Tidak Ditemukan', 'Maaf, video ini tidak tersedia.');
        }

        document.title = currentVid.title + ' - LUVIA STUDIO TV';
        document.getElementById('player-title').innerText = currentVid.title;

        // Deskripsi (bisa dilipat)
        const descEl = document.getElementById('desc-text');
        descEl.innerText = currentVid.description || 'Tidak ada deskripsi.';
        const descBox = document.getElementById('desc-box');
        const descBtn = document.getElementById('desc-toggle');
        if ((currentVid.description || '').length > 170) {
            descBtn.style.display = 'inline-block';
            descBtn.onclick = () => {
                const lipat = descBox.classList.toggle('collapsed');
                descBtn.innerText = lipat ? 'Selengkapnya' : 'Sembunyikan';
            };
        } else { descBox.classList.remove('collapsed'); }

        // Genre & tanggal
        const genreName = currentVid.genre || 'Umum';
        const genreLink = document.getElementById('genre-link');
        genreLink.innerText = genreName;
        genreLink.href = 'videos.html?genre=' + encodeURIComponent(genreName);
        document.getElementById('upload-date-display').innerText = currentVid.uploadDate ? formatDateIndonesian(currentVid.uploadDate) : 'Tanggal tidak diketahui';

        // Penanda visibilitas (hanya terlihat admin / pratinjau)
        if (currentVid.visibility && currentVid.visibility !== 'publik') {
            const chip = document.getElementById('chip-visibilitas');
            chip.style.display = 'inline-flex';
            chip.innerText = currentVid.visibility === 'pribadi' ? 'Pribadi (hanya admin)' : 'Tidak publik (khusus link)';
        }

        // Pemutar
        const playerWrapper = document.getElementById('video-player-wrapper');
        const sumber = currentVid.archiveSrc || (currentVid.sources && currentVid.sources[0] ? currentVid.sources[0].src : '');
        let jenis = 'iframe';
        const permit = 'autoplay; encrypted-media; picture-in-picture; fullscreen';

        if (currentVid.driveEmbed) {
            playerWrapper.innerHTML = '<iframe class="drive-iframe" src="' + currentVid.driveEmbed + '" allowfullscreen="true" style="border:none;"></iframe>';
        } else if (currentVid.rumbleEmbed) {
            playerWrapper.innerHTML = '<iframe src="' + currentVid.rumbleEmbed + '" allowfullscreen="true" allow="' + permit + '" style="border:none;"></iframe>';
        } else if (currentVid.customEmbed) {
            playerWrapper.innerHTML = '<iframe src="' + currentVid.customEmbed + '" allowfullscreen="true" allow="' + permit + '" referrerpolicy="strict-origin-when-cross-origin" style="border:none;"></iframe>';
        } else if (currentVid.youtubeId) {
            playerWrapper.innerHTML = '<iframe src="https://www.youtube.com/embed/' + currentVid.youtubeId + '?enablejsapi=1&rel=0" allowfullscreen="true" allow="accelerometer; ' + permit + '" referrerpolicy="strict-origin-when-cross-origin" style="border:none;"></iframe>';
        } else if (!sumber) {
            tampilkanErrorPemutar(playerWrapper, 'Sumber video belum diisi.');
        } else {
            jenis = jenisSumber(sumber);
            if (jenis === 'hls') pasangHls(playerWrapper, sumber, currentVid.thumb);
            else if (jenis === 'dash') pasangDash(playerWrapper, sumber, currentVid.thumb);
            else pasangNative(playerWrapper, currentVid);
        }

        // Tombol unduh (tidak untuk HLS/DASH)
        let downloadAreaHTML = '';
        const safeTitle = (currentVid.title || 'video').replace(/[^\w\- ]+/g, '').trim() || 'video';
        if (jenis !== 'hls' && jenis !== 'dash') {
            if (currentVid.sources && currentVid.sources.length > 1) {
                const optionsHTML = currentVid.sources.map((s, i) => '<option value="' + i + '">' + (s.size || 'HD') + 'p</option>').join('');
                downloadAreaHTML = '<span class="download-container"><span class="download-label">' + icon(IKON.unduh) + ' Resolusi:</span>' +
                    '<select id="download-quality-select" class="download-select">' + optionsHTML + '</select>' +
                    '<button type="button" id="btn-unduh" class="btn-download-action">Unduh</button></span>';
            } else if (currentVid.downloadUrl || currentVid.archiveSrc) {
                downloadAreaHTML = '<button type="button" id="btn-unduh" class="wp-btn">' + icon(IKON.unduh) + ' Unduh Video</button>';
            }
        }
        const areaUnduh = document.getElementById('download-area');
        areaUnduh.innerHTML = downloadAreaHTML;
        const btnUnduh = document.getElementById('btn-unduh');
        if (btnUnduh) btnUnduh.onclick = () => {
            let url = currentVid.downloadUrl || currentVid.archiveSrc;
            const sel = document.getElementById('download-quality-select');
            if (sel && currentVid.sources) url = currentVid.sources[Number(sel.value)].src;
            downloadVideoFile(url, safeTitle + '.mp4');
        };

        // Bagikan
        document.getElementById('btn-share').onclick = async () => {
            const url = location.href;
            try {
                if (navigator.share) await navigator.share({ title: currentVid.title, url: url });
                else { await navigator.clipboard.writeText(url); tampilToast('Link video disalin'); }
            } catch (e) {}
        };

        // Jumlah tayangan
        const viewsBox = document.getElementById('views-display-box');
        if (typeof incrementVideoViewsAsync === 'function') {
            incrementVideoViewsAsync(currentVid.id, currentVid.defaultViews || 0).then(total => {
                viewsBox.innerHTML = icon(IKON.dilihat) + ' ' + formatViews(total);
            }).catch(() => { viewsBox.innerHTML = icon(IKON.dilihat) + ' ' + (currentVid.defaultViews || 0) + ' Ditonton'; });
        }
        if (typeof renderGridRecommendations === 'function') renderGridRecommendations('watch-recommendations-grid');

        mulaiKomentar(currentVid);
        terapkanIkon();
    }

    // =====================================================================
    //  KOMENTAR
    // =====================================================================
    function waktuLalu(ts) {
        if (!ts) return 'Baru saja';
        const m = Math.floor((Date.now() - ts) / 60000);
        if (m < 1) return 'Baru saja';
        if (m < 60) return m + ' menit yang lalu';
        const j = Math.floor(m / 60);
        if (j < 24) return j + ' jam yang lalu';
        return Math.floor(j / 24) + ' hari yang lalu';
    }

    function mulaiKomentar(currentVid) {
        const commentsRef = firebase.database().ref('video_comments_v2/' + currentVid.id);
        const commentsList = document.getElementById('comments-list');
        const refKomentar = (id, parent, isReply) => isReply
            ? commentsRef.child(parent).child('replies').child(id)
            : commentsRef.child(id);
        let kolomKomentar = null;

        function bangunKomentar(id, c, isReply, parentId) {
            const sudahSuka = localStorage.getItem('liked_' + id);
            const milikku = localStorage.getItem('my_comment_' + id) === 'true';
            const bisaEdit = milikku && (!!c.isAdmin === IS_ADMIN_BROWSER);   // mode admin: komentar orang lain tidak bisa diedit
            const bisaHapus = milikku || IS_ADMIN_BROWSER;            // admin boleh memoderasi
            const dataAttr = 'data-id="' + id + '" data-parent="' + (parentId || '') + '" data-reply="' + (isReply ? 1 : 0) + '"';
            const kelasAva = 'comment-avatar' + (isReply ? ' avatar-sm' : '');
            const lencana = c.isAdmin ? lencanaAdmin() : '';

            let h = '<div class="yt-comment-wrapper" id="comment-' + id + '">' +
                buatAvatar(namaKomentar(c), { kelas: kelasAva, admin: !!c.isAdmin }) +
                '<div class="comment-content">' +
                    '<div class="comment-header"><span class="comment-name">@' + escHtmlGlobal(namaKomentar(c)) + '</span>' + lencana +
                    '<span class="comment-time">' + waktuLalu(c.timestamp) + '</span></div>' +
                    '<div class="comment-text">' + escHtmlGlobal(c.text) + '</div>' +
                    '<div class="comment-actions">' +
                        '<button type="button" class="action-btn" data-act="like" ' + dataAttr + '>' + icon(sudahSuka ? IKON.jempolIsi : IKON.jempol) + ' <span>' + ((c.likes || 0) > 0 ? c.likes : '') + '</span></button>' +
                        (!isReply ? '<button type="button" class="action-btn" data-act="reply" ' + dataAttr + '>' + icon(IKON.balas) + ' Balas</button>' : '') +
                        (bisaEdit ? '<button type="button" class="action-btn" data-act="edit" title="Edit" aria-label="Edit" ' + dataAttr + '>' + icon(IKON.edit) + '</button>' : '') +
                        (bisaHapus ? '<button type="button" class="action-btn delete-btn" data-act="del" title="Hapus" aria-label="Hapus" ' + dataAttr + '>' + icon(IKON.hapus) + '</button>' : '') +
                    '</div>';

            if (!isReply) {
                h += '<div class="reply-form-container" id="reply-form-' + id + '" style="display:none;">' +
                        buatAvatar('', { kelas: 'comment-avatar avatar-sm' }) +
                        '<div style="flex:1;">' +
                            ((IS_ADMIN_BROWSER || ambilNama()) ? '' : '<input type="text" id="reply-name-' + id + '" placeholder="Nama pengguna..." maxlength="24" class="reply-input-name">') +
                            '<textarea id="reply-text-' + id + '" placeholder="Balas komentar..."></textarea>' +
                            '<div class="form-actions" style="margin-top:5px;">' +
                                '<button type="button" class="btn-cancel btn-icon" data-act="reply-cancel" title="Batal" aria-label="Batal" ' + dataAttr + '>' + icon(IKON.tutup) + '</button>' +
                                '<button type="button" class="btn-submit-comment" data-act="reply-send" ' + dataAttr + '>Balas</button>' +
                            '</div>' +
                        '</div>' +
                     '</div>' +
                     '<div id="replies-list-' + id + '" class="replies-list"></div>';
            }
            return h + '</div></div>';
        }

        let dataKomentar = null;
        function gambarKomentar() {
            const data = dataKomentar;
            if (!data) {
                commentsList.innerHTML = '<p class="wp-empty">Belum ada komentar. Jadilah yang pertama!</p>';
                document.getElementById('comment-count').innerText = 0;
                return;
            }
            const keys = Object.keys(data).reverse();
            commentsList.innerHTML = keys.map(k => bangunKomentar(k, data[k], false, '')).join('');
            document.getElementById('comment-count').innerText = keys.length;
            keys.forEach(k => {
                const c = data[k];
                if (!c.replies) return;
                const el = document.getElementById('replies-list-' + k);
                if (el) el.innerHTML = Object.keys(c.replies).map(rk => bangunKomentar(rk, c.replies[rk], true, k)).join('');
            });
        }
        commentsRef.on('value', (snapshot) => { dataKomentar = snapshot.val(); gambarKomentar(); });
        mulaiNamaUid();
        window.addEventListener('luvia-nama-uid', () => { if (dataKomentar) gambarKomentar(); });

        // Satu pendengar klik untuk semua tombol komentar
        commentsList.addEventListener('click', (e) => {
            const b = e.target.closest('[data-act]');
            if (!b) return;
            const act = b.dataset.act, id = b.dataset.id, parent = b.dataset.parent, isReply = b.dataset.reply === '1';
            if (act === 'like') {
                const sudah = localStorage.getItem('liked_' + id);
                refKomentar(id, parent, isReply).child('likes').transaction(n => {
                    if (sudah) { localStorage.removeItem('liked_' + id); return Math.max(0, (n || 1) - 1); }
                    localStorage.setItem('liked_' + id, 'true'); return (n || 0) + 1;
                });
            } else if (act === 'reply' || act === 'reply-cancel') {
                const f = document.getElementById('reply-form-' + id);
                f.style.display = (act === 'reply' && f.style.display === 'none') ? 'flex' : 'none';
            } else if (act === 'reply-send') {
                kirimBalasan(id);
            } else if (act === 'edit') {
                const lama = b.closest('.comment-content').querySelector('.comment-text').textContent;
                tampilInput('Edit komentar Anda:', lama, { judul: 'Edit komentar' }).then(baru => {
                    if (baru !== null && baru.trim() !== '' && baru.trim() !== lama) refKomentar(id, parent, isReply).update({ text: baru.trim() });
                });
            } else if (act === 'del') {
                tampilKonfirmasi('Yakin ingin menghapus komentar ini selamanya?', { judul: 'Hapus komentar', ya: 'Hapus', bahaya: true }).then(ok => {
                    if (ok) {
                        refKomentar(id, parent, isReply).remove();
                        localStorage.removeItem('my_comment_' + id);
                    }
                });
            }
        });

        async function kirimBalasan(parentId) {
            const nameEl = document.getElementById('reply-name-' + parentId);
            const textEl = document.getElementById('reply-text-' + parentId);
            const info = await siapkanPengirimAsync(nameEl ? nameEl.value : ambilNama());
            if (!info.ok) { alert(info.pesan); if (nameEl) nameEl.focus(); return; }
            const isi = textEl.value.trim();
            if (!isi) return;
            if (!info.isAdmin && kolomKomentar) kolomKomentar.segarkan();
            const data = { name: info.nama, uid: idPengguna(), text: isi, timestamp: firebase.database.ServerValue.TIMESTAMP, likes: 0 };
            if (info.isAdmin) data.isAdmin = true;
            const baru = commentsRef.child(parentId).child('replies').push(data);
            localStorage.setItem('my_comment_' + baru.key, 'true');
            if (!info.isAdmin) {
                firebase.database().ref('admin_notifications').push({
                    tipe: 'Balasan Komentar',
                    pesan: info.nama + ' membalas komentar di video "' + currentVid.title + '": "' + isi + '"',
                    timestamp: Date.now(), read: false
                });
            }
            textEl.value = '';
        }

        // Form komentar utama
        kolomKomentar = pasangKolomNama('cm-nama', 'comment-name', 'Komentar sebagai');

        document.getElementById('comment-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('comment-name');
            const textInput = document.getElementById('comment-text');
            const info = await siapkanPengirimAsync(nameInput.value);
            if (!info.ok) { alert(info.pesan); nameInput.focus(); return; }
            const isi = textInput.value.trim();
            if (!isi) return;
            if (!info.isAdmin && kolomKomentar) kolomKomentar.segarkan();

            const data = { name: info.nama, uid: idPengguna(), text: isi, timestamp: firebase.database.ServerValue.TIMESTAMP, likes: 0 };
            if (info.isAdmin) data.isAdmin = true;
            const baru = commentsRef.push(data);
            localStorage.setItem('my_comment_' + baru.key, 'true');

            if (!info.isAdmin) {
                let tipe = 'Komentar Baru';
                if (/@admin|@luvia/i.test(isi)) tipe = 'Mention Admin 🔔';
                else if (isi.includes('@')) tipe = 'Mention Antar Penonton';
                firebase.database().ref('admin_notifications').push({
                    tipe: tipe,
                    pesan: info.nama + ' berkomentar di video "' + currentVid.title + '": "' + isi + '"',
                    timestamp: Date.now(), read: false
                });
            }
            textInput.value = '';
        });
    }

    // =====================================================================
    //  PEMICU & UTILITAS
    // =====================================================================
    window.addEventListener('videoDataReady', () => { if (!halamanSiap) jalankanPemutarVideo(); });
    document.addEventListener('DOMContentLoaded', () => {
        terapkanIkon();
        if (typeof videoListSemua !== 'undefined' && videoListSemua.length && !halamanSiap) jalankanPemutarVideo();
    });

    // Spasi = putar/jeda (tanpa menggulung halaman)
    window.addEventListener('keydown', function (e) {
        if (e.keyCode === 32 && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
            if (window.player) window.player.togglePlay();
        }
    });
    </script>
</body>
</html>
