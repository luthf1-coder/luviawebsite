<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUVIA STUDIO - ADMIN PANEL</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="Asset Foto/Thumbnimail .png">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="videos-data.js"></script>

<style>
        /* TEMA SESUAI WEBSITE UTAMA */
        body { background-color: #0f0f0f; color: #fff; margin: 0; font-family: sans-serif; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #1a1a1a; padding: 40px; border-radius: 12px; text-align: center; width: 90%; max-width: 400px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(255, 145, 77, 0.2); }
        .login-box h2 { color: #ff914d; }
        .login-box input, .admin-form-group input, .admin-form-group textarea, .admin-form-group select { width: 100%; padding: 12px; margin-bottom: 15px; background: #222; border: 1px solid #444; color: white; border-radius: 6px; box-sizing: border-box; }
        .login-box button, .btn-submit-comment { width: 100%; padding: 12px; background: linear-gradient(45deg, #8c52ff, #ff914d); border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .btn-submit-comment:hover { opacity: 0.8; }
        
        #admin-dashboard { display: none; padding: 20px; max-width: 1000px; margin: 0 auto; margin-top: 20px; }
        .tab-container { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 15px; background: #222; border: 1px solid #444; color: white; cursor: pointer; border-radius: 6px; }
        .tab-btn.active { background: linear-gradient(45deg, #8c52ff, #ff914d); color: #fff; font-weight: bold; border: none; }
        .panel { background: #1a1a1a; padding: 25px; border-radius: 12px; border: 1px solid #333; display: none; }
        .panel.active { display: block; }
        .admin-form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #ff914d; font-size: 14px;}
        
        /* DESAIN LIST & TOMBOL HAPUS */
        .list-item { background: #222; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid #8c52ff; }
        .btn-delete { background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight:bold; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2>LUVIA STUDIO ADMIN</h2>
            <input type="password" id="admin-password" placeholder="Kata Sandi..." onkeypress="if(event.key === 'Enter') checkLogin()">
            <button onclick="checkLogin()">Masuk</button>
            <p id="login-error" style="color:#ff4d4d; font-size:13px; display:none;">Sandi Salah!</p>
        </div>
    </div>

    <div id="admin-dashboard">
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px;">
            <h2 style="margin:0; color:#ff914d;">Control Panel</h2>
            <a href="index.html" style="color: #bbb; text-decoration: none;">❮ Ke Website</a>
        </div>

        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('tab-video', this)">➕ Tambah Video</button>
            <button class="tab-btn" onclick="switchTab('tab-buat-program', this)">📺 Buat Program Baru</button>
            <button class="tab-btn" onclick="switchTab('tab-isi-program', this)">📂 Video ke Program</button>
            <button class="tab-btn" onclick="switchTab('tab-komplain', this)">💬 Support & Notif (HP)</button>
        </div>

        <!-- 1. TAMBAH VIDEO -->
        <div id="tab-video" class="panel active">
            <h3 style="margin-top:0;">Tambah Video Manual</h3>
            <div class="admin-form-group"><label>ID Video (opsional, cth: vid_spesial_1)</label><input type="text" id="vid-id" placeholder="Biarkan kosong untuk ID otomatis..."></div>
            <div class="admin-form-group"><label>Judul Video</label><input type="text" id="vid-title" placeholder="Judul..."></div>
            <div class="admin-form-group"><label>Link Thumbnail</label><input type="text" id="vid-thumb" placeholder="https://..."></div>
            
            <div class="admin-form-group">
                <label>Sumber / Jenis Video</label>
                <select id="vid-type" style="width: 100%; padding: 12px; margin-bottom: 15px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px;">
                    <option value="youtube">YouTube (Cukup masukkan Link YT / ID)</option>
                    <option value="drive">Google Drive (Link Preview/View)</option>
                    <option value="rumble">Rumble (Link Embed)</option>
                    <option value="other">Bebas / Archive.org (Link Direct MP4)</option>
                </select>
            </div>
            
            <div class="admin-form-group"><label>Link Video / ID</label><input type="text" id="vid-url" placeholder="Tempel link atau ID di sini..."></div>
            <div class="admin-form-group"><label>Link Download (Opsional)</label><input type="text" id="vid-download" placeholder="https://..."></div>
            <div class="admin-form-group"><label>Genre</label><input type="text" id="vid-genre" placeholder="Anime, Film Komedi..."></div>
            <div class="admin-form-group"><label>Deskripsi</label><textarea id="vid-desc" placeholder="Tulis deskripsi..."></textarea></div>
            <button class="btn-submit-comment" onclick="simpanVideo()">Upload Video</button>
            
            <div id="list-hapus-vid"></div> <!-- Tempat daftar video untuk dihapus -->
        </div>

        <!-- 2. BUAT PROGRAM -->
        <div id="tab-buat-program" class="panel">
            <div class="admin-form-group"><label>ID Program (tanpa spasi)</label><input type="text" id="prog-id" placeholder="bioskop_malam"></div>
            <div class="admin-form-group"><label>Nama Program</label><input type="text" id="prog-title" placeholder="Bioskop Liburan..."></div>
            <div class="admin-form-group"><label>Link Banner</label><input type="text" id="prog-banner" placeholder="https://..."></div>
            <div class="admin-form-group"><label>Jadwal</label><input type="text" id="prog-schedule"></div>
            <div class="admin-form-group"><label>Deskripsi</label><textarea id="prog-desc"></textarea></div>
            <button class="btn-submit-comment" onclick="buatProgramBaru()">Buat Program TV</button>
        </div>

        <!-- 3. ISI KE PROGRAM -->
        <div id="tab-isi-program" class="panel">
            <div class="admin-form-group"><label>Pilih Program</label><select id="select-prog"></select></div>
            <div class="admin-form-group"><label>Pilih Video</label><select id="select-vid"></select></div>
            <button class="btn-submit-comment" onclick="masukkanVideoKeProgram()">Tambahkan ke Playlist</button>
        </div>

        <!-- 4. SUPPORT & NOTIF -->
        <div id="tab-komplain" class="panel">
            <h3 style="margin-top:0;">Pusat Notifikasi HP & Komplain</h3>
            <div style="display:flex; gap:20px; flex-wrap:wrap;">
                <div style="flex:1; min-width:300px;">
                    <h4 style="color:#ff914d;">Daftar Komplain</h4>
                    <div id="admin-complaint-list" style="max-height:400px; overflow-y:auto;">Memuat...</div>
                </div>
                <div style="flex:1; min-width:300px; background:#111; padding:15px; border-radius:8px;">
                    <h4 style="color:#53fc18;">🔔 Aktivitas Penonton</h4>
                    <div id="admin-notif-list" style="max-height:350px; overflow-y:auto;">Memuat...</div>
                    <button onclick="tandaiSemuaDibaca()" style="background:#333; color:white; border:none; padding:8px; width:100%; margin-top:10px;">Tandai Semua Dibaca</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT UTAMA -->
<script>
        const passwordAdmin = "luthfi"; 
        let waktuLoginAdmin = 0;

        // DAFTARKAN MESIN NOTIFIKASI BROWSER HP (sw.js)
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

        function mintaIzinNotifikasi() {
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") { munculkanNotifHP("Notifikasi Aktif!", "Siap menerima laporan penonton."); }
                });
            }
        }

        function munculkanNotifHP(judul, isi) {
            if (Notification.permission === "granted") {
                navigator.serviceWorker.ready.then(reg => {
                    reg.showNotification(judul, { body: isi, icon: "Asset Foto/Thumbnimail .png", badge: "Asset Foto/Thumbnimail .png", vibrate: [200, 100, 200] });
                });
            }
        }

        function checkLogin() {
            if (document.getElementById('admin-password').value === passwordAdmin) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                waktuLoginAdmin = Date.now();
                mintaIzinNotifikasi();
                setTimeout(muatPilihanDropdown, 1500); 
                jalankanPantauanNotif();
                muatDaftarHapus(); // Tampilkan data untuk bisa dihapus
            } else { document.getElementById('login-error').style.display = 'block'; }
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

    // FUNGSI UPLOAD VIDEO (AUTO DETEKSI LINK)
        function simpanVideo() {
            const title = document.getElementById('vid-title').value.trim();
            let url = document.getElementById('vid-url').value.trim();
            if(!title || !url) { alert("Judul dan Link Video wajib diisi!"); return; }

            const id = document.getElementById('vid-id').value.trim() || "manual_" + Date.now();
            const type = document.getElementById('vid-type').value;
            const downloadUrl = document.getElementById('vid-download').value.trim();
            
            let ytId = "", driveEmbed = "", rumbleEmbed = "", archiveSrc = "";

            // LOGIKA PEMBAGIAN SUMBER LINK
            if (type === "youtube") {
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = url.match(regExp);
                ytId = (match && match[2].length === 11) ? match[2] : url; // Ambil ID otomatis
            } else if (type === "drive") {
                driveEmbed = url;
            } else if (type === "rumble") {
                rumbleEmbed = url;
            } else {
                archiveSrc = url; // Untuk archive.org / mp4 bebas
            }
            
            const newData = {
                id: id, title: title, thumb: document.getElementById('vid-thumb').value, 
                sources: [], driveEmbed: driveEmbed, youtubeId: ytId, rumbleEmbed: rumbleEmbed, archiveSrc: archiveSrc, 
                downloadUrl: downloadUrl || archiveSrc || driveEmbed, 
                description: document.getElementById('vid-desc').value, genre: document.getElementById('vid-genre').value, 
                uploadDate: new Date().toISOString().split('T')[0], defaultViews: 0
            };

            firebase.database().ref('videos_manual/' + id).set(newData).then(() => { 
                alert('Upload Sukses! Struktur data sudah sesuai.'); 
                document.getElementById('vid-title').value = ''; document.getElementById('vid-url').value = ''; 
                muatPilihanDropdown(); muatDaftarHapus();
            });
        }

        // FUNGSI HAPUS DATA ADMIN
        function hapusData(path) {
            if(confirm("Yakin ingin menghapus data ini secara permanen dari website?")) {
                firebase.database().ref(path).remove().then(() => alert("Berhasil dihapus!"));
            }
        }

        // ==========================================
        // PANTAUAN SUPPORT, NOTIFIKASI & FITUR HAPUS
        // ==========================================
        function jalankanPantauanNotif() {
            // Tampilkan Komplain dengan Tombol Hapus
            firebase.database().ref('complaints').on('value', snap => {
                const data = snap.val();
                let html = '';
                if(data) {
                    Object.keys(data).reverse().forEach(k => {
                        const c = data[k];
                        const borderWarna = c.jawaban_admin ? '#53fc18' : '#ff914d';
                        
                        html += `
                        <div style="background:#222; padding:12px; margin-bottom:10px; border-left:4px solid ${borderWarna}; position:relative;">
                            <button style="position:absolute; right:10px; top:10px; background:#ff4d4d; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;" onclick="hapusData('complaints/${k}')">Hapus</button>
                            <div style="color:#bbb; font-size:12px;">Dari: <strong>${c.nama}</strong></div>
                            <div style="margin:8px 0;">"${c.isi}"</div>`;
                            
                        if(!c.jawaban_admin) {
                            html += `
                            <div style="display:flex; gap:10px;">
                                <input type="text" id="jawab-${k}" placeholder="Tulis jawaban admin..." style="flex:1; padding:8px; background:#111; color:white;">
                                <button onclick="jawabKomplain('${k}')" style="background:#00a884; border:none; color:white; padding:0 15px; cursor:pointer;">Balas</button>
                            </div>`;
                        } else {
                            html += `<div style="background:#111; padding:8px; color:#53fc18; font-size:13px;">Dijawab: ${c.jawaban_admin}</div>`;
                        }
                        html += `</div>`;
                    });
                }
                document.getElementById('admin-complaint-list').innerHTML = html || 'Tidak ada komplain.';
            });

            // Tampilkan Notifikasi dengan Tombol Silang Hapus
            firebase.database().ref('admin_notifications').on('value', snap => {
                const data = snap.val();
                let html = '';
                if(data) {
                    Object.keys(data).reverse().forEach(k => {
                        const n = data[k];
                        const dot = n.read ? '' : '<span style="color:#ff4d4d; font-size:20px; line-height:0;">•</span>';
                        html += `
                        <div style="padding:10px; border-bottom:1px solid #222; opacity: ${n.read ? '0.5' : '1'}; position:relative;">
                            <button style="position:absolute; right:5px; top:5px; background:transparent; color:#ff4d4d; border:none; cursor:pointer;" onclick="hapusData('admin_notifications/${k}')">✖</button>
                            <div style="font-size:12px; color:#ff914d;">${n.tipe} ${dot}</div>
                            <div style="font-size:13px; margin-top:4px;">${n.pesan}</div>
                        </div>`;
                    });
                }
                document.getElementById('admin-notif-list').innerHTML = html || 'Belum ada.';
            });

            // Pop-up Notif HP
            firebase.database().ref('complaints').on('child_added', snap => {
                const c = snap.val();
                if (c.timestamp > waktuLoginAdmin && !c.jawaban_admin) { munculkanNotifHP("Komplain dari " + c.nama, c.isi); }
            });
            firebase.database().ref('admin_notifications').on('child_added', snap => {
                const n = snap.val();
                if (n.timestamp > waktuLoginAdmin && !n.read) { munculkanNotifHP("LUVIA: " + n.tipe, n.pesan); }
            });
        }
        
        // Memuat Daftar Video untuk Dihapus
        function muatDaftarHapus() {
            firebase.database().ref('videos_manual').on('value', snap => {
                let html = '<h4 style="color:#ff4d4d; margin-top:20px;">Hapus Video (Upload Manual)</h4>';
                if(snap.exists()) {
                    const data = snap.val();
                    Object.keys(data).forEach(k => { html += `<div style="display:flex; justify-content:space-between; background:#222; padding:10px; margin-bottom:5px;"><span>${data[k].title}</span> <button style="background:#ff4d4d; color:white; border:none; padding:4px 8px; cursor:pointer;" onclick="hapusData('videos_manual/${k}')">Hapus</button></div>`; });
                }
                document.getElementById('list-hapus-vid').innerHTML = html;
            });
        }

        // ==========================================
        // FITUR 2: BUAT PROGRAM & MASUKKAN VIDEO
        // ==========================================
        function buatProgramBaru() {
            const id = document.getElementById('prog-id').value.replace(/\s+/g, '_').toLowerCase();
            if(!id) return alert("ID Program wajib diisi!");
            firebase.database().ref('programs_info/' + id).set({
                id: id, title: document.getElementById('prog-title').value, 
                banner: document.getElementById('prog-banner').value, 
                schedule: document.getElementById('prog-schedule').value, 
                desc: document.getElementById('prog-desc').value
            }).then(() => { alert('Program Berhasil Dibuat!'); muatPilihanDropdown(); muatDaftarHapus(); });
        }

        function muatPilihanDropdown() {
            const selVid = document.getElementById('select-vid');
            if(typeof videoList !== 'undefined') {
                selVid.innerHTML = ''; [...videoList].reverse().forEach(v => selVid.innerHTML += `<option value="${v.id}">${v.title}</option>`);
            }
            firebase.database().ref('programs_info').once('value', snap => {
                const selProg = document.getElementById('select-prog');
                selProg.innerHTML = '';
                if(snap.exists()) {
                    const progs = snap.val(); Object.keys(progs).forEach(k => selProg.innerHTML += `<option value="${k}">${progs[k].title}</option>`);
                }
            });
        }

        function masukkanVideoKeProgram() {
            const prog = document.getElementById('select-prog').value;
            const vid = document.getElementById('select-vid').value;
            firebase.database().ref('program_playlists/' + prog + '/' + vid).set(true).then(() => alert('Berhasil Dimasukkan ke Playlist Program TV!'));
        }

        // ==========================================
        // FITUR 3: HAPUS VIDEO, PROGRAM, DAN KOMPLAIN
        // ==========================================
        // Tambahkan div ini secara virtual di bawah form input pada admin.html menggunakan JS (tanpa ubah HTML)
        function muatDaftarHapus() {
            // Hapus Video Manual
            firebase.database().ref('videos_manual').on('value', snap => {
                let html = '<h4 style="color:#ff4d4d; border-top:1px solid #333; margin-top:20px; padding-top:10px;">Hapus Video Manual</h4>';
                if(snap.exists()) {
                    const data = snap.val();
                    Object.keys(data).forEach(k => {
                        html += `<div class="list-item"><span>${data[k].title}</span> <button class="btn-delete" onclick="hapusData('videos_manual/${k}')">Hapus</button></div>`;
                    });
                }
                if(!document.getElementById('list-hapus-vid')) {
                    const div = document.createElement('div'); div.id = 'list-hapus-vid'; document.getElementById('tab-video').appendChild(div);
                }
                document.getElementById('list-hapus-vid').innerHTML = html;
            });

            // Hapus Program TV
            firebase.database().ref('programs_info').on('value', snap => {
                let html = '<h4 style="color:#ff4d4d; border-top:1px solid #333; margin-top:20px; padding-top:10px;">Hapus Program TV</h4>';
                if(snap.exists()) {
                    const data = snap.val();
                    Object.keys(data).forEach(k => {
                        html += `<div class="list-item"><span>${data[k].title}</span> <button class="btn-delete" onclick="hapusData('programs_info/${k}'); hapusData('program_playlists/${k}')">Hapus</button></div>`;
                    });
                }
                if(!document.getElementById('list-hapus-prog')) {
                    const div = document.createElement('div'); div.id = 'list-hapus-prog'; document.getElementById('tab-buat-program').appendChild(div);
                }
                document.getElementById('list-hapus-prog').innerHTML = html;
            });
        }

        function hapusData(path) {
            if(confirm("Yakin ingin menghapus ini secara permanen?")) {
                firebase.database().ref(path).remove().then(() => alert("Berhasil dihapus!"));
            }
        }

        // ==========================================
        // FITUR 4: SUPPORT (KOMPLAIN) PERMANEN & BISA DIHAPUS ADMIN
        // ==========================================
        function jalankanPantauanNotif() {
            firebase.database().ref('complaints').on('value', snap => {
                const data = snap.val();
                let html = '';
                if(data) {
                    Object.keys(data).reverse().forEach(k => {
                        const c = data[k];
                        const warnaBorder = c.jawaban_admin ? '#00a884' : '#ff914d';
                        const status = c.jawaban_admin ? '(Telah Dijawab)' : '(Menunggu)';
                        
                        html += `
                        <div style="background:#222; padding:12px; margin-bottom:10px; border-left:4px solid ${warnaBorder}; position:relative;">
                            <button class="btn-delete" style="position:absolute; right:10px; top:10px;" onclick="hapusData('complaints/${k}')">Hapus</button>
                            <div style="color:#bbb; font-size:12px;">Dari: <strong>${c.nama}</strong> <span style="color:${warnaBorder}">${status}</span></div>
                            <div style="margin:8px 0; font-style:italic;">"${c.isi}"</div>
                        `;
                        
                        // Form Balas (jika belum dibalas) atau Teks Jawaban (jika sudah dibalas)
                        if(!c.jawaban_admin) {
                            html += `
                            <div style="display:flex; gap:10px; margin-top:10px;">
                                <input type="text" id="jawab-${k}" placeholder="Tulis jawaban resmi admin..." style="flex:1; padding:8px; background:#111; color:white; border:1px solid #444; border-radius:4px;">
                                <button onclick="jawabKomplain('${k}')" style="background:linear-gradient(45deg, #8c52ff, #ff914d); border:none; color:white; padding:0 15px; border-radius:4px; font-weight:bold; cursor:pointer;">Kirim Balasan</button>
                            </div>`;
                        } else {
                            html += `<div style="background:#111; padding:8px; border-radius:4px; color:#53fc18; font-size:13px;"><strong>Admin:</strong> ${c.jawaban_admin}</div>`;
                        }
                        html += `</div>`;
                    });
                }
                document.getElementById('admin-complaint-list').innerHTML = html || 'Tidak ada komplain masuk.';
            });

            // Pantau Pop-up Notif Komplain HP
            firebase.database().ref('complaints').on('child_added', snap => {
                const c = snap.val();
                if (c.timestamp > waktuLoginAdmin && !c.jawaban_admin) { munculkanNotifHP("Komplain dari " + c.nama, c.isi); }
            });
            
            // Notifikasi Lain (Mention dll) - Tetap sama
            firebase.database().ref('admin_notifications').on('value', snap => {
                const data = snap.val();
                let html = '';
                if(data) {
                    Object.keys(data).reverse().forEach(k => {
                        const n = data[k];
                        const dot = n.read ? '' : '<span style="color:#ff4d4d; font-size:20px; line-height:0;">•</span>';
                        html += `<div style="padding:10px; border-bottom:1px solid #222; opacity: ${n.read ? '0.5' : '1'};">
                            <div style="font-size:12px; color:#ff914d;">${n.tipe} ${dot}</div>
                            <div style="font-size:13px; margin-top:4px;">${n.pesan}</div>
                        </div>`;
                    });
                }
                document.getElementById('admin-notif-list').innerHTML = html || 'Belum ada.';
            });
        }

        function jawabKomplain(id) {
            const j = document.getElementById(`jawab-${id}`).value;
            if(!j) return;
            // Ini akan mengupdate Firebase, otomatis tayang permanen di index.html penonton
            firebase.database().ref('complaints/' + id).update({ jawaban_admin: j, answered_at: Date.now() });
        }

        function tandaiSemuaDibaca() {
            firebase.database().ref('admin_notifications').once('value', snap => {
                const data = snap.val();
                if(data) {
                    let updates = {};
                    Object.keys(data).forEach(k => { updates[k + '/read'] = true; });
                    firebase.database().ref('admin_notifications').update(updates);
                }
            });
        }
    </script>
</body>
</html>
