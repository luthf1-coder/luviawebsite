<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAFTAR VIDEO - LUVIA STUDIO OFFICIAL TV</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="Asset Foto/Thumbnimail .png">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <nav>
        <div class="container nav-container">
            <button class="hamburger-menu" onclick="toggleSidebar()" title="Menu">☰</button>
            <div class="nav-history-controls">
                <button onclick="history.back()" class="btn-nav-history" title="Kembali">←</button>
                <button onclick="history.forward()" class="btn-nav-history" title="Maju">→</button>
            </div>
            <!-- FORM PENCARIAN BARU -->
            <form class="nav-search" id="navSearchForm" onsubmit="return false;">
                <input type="text" id="navSearchInput" placeholder="Cari video..." aria-label="Cari" autocomplete="off">
                <button type="submit">🔍</button>
                
                <!-- Boks Dropdown Hasil Pencarian Langsung (Menimpa Konten) -->
                <div class="search-dropdown-list" id="searchDropdownList"></div>
            </form>
        </div>
    </nav>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>MENU</h2>
            <button class="close-btn" onclick="toggleSidebar()">&times;</button>
        </div>
        <div class="sidebar-links">
            <a href="index.html" onclick="toggleSidebar()">Beranda</a>
            <a href="videos.html" onclick="toggleSidebar()">Video</a>
            <a href="index.html#projects" onclick="toggleSidebar()">Program TV</a>
            <a href="index.html#livestreaming" onclick="toggleSidebar()">Live Streaming</a>
            <a href="index.html#about" onclick="toggleSidebar()">Tentang</a>
            <a href="index.html#contact" onclick="toggleSidebar()">Social Media</a>
        </div>
        <div class="sidebar-footer">
            <p>&copy; 2026 LUVIA STUDIO TV All Right Reserved</p>
        </div>
    </div>

    <header class="header-banner" style="margin-top: 60px;"></header>
    
    <section class="section page-stream-container">
        <div class="container">
            <h2 class="stream-title">Semua Video Tersedia</h2>
            
            <!-- FITUR BARU: FILTER GENRE DROPDOWN -->
            <div class="filter-wrapper">
                <div class="dropdown-container">
                    <button class="btn-dropdown" id="genreDropdownBtn" onclick="toggleDropdown(event)">Cari berdasarkan genre ▼</button>
                    <!-- Daftar genre akan muncul di sini via Javascript -->
                    <div class="dropdown-list" id="genreDropdownList"></div>
                </div>
            </div>

            <!-- GRID KARTU VIDEO -->
            <div class="videos-page-grid" id="all-videos-container"></div>
            
            <!-- FITUR BARU: PAGINASI / HALAMAN -->
            <div id="pagination-container" class="pagination-container"></div>
        </div>
    </section>

    <section id="contact" class="section">
        <div class="container">
            <h2>Follow Us</h2>
            <div class="contact-links">
                <p><a href="https://www.youtube.com/@luthfi-fx" target="_blank" class="btn btn-contact">YOUTUBE</a></p>
                <p><a href="https://www.instagram.com/fauzanlathif_86" target="_blank" class="btn btn-contact">INSTAGRAM</a></p>
                <p><a href="https://www.tiktok.com/@fauzan_lathif" target="_blank" class="btn btn-contact">TIKTOK</a></p>
                <p><a href="https://www.dubbindo.site/@luviastudioofficialtv" target="_blank" class="btn btn-contact">UVIDEO DUBBINDO</a></p>
            </div>
        </div>
    </section>
    
    <footer>
        <div class="container">
            <p>&copy; 2026 LUVIA STUDIO TV All Right Reserved | Channel Ini Dikelola Oleh TIM MEDIA CENTER LS MEDIA</p>
        </div>
    </footer>

    <!-- Muat data video terlebih dahulu -->
    <script src="videos-data.js"></script>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }
        
        let currentFilteredList = [];
        let currentPage = 1;
        const itemsPerPage = 12; // Maksimal 12 Kartu Video per Halaman

        function initVideosPage() {
            // 1. Urutkan dari yang terbaru ke terlama
            const sortedList = [...videoList].sort((a, b) => {
                const dateA = a.uploadDate ? new Date(a.uploadDate) : new Date(0);
                const dateB = b.uploadDate ? new Date(b.uploadDate) : new Date(0);
                return dateB - dateA;
            });

            // 2. Buat isi Dropdown Genre Otomatis
            const genres = [...new Set(sortedList.map(v => v.genre).filter(Boolean))];
            const genreList = document.getElementById('genreDropdownList');
            
            let genreHtml = `<div class="dropdown-item active" onclick="filterByGenre('Semua', this)">Semua Genre</div>`;
            genres.forEach(g => {
                genreHtml += `<div class="dropdown-item" onclick="filterByGenre('${g}', this)">${g}</div>`;
            });
            genreList.innerHTML = genreHtml;

            // 3. Cek URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const searchQuery = urlParams.get('search');
            const genreQuery = urlParams.get('genre');

            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                currentFilteredList = sortedList.filter(vid => 
                    vid.title.toLowerCase().includes(q) || 
                    (vid.description && vid.description.toLowerCase().includes(q))
                );
                document.querySelector('.stream-title').innerText = `Hasil Pencarian: "${searchQuery}" (${currentFilteredList.length})`;
                const inputField = document.querySelector('.nav-search input');
                if(inputField) inputField.value = searchQuery;
            } else if (genreQuery) {
                currentFilteredList = sortedList.filter(vid => 
                    vid.genre && vid.genre.toLowerCase() === genreQuery.toLowerCase()
                );
                document.querySelector('.stream-title').innerText = `Genre: ${genreQuery} (${currentFilteredList.length})`;
                updateActiveDropdownItem(genreQuery);
            } else {
                currentFilteredList = sortedList;
            }

            renderPage(1);
        }

        // --- SISTEM DROPDOWN ---
        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById('genreDropdownList').classList.toggle('show');
        }

        // Tutup dropdown jika klik di luar area
        window.onclick = function(event) {
            if (!event.target.matches('.btn-dropdown')) {
                const dropdowns = document.getElementsByClassName("dropdown-list");
                for (let i = 0; i < dropdowns.length; i++) {
                    if (dropdowns[i].classList.contains('show')) {
                        dropdowns[i].classList.remove('show');
                    }
                }
            }
        }

        // FUNGSI KLIK ITEM GENRE PADA DROPDOWN
        function filterByGenre(genre, element) {
            // Ubah class active di item
            document.querySelectorAll('.dropdown-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');
            else updateActiveDropdownItem(genre);

            // Ubah teks tombol Dropdown
            const btn = document.getElementById('genreDropdownBtn');
            if (genre === 'Semua' || genre === 'Semua Genre') {
                btn.innerHTML = `Cari berdasarkan genre ▼`;
            } else {
                btn.innerHTML = `Genre: ${genre} ▼`;
            }

            // Urutkan ulang lalu filter
            const sortedList = [...videoList].sort((a, b) => {
                const dateA = a.uploadDate ? new Date(a.uploadDate) : new Date(0);
                const dateB = b.uploadDate ? new Date(b.uploadDate) : new Date(0);
                return dateB - dateA;
            });

            if (genre === 'Semua' || genre === 'Semua Genre') {
                currentFilteredList = sortedList;
                document.querySelector('.stream-title').innerText = `Semua Video Tersedia`;
            } else {
                currentFilteredList = sortedList.filter(vid => vid.genre === genre);
                document.querySelector('.stream-title').innerText = `Genre: ${genre} (${currentFilteredList.length})`;
            }

            // Kembalikan ke halaman 1
            renderPage(1);
        }

        // Fungsi bantuan update tampilan aktif
        function updateActiveDropdownItem(genre) {
            document.querySelectorAll('.dropdown-item').forEach(el => {
                if(el.innerText.toLowerCase() === genre.toLowerCase() || (genre === 'Semua' && el.innerText === 'Semua Genre')) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
            
            const btn = document.getElementById('genreDropdownBtn');
            if (genre === 'Semua' || genre === 'Semua Genre') {
                btn.innerHTML = `Cari berdasarkan genre ▼`;
            } else {
                btn.innerHTML = `Genre: ${genre} ▼`;
            }
        }

        // FUNGSI RENDER HALAMAN (PAGINASI)
        function renderPage(page) {
            currentPage = page;
            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageItems = currentFilteredList.slice(startIndex, endIndex);

            renderAllVideosPage('all-videos-container', pageItems);
            renderPaginationControls();
        }

        // FUNGSI MEMBUAT TOMBOL HALAMAN 1, 2, NEXT, PREV
        function renderPaginationControls() {
            const totalPages = Math.ceil(currentFilteredList.length / itemsPerPage);
            const container = document.getElementById('pagination-container');
            
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = `<button class="btn-page" ${currentPage === 1 ? 'disabled' : ''} onclick="renderPage(${currentPage - 1})">❮ Prev</button>`;
            for(let i = 1; i <= totalPages; i++) {
                html += `<button class="btn-page ${currentPage === i ? 'active' : ''}" onclick="renderPage(${i})">${i}</button>`;
            }
            html += `<button class="btn-page" ${currentPage === totalPages ? 'disabled' : ''} onclick="renderPage(${currentPage + 1})">Next ❯</button>`;
            
            container.innerHTML = html;
        }

        // Jalankan saat load
        document.addEventListener('DOMContentLoaded', initVideosPage);
 // ==========================================
// SISTEM PENCARIAN LIVE (AUTOCOMPLETE) 
// ==========================================
document.addEventListener('DOMContentLoaded', () => {
    const searchInput = document.getElementById('navSearchInput');
    const searchDropdown = document.getElementById('searchDropdownList');
    const searchForm = document.getElementById('navSearchForm');

    if (searchInput && searchDropdown) {
        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            if (query.length === 0) { searchDropdown.classList.remove('show'); return; }

            if (typeof videoList !== 'undefined') {
                const results = videoList.filter(vid => 
                    (vid.title && vid.title.toLowerCase().includes(query)) || 
                    (vid.genre && vid.genre.toLowerCase().includes(query)) ||
                    (vid.uploadDate && vid.uploadDate.includes(query)) ||
                    (vid.description && vid.description.toLowerCase().includes(query))
                ).slice(0, 6); 

                if (results.length > 0) {
                    let html = '';
                    results.forEach(vid => {
                        // PERBAIKAN: Pasang span dengan ID khusus untuk menampung view dari Firebase
                        html += `
                            <a href="watch.html?id=${vid.id}" class="search-result-item">
                                <img src="${vid.thumb}" alt="Thumbnail">
                                <div class="search-result-info">
                                    <h4>${vid.title}</h4>
                                    <p>${vid.genre || 'Umum'} • <span id="search-view-${vid.id}">Memuat...</span></p>
                                </div>
                            </a>
                        `;
                    });
                    searchDropdown.innerHTML = html;
                    searchDropdown.classList.add('show');

                    // PERBAIKAN: Panggil Firebase untuk mengubah angka 0 menjadi views yang asli!
                    results.forEach(vid => {
                        if (typeof listenVideoViews === 'function') {
                            listenVideoViews(vid.id, vid.defaultViews || 0, (totalViews) => {
                                const viewEl = document.getElementById(`search-view-${vid.id}`);
                                if (viewEl) viewEl.innerText = `${formatViews(totalViews)}`;
                            });
                        }
                    });

                } else {
                    searchDropdown.innerHTML = `<div style="padding: 15px; text-align: center; color: #bbb; font-size: 0.85rem;">Tidak ada video "${query}"</div>`;
                    searchDropdown.classList.add('show');
                }
            }
        });

        document.addEventListener('click', function(e) {
            if (!searchForm.contains(e.target)) searchDropdown.classList.remove('show');
        });

        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const q = searchInput.value.trim();
            if (q) {
                const isVideosPage = window.location.pathname.endsWith('videos.html') || window.location.pathname === '/' || window.location.pathname.endsWith('/');
                if (isVideosPage && typeof executeSearchOnHome === 'function') {
                    executeSearchOnHome(q);
                    searchDropdown.classList.remove('show');
                } else {
                    window.location.href = `videos.html?search=${encodeURIComponent(q)}`;
                }
            }
        });
    }
});
    </script>
</body>
</html>
